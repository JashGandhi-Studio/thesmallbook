<style>
  :root { --yel: #FFC800; --ink: #16130F; --paper: #FBF8F1; --mu: #6E6658; --line: #ECE5D6; --ease: cubic-bezier(.16,1,.3,1); }
  html, body, html.film body, html.dark body { margin: 0; height: 100%; background: #0E0C09 !important; color: #F4EFE6; font-family: "Space Grotesk", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #tsbBar, .tsb-bar { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sc-stage { position: fixed; inset: 0; }
  .sc-stage video, .sc-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sc-frame { position: fixed; left: 50%; top: 45%; width: min(64vw, 300px); aspect-ratio: 2 / 3; transform: translate(-50%, -50%); border-radius: 22px; box-shadow: 0 0 0 200vmax rgba(14, 12, 9, .52); transition: transform .5s var(--ease), box-shadow .3s; pointer-events: none; }
  .sc-frame i { position: absolute; width: 34px; height: 34px; border: 4px solid var(--yel); }
  .sc-frame i:nth-child(1) { left: -2px; top: -2px; border-right: 0; border-bottom: 0; border-radius: 22px 0 0 0; }
  .sc-frame i:nth-child(2) { right: -2px; top: -2px; border-left: 0; border-bottom: 0; border-radius: 0 22px 0 0; }
  .sc-frame i:nth-child(3) { left: -2px; bottom: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 22px; }
  .sc-frame i:nth-child(4) { right: -2px; bottom: -2px; border-left: 0; border-top: 0; border-radius: 0 0 22px 0; }
  .sc-frame b { position: absolute; left: 8%; right: 8%; top: 10%; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--yel), transparent); opacity: 0; }
  body.is-live .sc-frame b { opacity: .9; animation: scLine 2.4s var(--ease) infinite alternate; }
  body.is-busy .sc-frame { transform: translate(-50%, -50%) scale(.96); }
  body.is-busy .sc-frame b { animation-duration: .9s; }
  @keyframes scLine { from { transform: translateY(0); } to { transform: translateY(calc(min(64vw, 300px) * 1.5 * .8)); } }
  .sc-top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; align-items: center; gap: 12px; z-index: 5; }
  .sc-top h1 { flex: 1; margin: 0; text-align: center; font: 600 17px "Space Grotesk", sans-serif; color: #F4EFE6 !important; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .sc-ib { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(22, 19, 15, .55); color: #F4EFE6; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; padding: 0; }
  .sc-ib[aria-pressed="true"] { background: var(--yel); color: var(--ink); }
  .sc-ib[hidden] { display: grid; visibility: hidden; }
  .sc-hint { color: #F4EFE6; position: fixed; left: 50%; top: calc(45% + min(64vw, 300px) * .75 + 18px); transform: translateX(-50%); z-index: 4; padding: 10px 16px; border-radius: 999px; background: rgba(22, 19, 15, .62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font: 500 14px "Space Grotesk", sans-serif; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .sc-hint s { width: 8px; height: 8px; border-radius: 50%; background: #5BD18B; display: none; }
  body.is-live .sc-hint s { display: inline-block; }
  .sc-dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 28px calc(env(safe-area-inset-bottom, 0px) + 26px); display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .sc-shut { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #F4EFE6; background: transparent; padding: 5px; cursor: pointer; }
  .sc-shut span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--yel); transition: transform .2s var(--ease); }
  .sc-shut:active span { transform: scale(.88); }
  body.is-busy .sc-shut { opacity: .5; pointer-events: none; }
  .sc-ib--lg { width: 52px; height: 52px; }
  /* sheets */
  .sc-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 86vh; overflow-y: auto; box-sizing: border-box; background: var(--paper); color: var(--ink); border-radius: 28px 28px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateY(105%); transition: transform .42s var(--ease); box-shadow: 0 -16px 40px rgba(0,0,0,.35); }

  html.dark .sc-grab { background: #3A332B; }
  .sc-hit { display: flex; gap: 16px; align-items: center; }
  .sc-hit img { width: 84px; height: 126px; object-fit: cover; border-radius: 6px; box-shadow: 0 10px 24px -8px rgba(22,19,15,.45); flex: none; background: var(--line); }
  .sc-k { font: 600 13px "Space Grotesk", sans-serif; color: #8A5A00; margin: 0 0 4px; }
  html.dark .sc-k { color: #E9C46A; }
  .sc-t { font: 600 26px/1.12 Newsreader, Georgia, serif; margin: 0; }
  .sc-a { margin: 6px 0 0; color: var(--mu); font-size: 15px; }
  html.dark .sc-a, html.dark .sc-p { color: #ABA293; }
  .sc-p { margin: 4px 0 12px; color: var(--mu); font-size: 15px; line-height: 1.45; }
  .sc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .sc-btn { min-height: 52px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: inherit; font: 700 16px "Space Grotesk", sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; box-sizing: border-box; width: 100%; }
  html.dark .sc-btn { border-color: #3A332B; }
  .sc-btn--y { background: var(--yel); border-color: var(--yel); color: var(--ink); }
  .sc-link { display: block; margin: 14px auto 0; background: none; border: 0; color: inherit; font: 600 15px "Space Grotesk", sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }
  .sc-in { width: 100%; box-sizing: border-box; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 0 16px; font: 500 16px "Space Grotesk", sans-serif; outline: none; }
  .sc-in:focus { box-shadow: 0 0 0 3px rgba(255, 200, 0, .5); }
  html.dark .sc-in { background: #2A251F; border-color: #3A332B; color: #F4EFE6; }
  .sc-list { margin: 8px 0 0; padding: 0; list-style: none; }
  .sc-list button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 6px; border: 0; background: none; color: inherit; text-align: left; border-radius: 12px; cursor: pointer; font: inherit; }
  .sc-list button:hover { background: rgba(110, 102, 88, .1); }
  .sc-list img { width: 34px; height: 51px; object-fit: cover; border-radius: 4px; flex: none; background: var(--line); }
  .sc-list b { display: block; font-size: 15px; font-weight: 600; }
  .sc-list small { color: var(--mu); font-size: 13px; }
  html.dark .sc-list small { color: #ABA293; }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sc-chips button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; font: 600 14px "Space Grotesk", sans-serif; cursor: pointer; }
  html.dark .sc-chips button { border-color: #3A332B; }
  .sc-scrim { position: fixed; inset: 0; z-index: 9; background: rgba(14, 12, 9, .35); opacity: 0; pointer-events: none; transition: opacity .3s; }

    <button class="sc-shut" id="scShut" type="button" aria-label="Find this book"><span></span></button>
    <button class="sc-ib sc-ib--lg" id="scType" type="button" aria-label="Type the title"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  </nav>
  <div class="sc-scrim" id="scScrim"></div>

    <div class="sc-grab"></div>

  </section>

    <div class="sc-row"><button class="sc-btn sc-btn--y" type="button" id="nReq">Ask for this book</button><button class="sc-btn" type="button" id="nAgain" data-again>Scan again</button></div>
  </section>
  <h1 class="sr-only">Scan a book, TheSmallBook</h1>
<script>
/* ============================================================
   TheSmallBook scanner (v334 rebuild)
   - barcode first: phones with BarcodeDetector read the ISBN live,
     Open Library turns it into a title, the shelf is matched;
   - cover text: tap the shutter (or hold steady) and Tesseract
     reads the title, three passes, matched against
     all 600 book titles (word scoring), never a random guess;
   - fingerprint chips load only when nothing matched;
   - not found: type it, or ask for it (Web3Forms request form).
   ============================================================ */
(function () {
  "use strict";
  var cam = document.getElementById("cam"), cap = document.getElementById("cap");
  var hintT = document.getElementById("scHintT"), torchBtn = document.getElementById("scTorch");
  var stream = null, raf = 0, busy = false, facing = "environment", frameN = 0, lastFrame = null, steady = 0, live = false, detector = null, torchOn = false;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function hint(t) { hintT.textContent = t; }
  function coverOf(id) { return "assets/covers/" + id + ".jpg"; }
  function titles() { return window.TSB_TITLES || []; }

  /* ---------- camera ---------- */
  function start() {
    stop();
    hint("Allow the camera");
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { noCamera("This browser cannot open the camera."); return; }
    var tries = [{ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } } }, { video: { facingMode: facing } }, { video: true }];
    (function go(i) {
      md.getUserMedia(tries[i]).then(function (s) {
        stream = s; cam.srcObject = s; cam.hidden = false; cap.hidden = true;
        var p = cam.play && cam.play(); if (p && p.catch) p.catch(function () {});
        setupTorch(); loop();
      }).catch(function () { if (i + 1 < tries.length) go(i + 1); else noCamera("The camera is blocked. Allow it in your browser settings, or type the title."); });
    })(0);
  }
  function stop() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    live = false; document.body.classList.remove("is-live");
    lastFrame = null; steady = 0;
  }
  function noCamera(msg) {
    stop(); hint("No camera");
    openNof(msg, "");
    $("nAgain").textContent = "Try the camera again";
  }
  function setupTorch() {
    torchBtn.hidden = true; torchOn = false; torchBtn.setAttribute("aria-pressed", "false");
    try {
      var tr = stream && stream.getVideoTracks()[0];
      var caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
      if (caps && caps.torch) torchBtn.hidden = false;
    } catch (e) {}
  }
  torchBtn.addEventListener("click", function () {
    try {
      var tr = stream && stream.getVideoTracks()[0]; if (!tr) return;
      torchOn = !torchOn;
      tr.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});

  });

  /* ---------- barcode (ISBN) ---------- */
  try {
    if ("BarcodeDetector" in window) {
      BarcodeDetector.getSupportedFormats().then(function (f) {
        var want = ["ean_13", "isbn_13", "upc_a", "ean_8"].filter(function (x) { return f.indexOf(x) >= 0; });
        if (want.length) detector = new BarcodeDetector({ formats: want });

    }
  } catch (e) {}
  var lastIsbn = "";
  function tryBarcode() {
    if (!detector || busy || !cam.videoWidth) return;
    detector.detect(cam).then(function (codes) {
      if (busy || !codes || !codes.length) return;

    }).catch(function () {});
  }
  function byIsbn(isbn) {
    busy = true; document.body.classList.add("is-busy"); hint("Barcode found, looking it up");
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    var done = false, t = setTimeout(function () { if (!done) { done = true; finishIsbn(null, isbn); } }, 7000);
    fetch("https://openlibrary.org/isbn/" + isbn + ".json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (done) return; done = true; clearTimeout(t); finishIsbn(j && j.title ? String(j.title) + (j.subtitle ? " " + j.subtitle : "") : null, isbn); })
      .catch(function () { if (!done) { done = true; clearTimeout(t); finishIsbn(null, isbn); } });
  }
  function finishIsbn(title, isbn) {
    busy = false; document.body.classList.remove("is-busy");
    if (!title) { openNof("We read the barcode (" + isbn + ") but could not find its title. Type it below.", ""); return; }
    var hit = matchTyped(title);
    if (hit) showFound(hit); else openNof("That is \u201c" + title + "\u201d. Ask us and we will add it.", title);
  }
  function norm(s) { return " " + String(s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9 ]/g, " ").replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim() + " "; }
  function matchTyped(title) {
    var n = norm(title), best = null;
    titles().forEach(function (b) {
      var bt = norm(b.t);
      if (!best && (n === bt || n.indexOf(bt) === 0 || bt.indexOf(n) === 0) && bt.trim().length > 3) best = b;
    });
    if (best) return best;
    try { return matchTitleByOcr({ big: title, med: "", full: title }); } catch (e) { return null; }
  }

  /* ---------- live loop: steady frame = auto capture ---------- */
  function downscale(v) { var c = document.createElement("canvas"); c.width = 60; c.height = 90; var x = c.getContext("2d"); x.drawImage(v, 0, 0, 60, 90); return x.getImageData(0, 0, 60, 90).data; }
  function sharpness(d) { var e = 0; for (var y = 0; y < 90; y++) for (var x = 1; x < 60; x++) { var i = (y * 60 + x) * 4; e += Math.abs(d[i] - d[i - 4]); } return e; }
  function diff(a, b) { var s = 0; for (var i = 0; i < a.length; i += 16) s += Math.abs(a[i] - b[i]); return s; }
  function loop() {
    raf = requestAnimationFrame(loop);
    if (!cam.videoWidth) return;
    if (!live) { live = true; document.body.classList.add("is-live"); hint(detector ? "Point at the cover or the barcode" : "Point at the cover"); }
    frameN++;
    if (frameN % 6 === 0) tryBarcode();
    if (busy || frameN % 4 !== 0) return;
    var d = downscale(cam), sharp = sharpness(d), stable = lastFrame ? diff(d, lastFrame) < 1400 : false;
    lastFrame = d;
    if (sharp > 15000 && stable) { if (++steady >= 6) { steady = 0; capture(); } } else steady = Math.max(0, steady - 1);
  }

  /* ---------- capture: read the cover text ---------- */
  function capture() {
    if (busy || !cam.videoWidth) { if (!cam.videoWidth) hint("The camera is still starting"); return; }
    busy = true; document.body.classList.add("is-busy");
    cap.width = cam.videoWidth; cap.height = cam.videoHeight;
    cap.getContext("2d").drawImage(cam, 0, 0);
    cam.hidden = true; cap.hidden = false;
    var pass = 0, accBig = "", accMed = "", accFull = "";
    (function read() {
      hint(pass === 0 ? "Reading the cover" : (pass === 1 ? "Reading it again" : "One last look"));
      ocrRead(function (text) {
        if (text) { accBig = (accBig + " " + (text.big || "")).trim(); accMed = (accMed + " " + (text.med || "")).trim(); accFull = (accFull + " " + (text.full || "")).trim(); }
        var guess = (accBig || accFull || "").trim().slice(0, 70);
        var hit = null; try { hit = matchTitleByOcr({ big: accBig, med: accMed, full: accFull }); } catch (e) {}
        if (hit) { finish(); showFound(hit); return; }
        if (pass < 2) { pass++; read(); return; }
        finish();
        openNof(guess.length >= 3 ? "We read \u201c" + guess + "\u201d. Is it one of these?" : "We could not read that cover. Try the barcode, or type the title.", guess.length >= 3 ? guess : "");
        chipsFromFingerprint();
      }, pass);
    })();
    function finish() { busy = false; document.body.classList.remove("is-busy"); }
  }

  /* ---------- sheets ---------- */
  var scrim = $("scScrim");
  function sheet(id) {
    ["scFound", "scNof"].forEach(function (s) { $(s).classList.toggle("on", s === id); });
    scrim.classList.toggle("on", !!id);
    if (id) stop();
  }
  function showFound(b) {
    $("fCover").src = coverOf(b.id); $("fT").textContent = b.t || b.title || ""; $("fA").textContent = b.a || "";
    $("fRead").href = "book.html?id=" + encodeURIComponent(b.id);
    $("fListen").href = "book.html?id=" + encodeURIComponent(b.id) + "&play=1";
    try { localStorage.setItem("tsb_flag_scanned", "1"); navigator.vibrate && navigator.vibrate([20, 40, 20]); } catch (e) {}
    sheet("scFound");
  }
  function openNof(msg, guess) {
    $("nT").textContent = guess ? "Not on the shelf yet" : "Find a book";
    $("nP").textContent = msg || "Type the title, or ask us to add it.";
    $("nIn").value = guess || ""; $("nChips").innerHTML = "";
    $("nAgain").textContent = "Scan again";
    suggest();
    sheet("scNof");
  }
  function suggest() {
    var q = norm($("nIn").value).trim(), list = $("nList");
    if (q.length < 2) { list.innerHTML = ""; return; }
    var words = q.split(" ");
    var hits = titles().filter(function (b) { var s = norm(b.t + " " + b.a); return words.every(function (w) { return s.indexOf(w) >= 0; }); }).slice(0, 5);
    list.innerHTML = hits.map(function (b) { return '<li><button type="button" data-id="' + esc(b.id) + '"><img src="' + esc(coverOf(b.id)) + '" alt="" loading="lazy"><span><b>' + esc(b.t) + "</b><small>" + esc(b.a) + "</small></span></button></li>"; }).join("");
  }
  /* closest-looking covers, loaded only now (1 MB, never on open) */
  function chipsFromFingerprint() {
    function paint() { var c = []; try { c = fingerprintCandidates() || []; } catch (e) {} if (c.length) $("nChips").innerHTML = c.map(function (x) { return '<button type="button" data-id="' + esc(x.id) + '">' + esc(x.t) + "</button>"; }).join(""); }
    if (window.TSB_SCAN) { paint(); return; }
    var s = document.createElement("script"); s.src = "js/scanner-data.js?v=345"; s.onload = paint; document.body.appendChild(s);
  }
  function byId(id) { return titles().filter(function (b) { return b.id === id; })[0]; }
  document.addEventListener("click", function (e) {
    var p = e.target.closest("[data-id]"); if (p) { var b = byId(p.getAttribute("data-id")); if (b) showFound(b); return; }

  });

  scrim.addEventListener("click", again);
  $("nIn").addEventListener("input", suggest);
  $("nIn").addEventListener("keydown", function (e) { if (e.key === "Enter") { var h = matchTyped($("nIn").value); if (h) showFound(h); } });
  $("nReq").addEventListener("click", function () {
    var t = $("nIn").value.trim();
    if (window.TSB_REQUEST && TSB_REQUEST.open) TSB_REQUEST.open(t);
    else location.href = "index.html#request";
  });
  $("scShut").addEventListener("click", capture);
  $("scType").addEventListener("click", function () { openNof("", ""); setTimeout(function () { $("nIn").focus(); }, 380); });
  $("scFlip").addEventListener("click", function () { facing = facing === "environment" ? "user" : "environment"; start(); });
  $("scBack").addEventListener("click", function () { stop(); if (history.length > 1) history.back(); else location.href = "index.html#library"; });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (!$("scFound").classList.contains("on") && !$("scNof").classList.contains("on")) start(); });

  /* ---------- engine (kept from v317: OCR + strict matching) ---------- */
  var tesseractPromise = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tesseractPromise) return tesseractPromise;
    tesseractPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      s.onload = function () { resolve(window.Tesseract); };
      s.onerror = function () { reject(new Error("cdn")); };
      document.head.appendChild(s);
    });

  }
  /* preprocess: grayscale + contrast stretch (+ optional sharpen on retry).

  function preprocessForOcr(src, sharpen) {
    var targetW = 900;
    var scale = Math.max(1, Math.min(2, targetW / src.width));
    var w = Math.max(1, Math.round(src.width * scale));
    var h = Math.max(1, Math.round(src.height * scale));
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var cx = c.getContext("2d");
    cx.imageSmoothingEnabled = true;
    if (cx.imageSmoothingQuality) cx.imageSmoothingQuality = "high";
    cx.drawImage(src, 0, 0, w, h);
    var img = cx.getImageData(0, 0, w, h);
    var d = img.data;
    // grayscale
    for (var i = 0; i < d.length; i += 4) {
      var g = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    if (sharpen) {

      var lum2 = new Float32Array(w * h);
      for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) lum2[yy * w + xx] = d[(yy * w + xx) * 4];
      for (var y2 = 1; y2 < h - 1; y2++) for (var x2 = 1; x2 < w - 1; x2++) {
        var idx = (y2 * w + x2) * 4;
        var center = lum2[y2 * w + x2];
        var edges = (lum2[(y2-1)*w+x2] + lum2[(y2+1)*w+x2] + lum2[y2*w+x2-1] + lum2[y2*w+x2+1]) / 4;
        var sharp = center + (center - edges) * 0.6;
        d[idx] = d[idx+1] = d[idx+2] = Math.max(0, Math.min(255, sharp));
      }
    }
    // contrast stretch
    var mn = 255, mx = 0;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j] < mn) mn = d[j];
      if (d[j] > mx) mx = d[j];
    }
    var range = mx - mn;
    if (range > 10) {
      for (var k = 0; k < d.length; k += 4) {
        var v = (d[k] - mn) / range * 255;
        d[k] = d[k + 1] = d[k + 2] = v;
      }

    return c;
  }
  function ocrRead(cb, pass) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; cb(""); } }, 12000);

      if (done) return;
      var prep = cap;
    if (pass === 2) {
      /* tight crop on the upper half where cover titles live, bigger scale */
      var cw2 = cap.width, ch2 = cap.height;
      var bandC = document.createElement("canvas");
      bandC.width = Math.round(cw2 * 0.86); bandC.height = Math.round(ch2 * 0.52);
      bandC.getContext("2d").drawImage(cap, cw2 * 0.07, ch2 * 0.08, cw2 * 0.86, ch2 * 0.52, 0, 0, bandC.width, bandC.height);
      prep = bandC;
    }
    prep = preprocessForOcr(prep, pass >= 1);
      return T.recognize(prep, "eng", { logger: function () {} });
    }).then(function (res) {
      if (done) return;
      done = true; clearTimeout(timer);
      if (!res || !res.data) { cb(""); return; }

         (subtitles, which often carry the tail of a two-line title), and
         the full text. The bands feed the matcher with different weights,
         so a stylised title can still win through its subtitle or author. */
      var words = (res.data.words || []).filter(function (w) { return w && w.text; });
      var fullText = (res.data.text || "").trim();
      var bigText = "", medText = "";
      if (words.length) {
        var maxH = 0;
        for (var i = 0; i < words.length; i++) {
          var h = (words[i].bbox && (words[i].bbox.y1 - words[i].bbox.y0)) || 0;
          if (h > maxH) maxH = h;
        }
        if (maxH > 0) {
          var byBand = function (lo, hi) {
            var keep = words.filter(function (w) {
              var h2 = (w.bbox && (w.bbox.y1 - w.bbox.y0)) || 0;
              return h2 >= maxH * lo && h2 < maxH * hi;
            });
            keep.sort(function (a, b) {
              var ay = (a.bbox && a.bbox.y0) || 0, by = (b.bbox && b.bbox.y0) || 0;

              return (ay - by) || (ax - bx);
            });

          medText = byBand(0.28, 0.5);
        }

    }).catch(function () {
      if (!done) { done = true; clearTimeout(timer); cb(""); }
    });
  }

  /* ---------------- OCR title matching ---------------- */
  function normTxt(s) {
    return String(s).toUpperCase().replace(/[^A-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  }
  var OCR_STOP = {"THE":1,"AND":1,"FOR":1,"WITH":1,"YOUR":1,"YOU":1,"ARE":1,"NOT":1,"THAT":1,"THIS":1,"HOW":1,"WHY":1,"WHAT":1,"WHO":1,"WHEN":1,"FROM":1,"INTO":1,"THAN":1,"THEN":1,"SELF":1,"OF":1,"IN":1,"ON":1,"TO":1,"A":1,"AN":1,"IS":1,"IT":1,"BE":1,"BY":1,"AS":1,"AT":1,"BUT":1,"OR":1};
  function ocrSigWords(title) {
    var ws = String(title).toUpperCase().replace(/[^A-Z0-9 ]/g, " ").split(/\s+/);
    var out = [];
    for (var i = 0; i < ws.length; i++) {
      var w = ws[i];
      if (!w) continue;
      if (w.length >= 4 || (w.length >= 3 && !OCR_STOP[w]) || /^[0-9]+$/.test(w)) out.push(w);
    }
    return out;
  }
  /* levenshtein distance, handles OCR noise (POWER→POWEF, HABITS→HAB1TS) */
  function levDist(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      cur[0] = i;
      for (var k = 1; k <= n; k++) {
        var cost = a[i - 1] === b[k - 1] ? 0 : 1;
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + cost);
      }
      var tmp = prev; prev = cur; cur = tmp;
    }
    return prev[n];
  }
  function ocrScoreBook(sig, ocrText) {
    var ocrNorm = String(ocrText || "").toUpperCase().replace(/[^A-Z0-9' ]/g, " ");
    var ocrList = [];
    ocrNorm.split(/\s+/).forEach(function (w) {
      w = w.replace(/'/g, "");
      if (w.length >= 3) ocrList.push(w);
    });
    var exact = 0, fuzzy = 0;
    for (var i = 0; i < sig.length; i++) {
      var wc = sig[i].replace(/'/g, "");
      var found = false;
      for (var j = 0; j < ocrList.length; j++) {
        var ow = ocrList[j];
        if (ow === wc) { exact++; found = true; break; }
      }
      if (found) continue;
      /* fuzzy: allow 1 edit per ~5 chars on words >= 5 chars */
      if (wc.length >= 5) {
        var maxEdits = Math.max(1, Math.floor(Math.min(wc.length, 8) / 5));
        for (var k = 0; k < ocrList.length; k++) {
          var o2 = ocrList[k];
          if (o2.length >= 5 && Math.abs(o2.length - wc.length) <= maxEdits &&
              levDist(o2, wc) <= maxEdits) { fuzzy++; break; }
        }
      }
    }
    return (exact + 0.6 * fuzzy) / sig.length;
  }
  function matchTitleByOcr(ocrText) {
    var lib = window.TSB_SCAN || [];
    var books = window.TSB_TITLES || [];
    var t = books.length ? books : lib.map(function (e) { return { id: e.id, title: e.t, author: "" }; });
    var big = ((ocrText && ocrText.big) || "") + " " + ((ocrText && ocrText.med) || "");
    var full = (ocrText && ocrText.full) || "";
    var bigOnly = (ocrText && ocrText.big) || "";
    var bigNorm = " " + String(big).toUpperCase().replace(/[^A-Z0-9' ]/g, " ").replace(/\s+/g, " ") + " ";
    var fullNorm = " " + String(full).toUpperCase().replace(/[^A-Z0-9' ]/g, " ").replace(/\s+/g, " ") + " ";
    var best = null, bestScore = 0, bestExact = 0, bestPhrase = false, bestN = 0, secondScore = 0, bestAExact = 0;
    for (var i = 0; i < t.length; i++) {
      var b = t[i];
      var bTitle = b.title || b.t || "";
      var sig = ocrSigWords(bTitle);
      if (!sig.length) continue;
      var sBig = ocrScoreBook(sig, big);
      var titleNorm = " " + bTitle.toUpperCase().replace(/[^A-Z0-9' ]/g, " ").replace(/\s+/g, " ").trim() + " ";
      /* auto-open phrase must come from the BIG (title) text, full-text
         phrases are subtitles/blurbs and caused false opens (e.g. "The Dip"
         appearing in praise text on another cover) */
      var phrase = bigNorm.indexOf(titleNorm) !== -1;
      /* exact-word count from the biggest text */
      var exactBig = 0;
      big.split(/\s+/).forEach(function (w) {
        w = w.toUpperCase().replace(/'/g, "");
        for (var k = 0; k < sig.length; k++) if (sig[k] === w) { exactBig++; break; }
      });
      /* v317: the author is on every cover and is rarely stylised - read
         author names are strong evidence when a title is drawn in art type */
      var aSig = ocrSigWords(String(b.author || b.a || ""));
      var aExact = 0;
      if (aSig.length) {
        var bigUp = " " + bigOnly.toUpperCase().replace(/[^A-Z0-9' ]/g, " ").replace(/\s+/g, " ") + " ";
        aSig.forEach(function (a2) { if (bigUp.indexOf(" " + a2 + " ") !== -1) aExact++; });
      }
      var score = sBig + aExact * 0.18;
      if (score > bestScore) {
        secondScore = bestScore;
        bestScore = score; best = b; bestExact = exactBig; bestPhrase = phrase; bestN = sig.length; bestAExact = aExact;
      } else if (score > secondScore) {
        secondScore = score;
      }
    }
    if (!best) return null;
    var margin = bestScore - secondScore;
    var ok = false;
    if (bestN >= 2) {
      /* strong evidence from the biggest text on the cover, never stray words */
      ok = (bestScore >= 0.6 && bestExact >= 2 && margin >= 0.04) || (bestPhrase && bestExact >= 2) ||
           /* v317: one exact title word + the author clearly read = confident
              (art-type titles drawn by hand on the cover) */
           (bestExact >= 1 && bestAExact >= 2 && margin >= 0.1);
    } else {
      /* single-word titles (Sapiens, Grit…) need an exact big-text phrase
         AND a clear margin, a lone word can appear in any subtitle */
      ok = bestPhrase && margin >= 0.3;
    }
    if (!ok) return null;
    return { id: best.id, t: best.title || best.t, a: best.author || best.a || "" };
  }

  /* ---------------- fingerprint fallback (STRICT) ---------------- */
  function buildProfile(sctx) {
    var w = 120, h = 180;
    var data = sctx.getImageData(0, 0, w, h).data;
    var grid = [];
    for (var gy = 0; gy < 3; gy++) for (var gx = 0; gx < 3; gx++) {
      var r = 0, g = 0, b = 0, n = 0;
      for (var y = Math.floor(gy * h / 3); y < Math.floor((gy + 1) * h / 3); y++)
        for (var x = Math.floor(gx * w / 3); x < Math.floor((gx + 1) * w / 3); x++) {
          var i = (y * w + x) * 4; r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
        }
      grid.push([Math.round(r / n), Math.round(g / n), Math.round(b / n)]);
    }
    var mr = 0, mg = 0, mb = 0;
    for (var gi = 0; gi < 9; gi++) { mr += grid[gi][0]; mg += grid[gi][1]; mb += grid[gi][2]; }
    mr /= 9; mg /= 9; mb /= 9;
    var varScore = 0;
    for (var gi2 = 0; gi2 < 9; gi2++)
      varScore += Math.abs(grid[gi2][0] - mr) + Math.abs(grid[gi2][1] - mg) + Math.abs(grid[gi2][2] - mb);
    varScore /= 9;
    var gx0 = sctx.createImageData(w, h);
    var gd = gx0.data;
    for (var i2 = 0; i2 < data.length; i2++) gd[i2] = data[i2];
    sctx.putImageData(gx0, 0, 0);
    var gray = sctx.getImageData(0, 0, w, h).data;
    var lum = new Float32Array(w * h);
    for (var y2 = 0; y2 < h; y2++) for (var x2 = 0; x2 < w; x2++) {
      var idx = (y2 * w + x2) * 4;
      lum[y2 * w + x2] = 0.299 * gray[idx] + 0.587 * gray[idx + 1] + 0.114 * gray[idx + 2];
    }
    var EW = 16, EH = 24, ew = Math.floor(w / EW), eh = Math.floor(h / EH), bits = [], edgeCount = 0;
    for (var ey = 0; ey < EH; ey++) for (var ex = 0; ex < EW; ex++) {
      var s = 0, cnt = 0;
      for (var yy = ey * eh; yy < (ey + 1) * eh; yy++) for (var xx = ex * ew; xx < (ex + 1) * ew; xx++) {
        var i3 = yy * w + xx;
        var gxval = xx + 1 < w ? Math.abs(lum[i3] - lum[yy * w + xx + 1]) : 0;
        var gyval = yy + 1 < h ? Math.abs(lum[i3] - lum[(yy + 1) * w + xx]) : 0;
        s += gxval + gyval; cnt++;
      }
      var bit = s / cnt > 22 ? 1 : 0;
      bits.push(bit); edgeCount += bit;
    }
    var bytes = [];
    for (var k = 0; k < bits.length; k += 8) {
      var byte = 0;
      for (var j = 0; j < 8; j++) if (k + j < bits.length && bits[k + j]) byte |= 1 << (7 - j);
      bytes.push(byte);
    }
    var bin = "";
    for (var b2 = 0; b2 < bytes.length; b2++) bin += String.fromCharCode(bytes[b2]);
    return { g: grid, e: btoa(bin), v: varScore, eb: edgeCount };
  }
  function profileFromCanvas() {
    var small = document.createElement("canvas"); small.width = 120; small.height = 180;
    var sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    if (sctx.imageSmoothingQuality) sctx.imageSmoothingQuality = "high";
    sctx.drawImage(cap, 0, 0, 120, 180);
    return buildProfile(sctx);
  }
  function profileFromCrop(frac) {
    var cw = cap.width, ch = cap.height;
    var cw2 = Math.round(cw * frac), ch2 = Math.round(ch * frac);
    var x0 = Math.round((cw - cw2) / 2), y0 = Math.round((ch - ch2) / 2);
    var small = document.createElement("canvas"); small.width = 120; small.height = 180;
    var sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    if (sctx.imageSmoothingQuality) sctx.imageSmoothingQuality = "high";
    sctx.drawImage(cap, x0, y0, cw2, ch2, 0, 0, 120, 180);
    return buildProfile(sctx);
  }
  function colorDist(c1, c2) {
    return Math.sqrt(Math.pow(c1[0] - c2[0], 2) + Math.pow(c1[1] - c2[1], 2) + Math.pow(c1[2] - c2[2], 2));
  }
  function edgeDist(e1, e2) {
    var a1, a2;
    try { a1 = atob(e1); a2 = atob(e2); } catch (e) { return 1; }
    var diff = 0;
    for (var i = 0; i < a1.length; i++) {
      var x = a1.charCodeAt(i) ^ a2.charCodeAt(i);
      while (x) { diff += x & 1; x >>= 1; }
    }
    return diff / 384;
  }
  function fingerprintCandidates() {
    var lib = window.TSB_SCAN || [];
    if (!lib.length) return [];
    var profs = [profileFromCanvas(), profileFromCrop(0.9)];
    var full = profs[0];
    if (full.v < 4 || full.eb < 10) return [];
    var bookBest = {};
    for (var i = 0; i < lib.length; i++) {
      var id = lib[i].id;
      if (!bookBest[id]) bookBest[id] = 1e9;
    }
    for (var e = 0; e < lib.length; e++) {
      var entry = lib[e], sc = 1e9;
      for (var p = 0; p < profs.length; p++) {
        var cScore = 0;
        for (var k = 0; k < 9; k++) cScore += colorDist(profs[p].g[k], entry.g[k]);
        cScore /= 9;
        var eScore = edgeDist(profs[p].e, entry.e) * 100;
        var s2 = cScore * 0.55 + eScore * 0.45;
        if (s2 < sc) sc = s2;
      }
      if (sc < bookBest[entry.id]) bookBest[entry.id] = sc;
    }
    var ranked = Object.keys(bookBest).map(function (id) { return { id: id, sc: bookBest[id] }; })
      .sort(function (a, b) { return a.sc - b.sc; });
    var titles = window.TSB_TITLES || [];
    return ranked.slice(0, 3).filter(function (r) { return r.sc < 60; }).map(function (r) {
      var bk = titles.find(function (b) { return b.id === r.id; });
      return { id: r.id, t: bk ? bk.t : r.id };
    });
  }

  start();
  setTimeout(function () { try { loadTesseract().catch(function () {}); } catch (e) {} }, 1200);
})();
