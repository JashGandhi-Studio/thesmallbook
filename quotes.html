  <style>
    body.qw-body { padding-bottom: 0; }
    .qw-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; background: var(--bg); border-bottom: var(--bw) solid var(--edge); }
    .qw-head .qw-back { min-width: 38px; width: 38px; height: 38px; padding: 0; border: var(--bw) solid var(--edge); border-radius: 17px; background: var(--paper); font-size: 16px; cursor: pointer; box-shadow: var(--sh-2); }
    .qw-head > div { flex: 1; min-width: 0; }
    .qw-head h1 { font: 400 16px "Archivo Black", "Arial Black", sans-serif; color: var(--ink); margin: 0; letter-spacing: .3px; white-space: nowrap; }
    .qw-head p { margin: 2px 0 0; font: 600 10px "Space Grotesk", sans-serif; color: var(--ink); opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qw-count { margin-left: auto; flex: 0 0 auto; font: 800 8.5px "Archivo Black", sans-serif; letter-spacing: .5px; color: #14110c; background: var(--yellow); border: var(--bw) solid var(--edge); border-radius: 999px; padding: 5px 8px; white-space: nowrap; }
    .qw-vp { position: relative; height: calc(100dvh - 96px); overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
      background: url("assets/cork.jpg") 0 0 / 480px auto, #c9a271;
      box-shadow: inset 0 6px 22px rgba(60,30,0,.45), inset 0 -6px 18px rgba(60,30,0,.3);
      border-top: 12px solid #8a5a2b; border-bottom: 12px solid #8a5a2b;
      perspective: 1400px; }
    .qw-vp::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: linear-gradient(180deg, rgba(255,235,200,.10), rgba(0,0,0,0) 30%, rgba(0,0,0,.06) 75%, rgba(50,25,0,.18)); }
    .qw-vp:active { cursor: grabbing; }
    .qw-board { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; transform-style: preserve-3d; }
    .qw-note, .qw-photo { position: absolute; width: 188px; padding: 18px 13px 12px; box-shadow: 3px 5px 10px rgba(40,20,0,.28); cursor: default;
      transform-style: preserve-3d; will-change: transform, box-shadow; }
    .qw-note--wide { width: 240px; min-height: 124px; }
    .qw-note--tall { width: 160px; min-height: 230px; }
    .qw-note--square { width: 190px; min-height: 170px; }
    .qw-note { min-height: 96px; border-radius: 2px;
      background-image: linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,0) 34%, rgba(0,0,0,.045) 78%, rgba(0,0,0,.09));
      box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 4px 7px 12px rgba(40,18,0,.34), 1px 2px 3px rgba(40,18,0,.22);
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s cubic-bezier(.2,.9,.3,1); }
    .qw-note:hover, .qw-photo:hover { transform: rotate(0deg) scale(1.05) translateZ(24px) !important; box-shadow: 0 20px 36px rgba(40,18,0,.45) !important; z-index: 30 !important; }
    .qw-note::after { content: ""; position: absolute; right: 0; bottom: 0; border-style: solid; border-width: 0 0 18px 18px; border-color: transparent transparent rgba(0,0,0,.10) transparent; }
    @keyframes qwSpringIn {
      0% { opacity: 0; transform: scale(0.2) translateY(-36px) translateZ(-60px); }
      60% { opacity: 1; transform: scale(1.08) translateY(6px) translateZ(30px); }
      80% { transform: scale(0.96) translateY(-2px) translateZ(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0) translateZ(0); }
    }
    .qw-note--spring, .qw-photo--spring {
      animation: qwSpringIn 0.45s cubic-bezier(.16, 1, .3, 1) both !important;
      z-index: 40 !important;
      box-shadow: 0 22px 42px rgba(40,18,0,.48) !important;
    }
    .qw-ratios, .qw-angles { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .qw-ctl-lbl { font: 800 10px "Space Grotesk", sans-serif; color: var(--ink); opacity: .7; margin-right: 2px; letter-spacing: .4px; }
    .qw-r-btn, .qw-a-btn { border: var(--bw) solid var(--edge); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 5px 9px; font: 800 10px "Space Grotesk", sans-serif; cursor: pointer; transition: all .12s; }
    .qw-r-btn.on, .qw-a-btn.on { background: var(--yellow); box-shadow: var(--sh-1); }
    html.dark .qw-r-btn, html.dark .qw-a-btn { background: #241f17; color: #f2ead8; border-color: #3e3425; }
    html.dark .qw-r-btn.on, html.dark .qw-a-btn.on { background: var(--yellow); color: #14110c !important; border-color: #000; }
    .qw-sources { display: flex; gap: 6px; margin-bottom: 8px; }
    .qw-src { flex: 1; border: var(--bw) solid var(--edge); background: var(--paper); border-radius: 12px; padding: 7px 4px; font: 800 10.5px "Space Grotesk", sans-serif; cursor: pointer; color: var(--ink); text-align: center; }
    .qw-src.on { background: var(--yellow); box-shadow: var(--sh-1); }
    html.dark .qw-src { background: #241f17; color: #f2ead8; border-color: #3e3425; }
    html.dark .qw-src.on { background: var(--yellow); color: #14110c !important; border-color: #000; }
    .qw-pin, .qw-pin--red { position: absolute; top: 8px; left: 50%; margin-left: -7px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9d9d, #d21f1f 70%); border: 2px solid #7d0f0f; box-shadow: 1px 2px 3px rgba(0,0,0,.35); z-index: 2; }
    .qw-photo .qw-pin--red { top: 6px; }
    .qw-pin:not(.qw-pin--red) { background: radial-gradient(circle at 35% 30%, #ffd86e, #e0a90f 70%); border-color: #8a6604; }
    .qw-txt { margin: 2px 0 10px; font: 700 16.5px/1.3 "Caveat", "Comic Sans MS", cursive; color: #333; overflow-wrap: anywhere; }
    .qw-by { display: block; font: 700 11px "Caveat", cursive; color: #6b5a3a; }

    .qw-photo::before { content: ""; position: absolute; top: -10px; left: 50%; margin-left: -44px; width: 88px; height: 22px; z-index: 3;

    .qw-cap { display: block; font: 700 15px/1.25 "Caveat", cursive; color: #333; padding: 7px 2px 2px; overflow-wrap: anywhere; }
    .qw-photo .qw-by { display: block; padding-top: 5px; }
    .qw-del { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; border: var(--bw) solid var(--edge); background: var(--paper); font: 800 10px "Space Grotesk", sans-serif; cursor: pointer; z-index: 3; }
    .qw-corner { position: absolute; left: 26px; top: 6px; font: 700 13px "Caveat", cursive; color: #4a3413; opacity: .75; max-width: 210px; }
    .qw-zoom { position: absolute; left: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }

    .qw-add { position: fixed; right: 16px; bottom: 92px; z-index: 110; width: 58px; height: 58px; border-radius: 50%; border: var(--bw) solid var(--edge); background: var(--yellow); box-shadow: var(--sh-2); font-size: 24px; cursor: pointer; }

    #qwSearch { width: 100%; box-sizing: border-box; border: var(--bw) solid var(--edge); border-radius: 14px; padding: 9px 11px; font: 600 13px "Space Grotesk", sans-serif; background: #fff; }

    .qw-tp { border: var(--bw) solid var(--edge); background: #fff; border-radius: 999px; padding: 5px 10px; font: 800 9.5px "Space Grotesk", sans-serif; color: var(--ink); cursor: pointer; }
    .qw-tp.on { background: var(--yellow); box-shadow: var(--sh-1); }
    .qw-qlist { max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .qw-qi { text-align: left; border: var(--bw) solid var(--edge); background: #fff; border-radius: 17px; padding: 8px 10px; cursor: pointer; }
    .qw-qi span { display: block; font: 700 13px/1.35 "Caveat", cursive; color: #333; }
    .qw-qi i { display: block; font: 600 10px "Space Grotesk", sans-serif; font-style: normal; color: #6b5a3a; margin-top: 3px; }
    .qw-qmore { font: 600 10.5px "Space Grotesk", sans-serif; color: #6b5a3a; text-align: center; margin: 6px 0 0; }
    .qw-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .qw-tab { flex: 1; border: var(--bw) solid var(--edge); background: var(--paper); border-radius: 999px; padding: 9px 0; font: 800 11px "Space Grotesk", sans-serif; color: var(--ink); cursor: pointer; }
    .qw-tab.on { background: var(--yellow); box-shadow: var(--sh-1); }
    #qwText, #qwCap { width: 100%; border: var(--bw) solid var(--edge); border-radius: 20px; background: #fffdf2; padding: 12px; font: 600 15px "Caveat", cursive; color: #333; min-height: 92px; resize: vertical; box-sizing: border-box; }
    #qwCap { min-height: 44px; margin-top: 10px; }
    .qw-colors { display: flex; gap: 10px; margin: 12px 0; }
    .qw-c { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); cursor: pointer; }
    .qw-c.on { border: var(--bw) solid var(--edge); box-shadow: var(--sh-1); }
    .qw-c--custom { position: relative; overflow: hidden; display: inline-block; }

    .qw-c--share { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; background: var(--paper); }
    .qw-c--share.on { border: var(--bw) solid var(--edge); box-shadow: var(--sh-1); background: var(--yellow); }
    .qw-go { width: 100%; border: var(--bw) solid var(--edge); background: var(--green); border-radius: 20px; box-shadow: var(--sh-2); padding: 13px; font: 400 13px "Archivo Black", "Arial Black", sans-serif; color: var(--ink); cursor: pointer; }
    .qw-go:disabled { opacity: .6; }
    .qw-pick { width: 100%; border: 2.5px dashed var(--ink); border-radius: 20px; background: #fffdf2; padding: 22px 0; font: 800 12px "Space Grotesk", sans-serif; color: var(--ink); cursor: pointer; }
    #qwPrev { display: block; width: 100%; max-height: 180px; object-fit: cover; border: var(--bw) solid var(--edge); border-radius: 17px; margin-top: 10px; }
    .qw-fine { font: 600 10.5px/1.5 "Space Grotesk", sans-serif; color: var(--ink); opacity: .55; margin: 12px 0 0; }
    .qw-anonrow { display: flex; align-items: center; gap: 9px; margin: 2px 0 4px; }

    .qw-anon { border: var(--bw) solid var(--edge); background: var(--paper); border-radius: 999px; padding: 7px 12px; font: 800 10px "Archivo Black", sans-serif; letter-spacing: .4px; color: var(--ink); cursor: pointer; }
    .qw-anon.on { background: var(--ink); color: var(--paper); box-shadow: var(--sh-1); }

    /* Focused Pin Inspection Card */
    .qw-inspect-modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .qw-inspect-backdrop { position: absolute; inset: 0; background: rgba(14, 11, 7, 0.72); backdrop-filter: blur(4px); }
    .qw-inspect-card { position: relative; z-index: 2; width: 100%; max-width: 440px; background: var(--paper); border: var(--bw) solid var(--edge); border-radius: 18px; box-shadow: var(--sh-3); padding: 26px 22px 20px; animation: qwPop .18s cubic-bezier(.2,.9,.3,1); }

    .qw-inspect-btn:hover { background: var(--surface-2); transform: translate(-1px, -1px); box-shadow: var(--sh-2); }
    .qw-inspect-btn:active { transform: translate(1px, 1px); box-shadow: var(--sh-1); }
    .qw-inspect-btn--share { background: var(--yellow); color: #14110c; }
    .qw-inspect-btn--book { background: var(--green); color: #14110c; }
