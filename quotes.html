      <div class="qw-inspect-meta" id="qwInspectMeta"></div>
      <div class="qw-inspect-acts">

        <button type="button" class="qw-inspect-btn qw-inspect-btn--share" id="qwInspectShare">📤 Share</button>
        <a class="qw-inspect-btn qw-inspect-btn--book" id="qwInspectBook" href="#" hidden>📖 Read Book</a>
        <button type="button" class="qw-inspect-btn qw-inspect-btn--del" id="qwInspectDel" hidden>🗑 Remove Pin</button>
      </div>
    </div>
