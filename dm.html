<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Messages — TheSmallBook</title>
  <meta name="description" content="Talk to readers in TheSmallBook community.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=204">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="cmpage dmpage">
  <header class="cm-top">
    <a class="cm-top__back" id="dmBack" href="stories.html?tab=people" aria-label="Back">←</a>
    <h1 class="cm-top__t" id="dmTitle">💬 Messages</h1>
    <button class="cm-top__act" id="dmMenuBtn" hidden title="Chat options">⋯</button>
  </header>

  <!-- chat options popout (anchored under the ⋯ dot) -->
  <div class="dm-pop" id="dmPop" hidden>
    <button id="popProfile">👤 View profile</button>
    <button id="popClear">🧹 Clear chat <small>(for me)</small></button>
  </div>

  <!-- message action popout (anchored where you tapped) -->
  <div class="dm-pop" id="ctxPop" hidden>
    <button id="actEdit">✏️ Edit</button>
    <button id="actDelAll">🗑 Delete for everyone</button>
    <button id="actDelMe">🙈 Delete for me</button>
  </div>

  <main class="cm-wrap" id="dmMain">
    <div id="dmList" class="dm-list"></div>
    <div id="dmThread" class="dm-thread" hidden>
      <div class="dm-msgs" id="dmMsgs"></div>
      <form class="dm-send" id="dmSend">
        <button class="dm-plus" id="dmPlus" type="button" title="Recommend a book">＋</button>
        <input id="dmBody" class="dm-input" maxlength="1000" placeholder="Say something kind…" autocomplete="off">
        <button class="cm-write" type="submit">Send</button>
      </form>
    </div>
  </main>

  <!-- book picker -->
  <div class="dm-picker" id="dmPicker" hidden>
    <div class="dm-picker__card">
      <div class="dm-picker__head">
        <b>📕 Recommend a book</b>
        <button id="pkX" aria-label="Close">✕</button>
      </div>
      <div class="pk-search"><span>🔍</span><input id="pkSearch" placeholder="Search books…" autocomplete="off"></div>
      <div class="dm-picker__list" id="pkList"></div>
    </div>
  </div>

  <script src="js/prefs.js?v=204"></script>
  <script src="js/lang.js?v=204"></script>
  <script src="js/config.js?v=204"></script>
  <script src="js/data.js?v=204"></script>
  <script src="js/auth.js?v=204"></script>
  <script src="js/community.js?v=204"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var BOOKS = window.BOOKS || [];
    var uid = (location.search.match(/[?&]u=([a-f0-9-]{36})/) || [])[1] || "";
    var list = document.getElementById("dmList"), thread = document.getElementById("dmThread");
    var msgs = document.getElementById("dmMsgs"), back = document.getElementById("dmBack");
    var meId = "";
    var selectedMsg = null;

    /* ---------- anchored popouts ---------- */
    function openPop(pop, x, y) {
      pop.hidden = false;
      var w = 210, h = pop.offsetHeight || 130;
      var left = Math.min(Math.max(10, x - w + 20), window.innerWidth - w - 10);
      var top = Math.min(Math.max(10, y), window.innerHeight - h - 10);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
      requestAnimationFrame(function () { pop.classList.add("on"); });
    }
    function closePop(pop) { pop.classList.remove("on"); setTimeout(function () { pop.hidden = true; }, 180); }
    document.addEventListener("click", function (e) {
      ["dmPop", "ctxPop"].forEach(function (id) {
        var pop = document.getElementById(id);
        if (!pop.hidden && !pop.contains(e.target) && e.target.id !== "dmMenuBtn" && !e.target.closest(".dm-bub")) closePop(pop);
      });
    });

    C.whenReady(function () {
    if (!C.signedIn()) {
      list.innerHTML = '<div class="cm-empty">Sign in to message readers.<br><a class="cm-write" href="login.html">Sign in — it’s free →</a></div>';
      return;
    }
    meId = (C.me() || {}).id || "";

    function ava(prof, id) {
      if (!prof) return '<div class="cm-ava cm-ava--lg"><span>R</span></div>';
      var u = C.avaUrl(prof.name, prof.avatar_url, id || prof.id);
      return '<div class="cm-ava cm-ava--lg">' + (u ? '<img src="' + C.esc(u) + '" alt="">' : "<span>" + C.esc((prof.name || "R").charAt(0).toUpperCase()) + "</span>") + "</div>";
    }

    async function loadList() {
      list.innerHTML = '<div class="cm-empty cm-empty--sm">Loading messages…</div>';
      var rows = [];
      try { rows = await C.myMessages(200); } catch (e) {}
      rows = rows.filter(function (m) { return !(m.hidden_for || []).some(function (h) { return h === meId; }); });
      var convs = C.conversations(rows, meId);
      if (!convs.length) {
        list.innerHTML = '<div class="cm-empty">No messages yet.<br>Find readers in <a href="stories.html?tab=people">👥 People</a> and hit 💬.</div>';
        return;
      }
      list.innerHTML = "";
      for (var i = 0; i < convs.length; i++) {
        var cv = convs[i];
        var prof = null;
        try { prof = await C.getProfile(cv.user_id); } catch (e) {}
        var a = document.createElement("div");
        a.className = "dm-row";
        var lastTxt = cv.last.book_id ? "📕 recommended a book" : C.esc(cv.last.body).slice(0, 60);
        a.innerHTML = '<a class="dm-row__ava" href="profile.html?id=' + cv.user_id + '">' + ava(prof, cv.user_id) + "</a>" +
          '<a class="dm-row__meta" href="dm.html?u=' + cv.user_id + '"><b>' + C.esc(prof ? prof.name : "Reader") + (C.isOfficial(cv.user_id) ? '<span class="cm-vtick">✔</span>' : "") + "</b>" +
          "<span>" + lastTxt + "</span></a>" +
          '<a class="dm-row__side" href="dm.html?u=' + cv.user_id + '"><span class="cm-time">' + C.ago(cv.last.created_at) + "</span>💬</a>";
        list.appendChild(a);
      }
    }

    function bookCard(bookId) {
      var b = BOOKS.filter(function (x) { return x.id === bookId; })[0];
      if (!b) return "";
      return '<a class="dm-book" href="book.html?id=' + b.id + '">' +
        '<img src="' + C.esc(b.cover || "") + '" alt="" onerror="this.style.display=\'none\'">' +
        "<div><b>" + C.esc(b.title) + "</b><span>" + C.esc(b.author) + "</span><em>Open in library →</em></div></a>";
    }

    async function loadThread(silent) {
      var rows = [];
      try { rows = await C.threadWith(uid); } catch (e) {}
      var prof = null;
      try { prof = await C.getProfile(uid); } catch (e) {}
      document.getElementById("dmTitle").textContent = "💬 " + (prof ? prof.name : "Reader");
      back.href = "dm.html";
      var lastId = msgs.getAttribute("data-last") || "";
      var nowLast = rows.length ? rows[rows.length - 1].id + ":" + rows.length : "";
      if (silent && nowLast && nowLast === lastId) return;
      msgs.setAttribute("data-last", nowLast);
      msgs.innerHTML = rows.map(function (m) {
        var mineRow = m.sender_id === meId;
        return '<div class="dm-bub' + (mineRow ? " me" : "") + '" data-mid="' + m.id + '" data-mine="' + (mineRow ? 1 : 0) + '" data-body="' + C.esc(m.body) + '">' +
          (m.book_id ? bookCard(m.book_id) : "") +
          "<span>" + C.esc(m.body) + "</span>" +
          "<em>" + C.ago(m.created_at) + (m.edited_at ? " · edited" : "") + "</em>" +
        "</div>";
      }).join("") || '<div class="cm-empty cm-empty--sm">Say hello 👋</div>';
      msgs.scrollTop = msgs.scrollHeight;
      try {
        C.toastMark(rows.filter(function (m) { return m.sender_id === uid; })
          .map(function (m) { return C.toastKey({ type: "dm", who: uid, at: m.created_at }); }));
      } catch (e) {}
    }

    /* ---- send ---- */
    document.getElementById("dmSend").addEventListener("submit", async function (e) {
      e.preventDefault();
      var body = document.getElementById("dmBody").value.trim();
      if (!body) return;
      document.getElementById("dmBody").value = "";
      try { await C.sendDM(uid, body); await loadThread(); }
      catch (err) { alert("Message failed — " + (err && err.message ? err.message : err)); }
    });

    /* ---- message actions: popout right where you tapped ---- */
    var ctx = document.getElementById("ctxPop");
    msgs.addEventListener("click", function (e) {
      var bub = e.target.closest(".dm-bub");
      if (!bub || e.target.closest(".dm-book")) return;
      selectedMsg = bub;
      var mineRow = bub.getAttribute("data-mine") === "1";
      document.getElementById("actEdit").hidden = !mineRow;
      document.getElementById("actDelAll").hidden = !mineRow;
      openPop(ctx, e.clientX, e.clientY + 8);
    });
    document.getElementById("actEdit").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg) return;
      var cur = selectedMsg.getAttribute("data-body") || "";
      var next = prompt("Edit your message:", cur);
      if (next === null || !next.trim() || next === cur) return;
      try { await C.editDM(selectedMsg.getAttribute("data-mid"), next.trim()); await loadThread(); }
      catch (err) { alert("Edit failed — " + (err && err.message ? err.message : err)); }
    });
    document.getElementById("actDelAll").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg || !confirm("Delete this message for everyone?")) return;
      try { await C.deleteDM(selectedMsg.getAttribute("data-mid")); await loadThread(); }
      catch (err) { alert("Delete failed — " + (err && err.message ? err.message : err)); }
    });
    document.getElementById("actDelMe").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg) return;
      try { await C.hideDM(selectedMsg.getAttribute("data-mid")); await loadThread(); }
      catch (err) { alert("Couldn't hide — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
    });

    /* ---- chat options: flipping ⋯ popout ---- */
    var pop = document.getElementById("dmPop"), menuBtn = document.getElementById("dmMenuBtn");
    menuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!pop.hidden) { closePop(pop); menuBtn.classList.remove("on"); return; }
      menuBtn.classList.add("on");
      var r = menuBtn.getBoundingClientRect();
      openPop(pop, r.right, r.bottom + 8);
    });
    document.getElementById("popProfile").addEventListener("click", function () {
      closePop(pop); menuBtn.classList.remove("on");
      location.href = "profile.html?id=" + uid;
    });
    document.getElementById("popClear").addEventListener("click", async function () {
      closePop(pop); menuBtn.classList.remove("on");
      if (!confirm("Clear this chat for yourself? (Messages stay for the other person.)")) return;
      try { await C.clearThread(uid); await loadThread(); }
      catch (err) { alert("Clear failed — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
    });

    /* ---- book picker ---- */
    var picker = document.getElementById("dmPicker"), pkList = document.getElementById("pkList"), pkSearch = document.getElementById("pkSearch");
    function renderBooks(q) {
      q = (q || "").toLowerCase().trim();
      var hits = BOOKS.filter(function (b) {
        return !q || (b.title + " " + b.author).toLowerCase().indexOf(q) >= 0;
      }).slice(0, 40);
      pkList.innerHTML = hits.map(function (b) {
        return '<button class="pk-row" data-book="' + b.id + '">' +
          '<img src="' + C.esc(b.cover || "") + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
          "<div><b>" + C.esc(b.title) + "</b><span>" + C.esc(b.author) + "</span></div>＋</button>";
      }).join("") || '<p class="cm-empty cm-empty--sm">No book matched that.</p>';
    }
    document.getElementById("dmPlus").addEventListener("click", function () {
      picker.hidden = false;
      requestAnimationFrame(function () { picker.classList.add("on"); pkSearch.focus(); });
      renderBooks("");
    });
    document.getElementById("pkX").addEventListener("click", function () {
      picker.classList.remove("on"); setTimeout(function () { picker.hidden = true; }, 220);
    });
    pkSearch.addEventListener("input", function () { renderBooks(this.value); });
    pkList.addEventListener("click", async function (e) {
      var b = e.target.closest("[data-book]");
      if (!b) return;
      var book = BOOKS.filter(function (x) { return x.id === b.getAttribute("data-book"); })[0];
      if (!book) return;
      picker.classList.remove("on"); setTimeout(function () { picker.hidden = true; }, 220);
      try {
        await C.sendDM(uid, "📕 You should read " + book.title + " — " + (book.tagline || "it's good!"), book.id);
        await loadThread();
      } catch (err) { alert("Send failed — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
    });

    /* ---- routing ---- */
    if (!uid) {
      try {
        var ref0 = document.referrer ? new URL(document.referrer) : null;
        if (ref0 && ref0.host === location.host && ref0.pathname.indexOf("dm.html") < 0) {
          sessionStorage.setItem("tsb_dm_return", ref0.pathname + ref0.search);
        }
      } catch (e) {}
      back.addEventListener("click", function (e) {
        e.preventDefault();
        var ret = "";
        try { ret = sessionStorage.getItem("tsb_dm_return") || ""; } catch (err) {}
        location.href = ret || "stories.html?tab=people";
      });
      loadList();
    } else {
      list.hidden = true;
      thread.hidden = false;
      menuBtn.hidden = false;
      loadThread();
      setInterval(function () { loadThread(true); }, 6000);
    }
    });
  })();
  </script>
  <script src="js/bar.js?v=204" defer></script>
</body>
</html>
