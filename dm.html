    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>

<body class="cmpage dmpage">
  <header class="cm-top">
    <a class="cm-top__back" id="dmBack" href="stories.html?tab=people" aria-label="Back">←</a>
    <h1 class="cm-top__t" id="dmTitle"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Messages</h1>
    <button class="cm-top__act" id="dmMenuBtn" hidden title="Chat options">⋯</button>
  </header>

  <!-- chat options popout (anchored under the ⋯ dot) -->
  <div class="dm-pop" id="dmPop" hidden>
    <button id="popProfile"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> View profile</button>
    <button id="popClear"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg> Clear chat <small>(for me)</small></button>
  </div>

  <!-- message action popout (anchored where you tapped) -->
  <div class="dm-pop" id="ctxPop" hidden>
    <button id="actEdit"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> Edit</button>
    <button id="actDelAll"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete for everyone</button>
    <button id="actDelMe"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Delete for me</button>
  </div>

  <main class="cm-wrap" id="dmMain">
    <div id="dmList" class="dm-list"></div>
    <div id="dmThread" class="dm-thread" hidden>
      <div id="dmThreadBanner" class="dm-threadbanner" hidden></div>
      <div class="dm-msgs" id="dmMsgs"></div>
      <!-- v250: one capsule. The mic is a real SVG docked inside the field and
           morphs into Send the moment there is text — no emoji, no orphan button. -->
      <!-- v250: inline paper note. Voice problems are explained here, in the
           thread, instead of a blocking alert() that hides the whole screen. -->
      <div class="dm-note" id="dmNote" role="status" aria-live="polite" hidden></div>

      <form class="dm-send" id="dmSend">
        <button class="dm-plus" id="dmPlus" type="button" title="Send a book" aria-label="Send a book" aria-expanded="false" aria-haspopup="dialog">

        </button>
        <div class="dm-field">
          <input id="dmBody" class="dm-input" maxlength="1000" placeholder="Say something kind…" autocomplete="off" aria-label="Message">
          <button class="dm-micbtn" id="dmMic" type="button"
                  title="Hold to record a voice message" aria-label="Hold to record a voice message">
            <span class="vsrc__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11.2v.9a6.5 6.5 0 0 0 13 0v-.9"/><path d="M12 18.6V22"/><path d="M8.6 22h6.8"/></svg></span>
            <span class="vsrc__send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 11.6 19.4 5a.7.7 0 0 1 .94.94l-6.6 15.2a.7.7 0 0 1-1.3-.06l-2.2-6.1-6.1-2.2a.7.7 0 0 1-.06-1.3z"/><path d="m10.1 13.9 4.6-4.6"/></svg></span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- book picker -->
  <div class="dm-picker" id="dmPicker" hidden>
    <div class="dm-picker__card">
      <div class="dm-picker__head">
        <b><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Recommend a book</b>

      <div class="dm-picker__list" id="pkList"></div>
    </div>

  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var V = window.TSB_VOICE;
    var BOOKS = window.BOOKS || [];
    var uid = (location.search.match(/[?&]u=([a-f0-9-]{36})/) || [])[1] || "";
    var list = document.getElementById("dmList"), thread = document.getElementById("dmThread");
    var msgs = document.getElementById("dmMsgs"), back = document.getElementById("dmBack");
    var meId = "";
    var selectedMsg = null;

    /* ---------- anchored popouts ---------- */
    function openPop(pop, x, y) {
      pop.hidden = false;
      var w = 210, h = pop.offsetHeight || 130;
      var left = Math.min(Math.max(10, x - w + 20), window.innerWidth - w - 10);
      var top = Math.min(Math.max(10, y), window.innerHeight - h - 10);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
      requestAnimationFrame(function () { pop.classList.add("on"); });
    }
    function closePop(pop) { pop.classList.remove("on"); setTimeout(function () { pop.hidden = true; }, 180); }
    document.addEventListener("click", function (e) {
      ["dmPop", "ctxPop"].forEach(function (id) {
        var pop = document.getElementById(id);
        if (!pop.hidden && !pop.contains(e.target) && e.target.id !== "dmMenuBtn" && !e.target.closest(".dm-bub")) closePop(pop);
      });
    });

    C.whenReady(function () {
    if (!C.signedIn()) {
      list.innerHTML = '<div class="cm-empty">Sign in to message readers.<br><a class="cm-write" href="login.html">Sign in — it’s free →</a></div>';
      return;
    }
    meId = (C.me() || {}).id || "";

    function ava(prof, id) {
      if (!prof) return '<div class="cm-ava cm-ava--lg"><span>R</span></div>';
      var u = C.avaUrl(prof.name, prof.avatar_url, id || prof.id);
      return '<div class="cm-ava cm-ava--lg">' + (u ? '<img src="' + C.esc(u) + '" alt="">' : "<span>" + C.esc((prof.name || "R").charAt(0).toUpperCase()) + "</span>") + "</div>";
    }

    async function loadList() {
      list.innerHTML = '<div class="cm-empty cm-empty--sm">Loading messages…</div>';
      var rows = [];
      try { rows = await C.myMessages(200); } catch (e) {}
      rows = rows.filter(function (m) { return !(m.hidden_for || []).some(function (h) { return h === meId; }); });
      var convs = C.conversations(rows, meId);
      if (!convs.length) {
        list.innerHTML = '<div class="cm-empty">No messages yet.<br>Find readers in <a href="stories.html?tab=people">' + C.icon('people') + " People</a> and hit " + C.icon('chat') + ".</div>";
        return;
      }
      list.innerHTML = "";
      for (var i = 0; i < convs.length; i++) {
        var cv = convs[i];
        var prof = null;
        try { prof = await C.getProfile(cv.user_id); } catch (e) {}
        var a = document.createElement("div");
        a.className = "dm-row";
        var lastTxt = cv.last.book_id ? C.icon('book') + " recommended a book" : C.esc(cv.last.body).slice(0, 60);
        var unread = rows.filter(function (m) { return m.sender_id === cv.user_id && m.read === false; }).length;
        var lastTick = (cv.last.sender_id === meId)
          ? '<span class="dm-tick dm-tick--mini' + (cv.last.read ? " read" : "") + '">✓✓</span>' : "";
        a.className = "dm-row" + (unread ? " dm-row--unread" : "");
        a.innerHTML = '<a class="dm-row__ava" href="profile.html?id=' + cv.user_id + '">' + ava(prof, cv.user_id) + "</a>" +
          '<a class="dm-row__meta" href="dm.html?u=' + cv.user_id + '"><b>' + C.esc(prof ? prof.name : "Reader") + (C.isOfficial(cv.user_id) ? '<span class="cm-vtick">✔</span>' : "") + (unread ? '<b class="dm-unread">' + unread + "</b>" : "") + "</b>" +
          "<span>" + lastTxt + " " + lastTick + "</span></a>" +
          '<a class="dm-row__side" href="dm.html?u=' + cv.user_id + '"><span class="cm-time">' + C.ago(cv.last.created_at) + "</span>" + C.icon('chat') + "</a>";
        list.appendChild(a);
      }
    }

    /* inline paper note — voice problems are explained in the thread,
       never with a blocking alert() on a phone */
    var noteEl = document.getElementById("dmNote"), noteTimer = 0;
    function note(msg, kind) {
      if (!noteEl) return;
      clearTimeout(noteTimer);
      noteEl.textContent = msg;
      noteEl.className = "dm-note on" + (kind ? " dm-note--" + kind : "");
      noteEl.hidden = false;
      noteTimer = setTimeout(function () {
        noteEl.className = "dm-note";
        setTimeout(function () { noteEl.hidden = true; }, 260);
      }, 5200);
    }

    function bookCard(bookId) {
      var b = BOOKS.filter(function (x) { return x.id === bookId; })[0];
      if (!b) return "";
      return '<a class="dm-book" href="book.html?id=' + b.id + '">' +
        '<img src="' + C.esc(b.cover || "") + '" alt="" onerror="this.style.display=\'none\'">' +
        "<div><b>" + C.esc(b.title) + "</b><span>" + C.esc(b.author) + "</span><em>Open in library →</em></div></a>";
    }

    async function loadThread(silent) {
      var rows = [];
      try { rows = await C.threadWith(uid); } catch (e) {}
      var prof = null;
      try { prof = await C.getProfile(uid); } catch (e) {}
      document.getElementById("dmTitle").innerHTML = C.icon("chat") + " " + C.esc(prof ? prof.name : "Reader");
      back.href = "dm.html";
      var lastId = msgs.getAttribute("data-last") || "";
      var nowLast = rows.length ? rows[rows.length - 1].id + ":" + rows.length : "";
      if (silent && nowLast && nowLast === lastId) return;
      /* never repaint the thread while a voice note is playing — the old
         6 s poll used to cut people off mid-sentence */
      if (silent && msgs.querySelector(".vp.is-playing")) return;
      msgs.setAttribute("data-last", nowLast);
      // WhatsApp-style: a tick is blue if peer has read it OR has replied after it
      function waRead(m, all) {
        if (m.read) return true;
        // if peer sent any message after this mine message, they must have seen it
        try {
          var mt = Date.parse(m.created_at);
          for (var i = 0; i < all.length; i++) {
            var n = all[i];
            if (n.sender_id === uid && Date.parse(n.created_at) > mt) return true;
          }
        } catch (e) {}
        return false;
      }
      msgs.innerHTML = rows.map(function (m) {
        var mineRow = m.sender_id === meId;
        var isRead = mineRow ? waRead(m, rows) : false;
        var body = String(m.body || "");
        return '<div class="dm-bub' + (mineRow ? " me" : "") + (m.audio_url ? " dm-bub--voice" : "") + '" data-mid="' + m.id + '" data-mine="' + (mineRow ? 1 : 0) + '" data-body="' + C.esc(body) + '">' +
          (m.book_id ? bookCard(m.book_id) : "") +
          /* v250: the real player — ring progress, scrubbable waveform,
             elapsed/total and 1× 1.5× 2×. The bare <audio controls> is gone. */
          (m.audio_url && V ? V.playerHTML(m.audio_url, { mine: mineRow, label: "Voice message" }) : "") +
          (m.audio_url && !V ? '<audio class="dm-audio" controls preload="none" src="' + C.esc(m.audio_url) + '"></audio>' : "") +
          (body.trim() ? "<span>" + C.esc(body) + "</span>" : "") +
          "<em>" + C.ago(m.created_at) + (m.edited_at ? " · edited" : "") + "</em>" +
          (mineRow ? '<span class="dm-tick' + (isRead ? " read" : "") + '" title="' + (isRead ? "Read" : "Sent") + '">' + "✓✓" + "</span>" : "") +
        "</div>";
      }).join("") || '<div class="cm-empty cm-empty--sm">Say hello 👋</div>';
      if (V) V.mountPlayers(msgs);
      msgs.scrollTop = msgs.scrollHeight;
      (function () {
        var banner = document.getElementById("dmThreadBanner"); if (!banner) return;
        var meta = getThreadMeta(uid);
        if (!meta) { for (var i = 0; i < rows.length; i++) { if (rows[i].book_id && rows[i].expires_at && Date.parse(rows[i].expires_at) > Date.now()) { meta = { bookId: rows[i].book_id, expiresAt: Date.parse(rows[i].expires_at) }; break; } } }
        if (meta && meta.expiresAt > Date.now()) {
          var bk = (window.BOOKS || []).filter(function (x) { return x.id === meta.bookId; })[0];
          var days = Math.ceil((meta.expiresAt - Date.now()) / 864e5);
          banner.hidden = false;
          banner.innerHTML = '📖 7-day reading thread' + (bk ? ' · <b>' + C.esc(bk.title) + '</b>' : '') + ' · <b>' + days + 'd left</b>';
        } else { banner.hidden = true; }
      })();
      try {
        /* v223 read receipts: opening the thread marks THEIR messages read.
           My own ticks are NOT swept blue here — each tick follows its own
           message's m.read flag, so blue only ever means "they read it". */
        C.markThreadRead(uid).catch(function () {});
      } catch (e) {}
      try {
        /* v250: talking to someone IS reading their notifications. These keys
           go into the one shared ledger, so the bell and the You-page badge
           stop flagging them — and they still stay in the notification list. */
        C.notifMarkRead(rows.filter(function (m) { return m.sender_id === uid; })
          .map(function (m) { return C.notifKey({ type: "dm", who: uid, at: m.created_at }); }));
        C.paintNotifUI([]);
      } catch (e) {}
    }

    /* ---- send ---- */
    document.getElementById("dmSend").addEventListener("submit", async function (e) {
      e.preventDefault();
      var body = document.getElementById("dmBody").value.trim();
      if (!body) return;
      document.getElementById("dmBody").value = "";
      syncMicMode();
      /* optimistic bubble: ✓ = just sent, then ✓✓ once the server confirms */
      var pend = document.createElement("div");
      pend.className = "dm-bub me dm-bub--pend";
      pend.innerHTML = "<span>" + C.esc(body) + '</span><em>just now</em><span class="dm-tick pending">✓</span>';
      msgs.appendChild(pend); msgs.scrollTop = msgs.scrollHeight;
      try {
        await C.sendDM(uid, body);
        await loadThread();
        /* v250: replying IS reading — the "new message" note never comes back */
        try { C.notifMarkPeer(uid).catch(function () {}); } catch (e2) {}
      }
      catch (err) {
        pend.classList.add("dm-bub--fail");
        setTimeout(function () { pend.remove(); }, 4000);
        C.say("Message failed — " + (err && err.message ? err.message : err));
      }
    });

    /* live read receipts: while the thread is open, poll lightly; blue ✓✓ when they read */
    /* ---- voice messages + reading-thread meta ---- */
    function saveThreadMeta(peer, bookId, expires) { try { var a = JSON.parse(localStorage.getItem("tsb_threads") || "{}"); a[peer] = { bookId: bookId, expiresAt: expires }; localStorage.setItem("tsb_threads", JSON.stringify(a)); } catch (e) {} }
    function getThreadMeta(peer) { try { return (JSON.parse(localStorage.getItem("tsb_threads") || "{}"))[peer] || null; } catch (e) { return null; } }
    /* ---- 🎙️ voice notes (v250) ------------------------------------
       Hold to record · release to send · slide up to review (Delete/Send)
       · quick tap for hands-free. Live waveform, mm:ss timer, 2:00 cap,
       correct mime per browser, inline errors instead of alert(). */
    var dmMic = document.getElementById("dmMic");
    var dmBody = document.getElementById("dmBody");
    var voiceCtl = null;

    /* the mic pill doubles as Send once there is text */
    function micIsSend() {
      var hasText = !!(dmBody && dmBody.value.trim());
      var busy = voiceCtl && voiceCtl.state && voiceCtl.state() !== "idle";
      return hasText && !busy;
    }
    function syncMicMode() {
      if (!dmMic) return;
      var send = micIsSend();
      dmMic.classList.toggle("is-send", send);
      /* type=submit while there is text: the browser does the work, so the
         pill sends even if a gesture handler ever swallows the click */
      dmMic.type = send ? "submit" : "button";
      dmMic.setAttribute("aria-label", send ? "Send message" : "Hold to record a voice message");
      dmMic.setAttribute("title", send ? "Send" : "Hold to record \u00b7 slide up to review");
    }
    if (dmBody) {
      dmBody.addEventListener("input", syncMicMode);
      dmBody.addEventListener("focus", syncMicMode);
    }

    /* optimistic "uploading" bubble so the send never feels dead */
    function uploadingBubble(sec) {
      var b = document.createElement("div");
      b.className = "dm-bub me dm-bub--pend dm-bub--voice";
      var bars = "";
      for (var i = 0; i < 26; i++) bars += "<i></i>";
      b.innerHTML = '<div class="dm-vup"><span class="dm-vup__spin"></span>' +
        '<span class="dm-vup__wave">' + bars + '</span>' +
        '<b>Uploading voice note' + (sec ? " · " + V.mmss(sec) : "") + '…</b></div>' +
        '<em>just now</em><span class="dm-tick pending">✓</span>';
      msgs.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
      return b;
    }

    if (V) {
      voiceCtl = V.attach({
        micBtn: dmMic,
        /* while there is text the pill is Send, not a recorder */
        isEnabled: function () { return !(dmBody && dmBody.value.trim()); },
        onState: function (st) {
          if (!dmMic) return;
          var live = (st === "recording" || st === "review");
          dmMic.classList.toggle("is-live", live);
          /* v250: a live note shows the ✓ (tap = send) — and while it is LOCKED
             the note keeps recording after you let go, exactly like WhatsApp */
          dmMic.classList.toggle("is-lock", live);
          dmMic.classList.toggle("is-send", false);
          if (st === "idle") syncMicMode();
        },
        onError: function (msg) { note(msg, "bad"); },
        onUnsupported: function () {
          note("Voice notes need a browser with microphone recording. You can still type.", "bad");
        },
        onSend: async function (file, meta) {
          if (!(window.TSB_CONFIG && TSB_CONFIG.DM_AUDIO)) {
            throw new Error("Voice needs Supabase storage — run SQL #3 v4 in docs/SUPABASE-STEP-BY-STEP.md, then set DM_AUDIO:true in config.js.");
          }
          var pend = uploadingBubble(meta && meta.duration);
          try {
            var url = await C.upload(file, "tsb-audio");
            await C.sendDM(uid, "", null, { audio_url: url });
            pend.remove();
            await loadThread();
            /* v250: a voice reply clears the peer's unread note too */
            try { C.notifMarkPeer(uid).catch(function () {}); } catch (e2) {}
            note("Voice note sent · " + V.mmss(meta.duration), "good");
          } catch (err) {
            pend.classList.add("dm-bub--fail");
            setTimeout(function () { try { pend.remove(); } catch (e) {} }, 2600);
            throw err;                       /* the recorder stage shows Retry / Discard */
          }
        }
      });
    }
    syncMicMode();

    var tPoll = setInterval(async function () {
      if (document.getElementById("dmThread").hidden) return;
      try {
        var fresh = await C.threadWith(uid, 60);
        /* v223: per-message receipts — a tick turns blue only when ITS
           message was actually read by the other person. */
        // WhatsApp-style poll: blue if read OR peer replied after
        fresh.forEach(function (m) {
          if (m.sender_id !== meId) return;
          var alreadyRead = !!m.read;
          if (!alreadyRead) {
            try {
              var mt = Date.parse(m.created_at);
              for (var i = 0; i < fresh.length; i++) {
                var n = fresh[i];
                if (n.sender_id === uid && Date.parse(n.created_at) > mt) { alreadyRead = true; break; }
              }
            } catch (e) {}
          }
          if (!alreadyRead) return;
          var t = msgs.querySelector('.dm-bub[data-mid="' + m.id + '"] .dm-tick');
          if (t) { t.classList.add("read"); t.title = "Read"; }
        });
      } catch (e) {}
    }, 10000);

    /* ---- message actions: LONG PRESS, exactly as you asked -------------
       A tap is for listening, reading and following a link. The three
       destructive verbs (edit · delete for me · delete for everyone) only
       appear when you deliberately hold the bubble — so tapping a voice note
       to play it can never pop a menu over it. */
    var ctx = document.getElementById("ctxPop");
    var HOLD_MS = 430, pressTimer = 0, pressStart = null, pressBub = null;

    function openActions(bub, x, y) {
      selectedMsg = bub;
      var mineRow = bub.getAttribute("data-mine") === "1";
      document.getElementById("actEdit").hidden = !mineRow;
      document.getElementById("actDelAll").hidden = !mineRow;
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
      openPop(ctx, x, y + 8);
    }
    function cancelPress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = 0; }
      pressBub = null; pressStart = null;
      if (ctx && !ctx.hidden) return;
    }
    /* never hijack the player, book cards or links inside a bubble */
    function pressable(el) {
      if (!el) return null;
      if (el.closest(".dm-book") || el.closest(".vp") || el.closest("a")) return null;
      return el.closest(".dm-bub");
    }
    msgs.addEventListener("pointerdown", function (e) {
      var bub = pressable(e.target);
      if (!bub) return;
      pressBub = bub;
      pressStart = { x: e.clientX, y: e.clientY };
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        pressTimer = 0;
        if (!pressBub) return;
        var b = pressBub, st = pressStart;
        pressBub = null;
        openActions(b, st.x, st.y);
      }, HOLD_MS);
    });
    msgs.addEventListener("pointermove", function (e) {
      if (!pressStart) return;
      if (Math.abs(e.clientX - pressStart.x) > 12 || Math.abs(e.clientY - pressStart.y) > 12) cancelPress();
    });
    msgs.addEventListener("pointerup", cancelPress);
    msgs.addEventListener("pointercancel", cancelPress);
    msgs.addEventListener("pointerleave", cancelPress);
    /* desktop right-click should feel the same as a long press */
    msgs.addEventListener("contextmenu", function (e) {
      var bub = pressable(e.target);
      if (!bub) return;
      e.preventDefault();
      cancelPress();
      openActions(bub, e.clientX, e.clientY);
    });
    document.getElementById("actEdit").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg) return;
      var cur = selectedMsg.getAttribute("data-body") || "";
      var next = prompt("Edit your message:", cur);
      if (next === null || !next.trim() || next === cur) return;
      try { await C.editDM(selectedMsg.getAttribute("data-mid"), next.trim()); await loadThread(); }
      catch (err) { C.say("Edit failed — " + (err && err.message ? err.message : err)); }
    });
    document.getElementById("actDelAll").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg || !confirm("Delete this message for everyone?")) return;
      try { await C.deleteDM(selectedMsg.getAttribute("data-mid")); await loadThread(); }
      catch (err) { C.say("Delete failed — " + (err && err.message ? err.message : err)); }
    });
    document.getElementById("actDelMe").addEventListener("click", async function () {
      closePop(ctx);
      if (!selectedMsg) return;
      try { await C.hideDM(selectedMsg.getAttribute("data-mid")); await loadThread(); }
      catch (err) { C.say("Couldn't hide — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
    });

    /* ---- chat options: flipping ⋯ popout ---- */
    var pop = document.getElementById("dmPop"), menuBtn = document.getElementById("dmMenuBtn");
    menuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!pop.hidden) { closePop(pop); menuBtn.classList.remove("on"); return; }
      menuBtn.classList.add("on");
      var r = menuBtn.getBoundingClientRect();
      openPop(pop, r.right, r.bottom + 8);
    });
    document.getElementById("popProfile").addEventListener("click", function () {
      closePop(pop); menuBtn.classList.remove("on");
      location.href = "profile.html?id=" + uid;
    });
    document.getElementById("popClear").addEventListener("click", async function () {
      closePop(pop); menuBtn.classList.remove("on");
      if (!confirm("Clear this chat for yourself? (Messages stay for the other person.)")) return;
      try { await C.clearThread(uid); await loadThread(); }
      catch (err) { C.say("Clear failed — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
    });

    /* ---- book picker ---- */
    var picker = document.getElementById("dmPicker"), pkList = document.getElementById("pkList"), pkSearch = document.getElementById("pkSearch");
    function renderBooks(q) {
      q = (q || "").toLowerCase().trim();
      var hits = BOOKS.filter(function (b) {
        return !q || (b.title + " " + b.author).toLowerCase().indexOf(q) >= 0;
      }).slice(0, 40);
      pkList.innerHTML = hits.map(function (b) {
        return '<div class="pk-row" data-book="' + b.id + '">' +
          '<img src="' + C.esc(b.cover || "") + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
          "<div><b>" + C.esc(b.title) + "</b><span>" + C.esc(b.author) + "</span></div>" +
          '<span class="pk-acts"><button class="pk-rec" type="button" data-book="' + b.id + '">＋ Recommend</button><button class="pk-read" type="button" data-book="' + b.id + '">📖 Read together</button></span>' +
          "</div>";
      }).join("") || '<p class="cm-empty cm-empty--sm">No book matched that.</p>';
    }
    document.getElementById("dmPlus").addEventListener("click", function () {
      picker.hidden = false;
      requestAnimationFrame(function () { picker.classList.add("on"); pkSearch.focus();       var pb = document.getElementById("dmPlus");
      if (pb) pb.setAttribute("aria-expanded", picker && !picker.hidden ? "true" : "false");
      if (pb) pb.classList.toggle("is-picking", !!(picker && !picker.hidden));
    });
      renderBooks("");
          var pb = document.getElementById("dmPlus");
      if (pb) pb.setAttribute("aria-expanded", picker && !picker.hidden ? "true" : "false");
      if (pb) pb.classList.toggle("is-picking", !!(picker && !picker.hidden));
    });
    document.getElementById("pkX").addEventListener("click", function () {
      picker.classList.remove("on"); setTimeout(function () { picker.hidden = true; }, 220);
    });
    pkSearch.addEventListener("input", function () { renderBooks(this.value); });
    pkList.addEventListener("click", async function (e) {
      var row = e.target.closest("[data-book]");
      if (!row) return;
      var book = BOOKS.filter(function (x) { return x.id === row.getAttribute("data-book"); })[0];
      if (!book) return;
      if (e.target.closest(".pk-read")) {
        picker.classList.remove("on"); setTimeout(function () { picker.hidden = true; }, 220);
        try {
          var exp = Date.now() + 7 * 864e5;
          saveThreadMeta(uid, book.id, exp);
          await C.sendDM(uid, "📖 Let's read " + book.title + " together — 7-day thread! " + (book.tagline || "tap the book above"), book.id,
            (window.TSB_CONFIG && TSB_CONFIG.DM_THREADS) ? { expires_at: new Date(exp).toISOString() } : null);
          await loadThread();
        } catch (err) { C.say("Couldn't start thread — " + (err && err.message ? err.message : err)); }
        return;
      }
      if (e.target.closest(".pk-rec")) {
        picker.classList.remove("on"); setTimeout(function () { picker.hidden = true; }, 220);
        try {
          await C.sendDM(uid, "You should read " + book.title + " — " + (book.tagline || "it's good!"), book.id);
          await loadThread();
        } catch (err) { C.say("Send failed — " + (err && err.message ? err.message : err) + " (run SQL #6)"); }
      }
    });

    /* ---- routing ---- */
    if (!uid) {
      try {
        var ref0 = document.referrer ? new URL(document.referrer) : null;
        if (ref0 && ref0.host === location.host && ref0.pathname.indexOf("dm.html") < 0) {
          sessionStorage.setItem("tsb_dm_return", ref0.pathname + ref0.search);
        }
      } catch (e) {}
      back.addEventListener("click", function (e) {
        e.preventDefault();
        var ret = "";
        try { ret = sessionStorage.getItem("tsb_dm_return") || ""; } catch (err) {}
        location.href = ret || "stories.html?tab=people";
      });
      loadList();
    } else {
      list.hidden = true;
      thread.hidden = false;
      menuBtn.hidden = false;
      loadThread();
      setInterval(function () { loadThread(true); }, 6000);
    }
    });
  })();
  </script>
  <script src="js/bar.js?v=267" defer></script>
