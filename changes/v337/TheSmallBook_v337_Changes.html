#stage[data-type=intro] .veil{background:radial-gradient(ellipse 50% 40% at 50% 46%,#F4EEE2 45%,rgba(244,238,226,.82) 70%,rgba(244,238,226,.35) 100%)}
.portrait .veil{background:linear-gradient(180deg,rgba(244,238,226,.15) 0%,rgba(244,238,226,.15) 54%,#F4EEE2 61%)}
#stage.portrait[data-type=intro] .veil{background:radial-gradient(ellipse 60% 30% at 50% 44%,#F4EEE2 45%,rgba(244,238,226,.8) 72%,rgba(244,238,226,.35) 100%)}
.phone{position:absolute;left:0;top:0;transform-origin:0 0;z-index:5;opacity:0}
.bezel{position:relative;width:418px;height:916px;border-radius:66px;background:#16130F;padding:14px;box-sizing:border-box;box-shadow:0 60px 90px -40px rgba(22,19,15,.55),0 0 0 2px #2B251E inset}
.scr{position:relative;width:390px;height:888px;border-radius:52px;overflow:hidden;background:#FBF8F1}
.scr:before{content:"9:41";position:absolute;left:38px;top:15px;font:600 16px SG,sans-serif;color:#16130F;z-index:60}
.scr:after{content:"";position:absolute;right:30px;top:19px;width:64px;height:12px;z-index:60;background:linear-gradient(90deg,#16130F 0 3px,transparent 3px 5px,#16130F 5px 8px,transparent 8px 10px,#16130F 10px 13px,transparent 13px 15px,#16130F 15px 18px,transparent 18px 34px,rgba(22,19,15,.85) 34px 40px,transparent 40px 42px,#16130F 42px 62px);border-radius:3px}
.island{position:absolute;top:25px;left:50%;width:122px;height:34px;margin-left:-61px;border-radius:20px;background:#000;z-index:61}
.shot{position:absolute;left:0;top:44px;width:390px;height:844px;overflow:hidden;background:#FBF8F1;transform-origin:50% 40%}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot .after{position:absolute;inset:0}
.wl{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #FFC800;margin-left:-1.5px;z-index:3}
.wl i{position:absolute;top:46%;left:-21px;width:38px;height:38px;border-radius:50%;background:#FFC800;box-shadow:0 6px 16px rgba(22,19,15,.35)}
.wl i:before,.wl i:after{content:"";position:absolute;top:13px;border:6px solid transparent}
.wl i:before{left:3px;border-right-color:#16130F}.wl i:after{right:3px;border-left-color:#16130F}
.tag{position:absolute;bottom:118px;font:700 11px SG,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;z-index:4;white-space:nowrap}
.tb{left:12px;background:rgba(22,19,15,.88);color:#fff}.ta{right:12px;background:#FFC800;color:#16130F;box-shadow:0 8px 18px -8px rgba(230,160,0,.8)}
.tap{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,200,0,.32);border:3px solid #FFC800;pointer-events:none;z-index:50;opacity:0;box-shadow:0 0 0 10px rgba(255,200,0,.12)}
.notes,.specs,.extra{position:absolute;pointer-events:none}
.notes>div,.specs>div{position:relative}
.landscape .notes{left:84px;top:170px;width:440px}
.landscape .specs{left:1150px;top:250px;width:370px}
.portrait .notes{left:70px;top:990px;width:760px}
.portrait .specs{left:70px;top:1400px;width:760px;display:flex;gap:14px}
.notes .k{font:700 15px SG,sans-serif;letter-spacing:.16em;color:#9A7A1E;text-transform:uppercase}
.notes .h{font:500 60px/1.02 NR,Georgia,serif;letter-spacing:-.025em;color:#16130F;margin:18px 0 30px}
.notes .h i,.bigtitle .h i{font-style:italic;background:linear-gradient(transparent 62%,#FFD84D 62%,#FFD84D 90%,transparent 90%) no-repeat;background-size:0 100%}
.notes .n{display:flex;gap:16px;margin:0 0 20px;font:500 19px/1.5 SG,sans-serif;color:#4A4339}
.notes .n i{flex:none;width:10px;height:10px;border-radius:50%;background:#FFC800;margin-top:9px;box-shadow:0 0 0 4px #FFF1BF}
.portrait .notes .h{font-size:56px;margin:12px 0 22px}
.portrait .notes .n{font-size:20px;margin-bottom:12px}
.specs .s{display:block;background:rgba(255,255,255,.75);border:1.5px solid #E7DECD;border-radius:22px;padding:18px 22px;margin:0 0 14px;backdrop-filter:blur(6px)}
.portrait .specs .s{flex:1;margin:0;padding:16px 18px}
.specs .s b{display:block;font:700 12px SG,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9A8F7C;margin-bottom:6px}
.specs .s span{font:500 21px/1.3 NR,DEVS,Georgia,serif;color:#16130F}
.portrait .specs .s span{font-size:18px}
.bigtitle{position:absolute;left:0;right:0;top:290px;text-align:center;pointer-events:none;opacity:0}
.portrait .bigtitle{top:560px}
.bigtitle .k{font:700 16px SG,sans-serif;letter-spacing:.2em;color:#9A7A1E;text-transform:uppercase}
.bigtitle .h{font:500 112px/1 NR,Georgia,serif;letter-spacing:-.03em;color:#16130F;margin:22px 0 26px}
.portrait .bigtitle .h{font-size:96px}
.bigtitle .sub{font:500 22px/1.5 SG,sans-serif;color:#4A4339;max-width:720px;margin:0 auto;padding:0 40px}
/* extras */
.landscape .extra{left:1090px;top:200px;width:470px}
.portrait .extra{left:70px;top:1380px;width:760px}
.extra.live{pointer-events:auto;opacity:0}
.shelf3{display:flex;gap:30px;align-items:flex-end;justify-content:center;padding:30px 0 50px}
.portrait .shelf3{gap:60px;padding:10px 0 34px}
.cap{font:600 13px SG,sans-serif;letter-spacing:.06em;color:#857C6E;text-align:center}
.bk3__back b{font-family:SG,sans-serif!important}.bk3__back p,.bk3__spine span{font-family:NR,Georgia,serif!important}
.extra.ladder .lr{display:flex;align-items:center;gap:12px;margin:0 0 14px;opacity:0}
.ll{flex:1.25;background:#fff;border:1.5px solid #E7DECD;border-radius:18px;padding:13px 16px;font:500 17px/1.35 SG,DEV,TAM,BEN,sans-serif;color:#16130F}
.la{width:44px;height:3px;position:relative}.la i{position:absolute;inset:0;background:#FFC800;border-radius:2px;transform-origin:0 50%;transform:scaleX(0)}
.la i:after{content:"";position:absolute;right:-2px;top:-5px;border:6.5px solid transparent;border-left-color:#FFC800;border-right:0}
.lp{flex:1;border-radius:999px;padding:13px 16px;font:700 15px SG,sans-serif;text-align:center;background:#16130F;color:#FFF6D8}
.lp.y{background:#FFC800;color:#16130F}.lp.g{background:#E8E1D2;color:#4A4339}
.landscape .extra.ladder{top:300px}
.portrait .extra.ladder{top:1360px}.portrait .ll{font-size:16px;padding:10px 14px}.portrait .lr{margin-bottom:10px}
.landscape .extra.stats{left:600px;top:150px;width:930px}
.portrait[data-type=stats] .notes{top:150px}.portrait .extra.stats{top:560px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px}
.st{background:#fff;border:1.5px solid #E7DECD;border-radius:24px;padding:22px 26px;opacity:0}
.st em{display:block;font:500 64px/1 NR,serif;font-style:normal;color:#16130F;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st b{display:block;font:700 17px SG,sans-serif;color:#16130F;margin:10px 0 4px}.st span{font:500 14px/1.4 SG,sans-serif;color:#857C6E}
.steps>div{display:flex;align-items:center;gap:16px;font:500 24px/1.3 NR,serif;color:#16130F;margin-bottom:12px;opacity:0}
.steps span{flex:none;width:36px;height:36px;border-radius:50%;background:#FFC800;display:flex;align-items:center;justify-content:center;font:700 15px SG,sans-serif}

#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;box-sizing:border-box;background:rgba(22,19,15,.94);color:#EFE6D3;font:600 13px SG,system-ui,sans-serif;z-index:10}
#bar button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#pp{width:42px;height:42px;border-radius:50%;background:#FFC800!important;color:#16130F!important;flex:none}
#tm,#tt{width:38px;text-align:center;font-variant-numeric:tabular-nums;flex:none;opacity:.85}
#tl{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
#tl:before{content:"";position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:rgba(239,230,211,.18)}
#tlf{position:absolute;left:0;top:13px;height:4px;border-radius:2px;background:#FFC800}
#tl i{position:absolute;top:10px;width:2px;height:10px;margin-left:-1px;background:rgba(239,230,211,.45);border-radius:1px}
#tlk{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#chb{height:34px;padding:0 14px!important;border-radius:999px;background:rgba(239,230,211,.1)!important;flex:none}
#chl{position:absolute;right:18px;bottom:70px;width:300px;max-height:70vh;overflow:auto;background:#211C16;border-radius:20px;padding:8px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#chl.on{display:block}
#chl button{width:100%;justify-content:flex-start!important;gap:12px;height:42px;padding:0 12px!important;border-radius:12px;font:600 14px SG,sans-serif;text-align:left}
#chl button span{width:22px;color:#FFC800;font-size:12px}
#chl button em{margin-left:auto;font-style:normal;opacity:.5;font-size:12px}
#chl button.cur{background:rgba(255,200,0,.14)}
@media (max-width:560px){#tt,#chb{display:none}#bar{gap:10px;padding:0 12px}}

    extraEl.style.opacity = (1 - out * 0).toFixed(3);
    [...extraEl.querySelectorAll('.st')].forEach((s, i) => {
      const k = E.o5(seg(lt, .5 + i * .3, 1.4));
      s.style.opacity = E.o3(seg(lt, .4 + i * .3, .6)); s.style.transform = `translateY(${(1 - E.o5(seg(lt, .4 + i * .3, .8))) * 24}px)`;
      const em = s.querySelector('em'); em.textContent = Math.round(k * +em.dataset.n).toLocaleString('en-IN');
    });
    [...extraEl.querySelectorAll('.steps>div')].forEach((s, i) => {
      const k = E.o5(seg(lt, 2.6 + i * .45, .7)); s.style.opacity = k; s.style.transform = `translateX(${(1 - k) * 24}px)`;
    });
    notesEl.style.opacity = 1;
  }
  /* control bar */
  if (CT.tlf) {
    CT.tlf.style.width = (ST.t / TOTAL * 100) + '%'; CT.tlk.style.left = (ST.t / TOTAL * 100) + '%';
    CT.tm.textContent = fmt(ST.t);
    CT.pp.innerHTML = ST.playing ? '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
    [...CT.chl.children].forEach((b, i) => b.classList.toggle('cur', i === c.i));
  }
}
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ---------------- controls ---------------- */
function buildBar() {
  bar = document.getElementById('bar');
  bar.innerHTML = `<button id="pp" aria-label="Play or pause"></button><span id="tm">0:00</span><div id="tl"><div id="tlf"></div>${CH.map(c => `<i style="left:${c.a / TOTAL * 100}%"></i>`).join('')}<div id="tlk"></div></div><span id="tt">${fmt(TOTAL)}</span><button id="chb">Chapters</button><div id="chl">${CH.map(c => `<button><span>${c.no == null ? '' : String(c.no).padStart(2, '0')}</span>${c.label}<em>${fmt(c.a)}</em></button>`).join('')}</div>`;
  ['pp', 'tm', 'tl', 'tlf', 'tlk', 'chb', 'chl'].forEach(id => CT[id] = document.getElementById(id));
  CT.pp.onclick = e => { e.stopPropagation(); toggle(); };
  CT.chb.onclick = e => { e.stopPropagation(); CT.chl.classList.toggle('on'); };
  [...CT.chl.children].forEach((b, i) => b.onclick = e => { e.stopPropagation(); render(CH[i].a + .01); CT.chl.classList.remove('on'); play(); });
  let drag = false;
  const scrub = e => { const r = CT.tl.getBoundingClientRect(); render(clamp((e.clientX - r.left) / r.width) * TOTAL); };
  CT.tl.addEventListener('pointerdown', e => { drag = true; CT.tl.setPointerCapture(e.pointerId); scrub(e); });
  CT.tl.addEventListener('pointermove', e => { if (drag) scrub(e); });
  CT.tl.addEventListener('pointerup', () => { drag = false; });
  stage.addEventListener('click', e => { if (e.target.closest('.bk3')) return; toggle(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') render(ST.t + 5); if (e.code === 'ArrowLeft') render(ST.t - 5);
    if (/^Digit\d$/.test(e.code)) { const ch = CH.find(c => c.no === +e.code.slice(5)); if (ch) { render(ch.a + .01); play(); } }
  });
}
function play() { if (ST.t >= TOTAL - .05) render(0); ST.playing = true; ST.last = performance.now(); }
function toggle() { if (ST.playing) { ST.playing = false; render(ST.t); } else play(); }
function tick(now) {
  if (ST.playing) {
    const dt = Math.min(.1, (now - ST.last) / 1000); ST.last = now;
    if (ST.t + dt >= TOTAL - .002) { ST.playing = false; render(TOTAL - .002); }
    else render(ST.t + dt);
  }
  requestAnimationFrame(tick);
}

(function(){
  const go = () => { boot(); const q = new URLSearchParams(location.search); const t = parseFloat(q.get('t')); if (!isNaN(t)) render(t, true); if (!q.has('still')) { ST.playing = true; ST.last = performance.now(); } requestAnimationFrame(tick); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
})();
</script>
