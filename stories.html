      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";

<body class="cmpage">
  <h1 class="sr-only">Stories, TheSmallBook</h1>
  <header class="cm-head cm-head--v19">
    <div class="cm-head__row">
      <div>
        <div class="cm-head__t">STORIES</div>
        <div class="cm-head__s">real readers · real lessons · real voices</div>
      </div>
      <a class="cm-bell" href="notifications.html" title="Notifications & updates"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="nt-dot" data-notifdot hidden></span></a>
    </div>
    <div class="cm-head__acts">
      <button class="cm-chipbtn" id="reelsBtn" title="Bursts, swipe through stories">🎬 Bursts</button>
      <button class="cm-chipbtn" id="finderBtn" title="Find readers to follow"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Find readers</button>
      <button class="cm-chipbtn" id="quoteBtn" title="Post a small quote">❝ Quote</button>
      <button class="cm-write" id="writeBtn">✍️ Write a story</button>
    </div>

  <nav class="cm-tabs" id="cmTabs" aria-label="Story feeds">
    <button data-tab="all" class="on">✨ For you</button>
    <button data-tab="following"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Following</button>
    <button data-tab="people"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> People</button>

  </nav>

  <main class="cm-feed" id="feed" aria-live="polite"></main>

  <div id="finder" class="cm-finder" hidden>
    <div class="cm-finder__card">
      <div class="dm-picker__head"><b><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Find readers</b><button id="finderX" aria-label="Close finder">✕</button></div>
      <div class="pk-search"><span><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><input id="finderQ" placeholder="Search name or id…" autocomplete="off"></div>
      <div class="cm-finder__count" id="finderCount"></div>
      <div class="cm-finder__list" id="finderList"></div>
    </div>

  <div id="reels" class="cm-reels" hidden>
    <button class="cm-reels__x" id="reelsX" aria-label="Close bursts">✕</button>
    <div class="cm-reels__track" id="reelsTrack"></div>
  </div>

  <script src="./js/bootguard.js?v=286"></script>
  <script src="js/prefs.js?v=286"></script>
  <script src="js/lang.js?v=286"></script>

  <script src="js/founder.js?v=286"></script>
  <script src="js/community.js?v=286"></script>
  <script src="js/weekly.js?v=286"></script>
  <!-- v252: the library story shelf (js/stories-seed.js) was never loaded here,
       so none of those stories could ever appear. It is loaded now. -->
  <script src="js/stories-seed.js?v=286"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var feed = document.getElementById("feed");
    var tab = (location.search.match(/[?&]tab=(people|mine|following|all)/) || [])[1] || "all";
    if (tab !== "all") document.querySelectorAll("#cmTabs [data-tab]").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-tab") === tab); });
    var meId = (C.me() || {}).id || "";

    function skeletons(n) {
      var out = "";
      for (var i = 0; i < (n || 4); i++) {
        out += '<article class="cm-card cm-card--skel"><div class="cm-sk cm-sk--cover"></div>' +
          '<div class="cm-card__body"><div class="cm-sk cm-sk--line w60"></div>' +
          '<div class="cm-sk cm-sk--line w90"></div><div class="cm-sk cm-sk--line w40"></div></div></article>';
      }
      return out;
    }

    /* 🎯 personalisation: keywords from the reader's onboarding shelves */
    function interestKeys() {
      var keys = [];
      try {
        var ints = JSON.parse(localStorage.getItem("tsb_interests")) || [];
        var lead = JSON.parse(localStorage.getItem("tsb_ob_lead"));
        if (lead && ints.indexOf(lead) < 0) ints.unshift(lead);
        ints.forEach(function (c) {
          String(c).toLowerCase().split(/[^a-z]+/).forEach(function (w) {
            if (w.length >= 4 && keys.indexOf(w) < 0) keys.push(w);
          });
        });
      } catch (e) {}
      return keys;
    }
    var KEYS = interestKeys();
    var followSet = {};
    function score(p) {
      var sc = 0;
      if (followSet[p.author_id]) sc += 40;
      if (KEYS.length) {
        var txt = ((p.tags || []).join(" ") + " " + p.title + " " + (p.subtitle || "")).toLowerCase();
        KEYS.forEach(function (k) { if (txt.indexOf(k) >= 0) sc += 15; });
      }
      var ageH = (Date.now() - new Date(p.created_at).getTime()) / 36e5;
      sc += Math.max(0, 20 - ageH / 6);
      if (p.audio_url) sc += 2;
      return sc;
    }
    function railHtml(posts) {
      var seen = {}, rail = [];
      posts.forEach(function (p) {
        if (!seen[p.author_id]) { seen[p.author_id] = 1; rail.push(p); }
      });
      rail = rail.slice(0, 12);
      if (!rail.length) return "";
      return '<div class="cm-rail">' + rail.map(function (p) {
        var avu = C.avaUrl(p.author_name, p.author_avatar, p.author_id);
        var av = avu
          ? '<img src="' + C.esc(avu) + '" alt="">'
          : "<span>" + C.esc((p.author_name || "R").charAt(0).toUpperCase()) + "</span>";
        return '<a class="cm-rail__i' + (followSet[p.author_id] ? " fol" : "") + '" href="profile.html?id=' + p.author_id + '" title="' + C.esc(p.author_name) + '">' +
          '<span class="cm-rail__ring">' + av + "</span>" +
          '<span class="cm-rail__n">' + C.esc(String(p.author_name).split(" ")[0]) + "</span></a>";
      }).join("") + "</div>";
    }

    function card(p, extra) {
      var prof = { avatar_url: C.avaUrl(p.author_name, p.author_avatar, p.author_id) };
      var hue = parseInt(String(p.id).replace(/-/g, "").slice(0, 4), 16) % 360;
      var cover = p.cover_url
        ? (C.isVideoUrl(p.cover_url)
            ? '<video src="' + C.esc(p.cover_url) + '" preload="metadata" muted playsinline></video>'
            : '<img src="' + C.esc(p.cover_url) + '" alt="" loading="lazy">')
        : '<span class="cm-quote" style="background:linear-gradient(135deg,hsl(' + hue + ',88%,74%),hsl(' + ((hue + 48) % 360) + ',82%,58%));">' + (p.kind === "quote" ? "❝" : C.esc((p.title || "T").charAt(0).toUpperCase())) + "</span>";
      return '<article class="cm-card' + (p.kind === "quote" ? " cm-card--quote" : "") + '" data-post="' + p.id + '"' + (p.no_download === false ? ' data-free="1"' : "") + ">" +
        '<a class="cm-card__cover" href="story.html?id=' + p.id + '">' + cover +
          (p.audio_url ? '<span class="cm-card__aud">🎧</span>' : "") +
          (p.kind === "quote" ? '<span class="cm-card__kind">QUOTE</span>' : (C.isVideoUrl(p.cover_url) ? '<span class="cm-card__kind cm-card__kind--burst">🎬 BURST</span>' : "")) +
        "</a>" +
        '<div class="cm-card__body">' +
          '<div class="cm-card__meta">' +
            '<a class="cm-ava" href="profile.html?id=' + p.author_id + '">' +
              (prof.avatar_url ? '<img src="' + C.esc(prof.avatar_url) + '" alt="">' : '<span>' + C.esc((p.author_name || "R").charAt(0).toUpperCase()) + "</span>") +
            "</a>" +
            '<a class="cm-name" href="profile.html?id=' + p.author_id + '">' + C.esc(p.author_name) + (C.isOfficial(p.author_id) ? '<span class="cm-vtick" title="Official channel">✔</span>' : "") + "</a>" +
            '<span class="cm-time">' + C.ago(p.created_at) + "</span>" +
            (p.author_id !== meId ? '<button class="cm-follow" data-follow="' + p.author_id + '">+ Follow</button>' : "") +
          "</div>" +
          ((p.kind === "quote" && p.tags && p.tags.indexOf("qcard") >= 0) ? "" :
            '<a class="cm-card__title" href="story.html?id=' + p.id + '">' + C.esc(p.title) + "</a>") +
          (p.subtitle ? '<p class="cm-card__sub">' + C.esc(p.subtitle) + "</p>" : "") +
          (p.tags && p.tags.length ? '<div class="cm-card__tags">' + p.tags.slice(0, 4).map(function (t) { return "<span># " + C.esc(t) + "</span>"; }).join("") + "</div>" : "") +
          '<div class="cm-card__foot">' +
            '<button class="cm-like" data-like="' + p.id + '">♥ <b>…</b></button>' +
            '<a class="cm-cmts" href="story.html?id=' + p.id + '#comments">' + C.icon('chat') + " <b>…</b></a>" +
            (p.audio_url ? '<button class="cm-listen" data-audio="' + C.esc(p.audio_url) + '" data-title="' + C.esc(p.title) + '">🎧 Listen</button>' : "") +
            '<span class="cm-read">' + C.readMins(p.body) + " min</span>" +
            (p.author_id === meId ? '<button class="cm-del" data-del="' + p.id + '" title="Delete my story">' + C.icon('trash') + "</button>" : "") +
          "</div>" +
        "</div></article>";
    }

    /* ---------- THE WEEKLY PROMPT ----------
       Cold start killor: one official question every week, computed from
       the calendar, same for every reader. The shelf is never silent. */
    var EMPTY_NUDGES = [
      "Say something honest, even one line",
      "What would you add to this?",
      "Which book speaks to this?",
      "Encourage the writer, one line helps",
      "What did this make you remember?",
      "Be the first voice here"
    ];
    function nudgeFor(id) {
      var h = 0, i;
      for (i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
      return EMPTY_NUDGES[h % EMPTY_NUDGES.length];
    }
    function weeklyCard() {
      if (!window.TSB_WEEKLY) return "";
      var wk = TSB_WEEKLY.current();
      var answered = TSB_WEEKLY.done(wk);
      return '<section class="cm-weekly" data-weekly="' + wk.id + '">' +
        '<div class="cm-weekly__top"><span class="cm-weekly__badge">THE LIBRARY ASKS</span>' +
        '<span class="cm-weekly__wk">Week ' + wk.week + ' of ' + wk.year + '</span></div>' +
        '<h2 class="cm-weekly__q">' + C.esc(wk.q) + '</h2>' +
        '<p class="cm-weekly__s">One official question every week, same for every reader. Answer it and your story joins the shelf.</p>' +
        '<div class="cm-weekly__row">' +
        (answered
          ? '<span class="cm-weekly__done">✓ You replied this week</span>' +
            '<a class="cm-weekly__cta cm-weekly__cta--ghost" href="' + TSB_WEEKLY.replyHref(wk) + '">Write one more →</a>'
          : '<a class="cm-weekly__cta" href="' + TSB_WEEKLY.replyHref(wk) + '">Answer this week\u2019s prompt →</a>') +
        '</div></section>';
    }
    /* ---------- 📚 LIBRARY STORIES ----------
       The shelf used to be reader posts only, and with a young community that
       means an almost-empty page. Every library story ships with the app, needs
       no network, and reads exactly like a reader post, so the shelf is alive
       on the first visit. Marked clearly, because it is not a person's post. */
    function libraryStories(posted) {
      var all = (window.COMMUNITY_STORIES || []).concat(window.SEED_STORIES || []);
      var seen = {}, hide = posted || {};
      return all.filter(function (s) {
        if (!s || !s.id || !s.title || seen[s.id]) return false;
        seen[s.id] = 1;
        /* v255 · ONE CHANNEL: a story the official account already published
           as a real post yields to that post, never the same story twice */
        return !hide[String(s.title).toLowerCase().trim()];
      }).sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
    }
    /* what the TheSmallBook channel has already published (5 archive stories
       live in the database under its name) */
    var officialTitlesP = null;
    function officialTitles() {
      if (!officialTitlesP) {
        officialTitlesP = (C.enabled && C.api)
          ? C.api("posts?author_id=eq." + C.OFFICIAL_ID + "&select=title&limit=100", {})
              .then(function (rows) {
                return (rows || []).map(function (r) { return String(r.title || "").toLowerCase().trim(); });
              })
              .catch(function () { return []; })
          : Promise.resolve([]);
      }
      return officialTitlesP;
    }
    /* the book a library story came from, read straight out of data.js */
    function bookName(id) {
      try {
        var all = window.BOOKS || (typeof BOOKS !== "undefined" ? BOOKS : []) || [];
        for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].title || "";
      } catch (e) {}
      return "";
    }
    function libCard(s) {
      var words = String(s.text || "").split(/\s+/).length;
      var mins = Math.max(1, Math.round(words / 200));
      /* an image that will not load (offline, or a cover pulled from the shelf)
         falls back to the story's own tile instead of a broken picture icon */
      var fallbackTile = '<span class="cm-quote" style="background:var(--yellow);font-size:3rem;">' + (s.emoji || "\ud83d\udcd6") + "</span>";
      var cover = s.cover
        ? '<img src="' + C.esc(s.cover) + '" alt="" loading="lazy" onerror="this.outerHTML=' +
          JSON.stringify(fallbackTile).replace(/"/g, "&quot;") + '">'
        : fallbackTile;
      var book = bookName(s.bookId);
      return '<article class="cm-card cm-card--lib" data-lib="' + C.esc(s.id) + '">' +
        '<a class="cm-card__cover" href="story.html?id=' + encodeURIComponent(s.id) + '">' + cover +
          '<span class="cm-card__kind cm-card__kind--lib">\ud83d\udcd6 FROM THE LIBRARY</span>' +
        "</a>" +
        '<div class="cm-card__body">' +
          '<div class="cm-card__meta">' +
            '<span class="cm-ava cm-ava--lib"><img src="assets/loader-logo.png" alt="" onerror="this.parentNode.textContent=\'\ud83d\udcd5\'"></span>' +
            '<span class="cm-name cm-name--lib">TheSmallBook <span class="cm-vtick" title="Official channel of TheSmallBook">\u2714</span></span>' +
            '<span class="cm-time">' + C.esc(s.date || "") + "</span>" +
          "</div>" +
          '<a class="cm-card__title" href="story.html?id=' + encodeURIComponent(s.id) + '">' + C.esc(s.title) + "</a>" +
          /* v254: the hook, a question that sounds like the reader's own 2 AM */
          (s.hook ? '<p class="cm-card__hook">\u201c' + C.esc(s.hook) + '\u201d</p>' : "") +
          (book ? '<p class="cm-card__sub">Inspired by <b>' + C.esc(book) + "</b></p>" : "") +
          '<div class="cm-card__foot">' +
            '<span class="cm-read">' + mins + " min read</span>" +
            '<a class="cm-cmts cm-cmts--lib" href="story.html?id=' + encodeURIComponent(s.id) + '">READ IT →</a>' +
          "</div>" +
        "</div></article>";
    }
    function libraryShelf(limit, posted) {
      var rows = libraryStories(posted);
      if (!rows.length) return "";
      var shown = rows.slice(0, limit || 12);
      var more = rows.length - shown.length;
      return '<div class="cm-sect">\ud83d\udcd6 From the library, ' + rows.length + ' stories you can read right now' +
        (more > 0 ? " \u00b7 showing " + shown.length : "") + "</div>" +
        shown.map(libCard).join("") +
        (more > 0 ? '<div class="cm-more">' + more + " more on the shelf, they rotate with every reader post.</div>" : "");
    }

    async function hydrate(root) {
      var ids = [];
      root.querySelectorAll("[data-like]").forEach(function (b) { ids.push(b.getAttribute("data-like")); });
      await Promise.all(ids.map(async function (id) {
        try {
          var info = await C.likeInfo(id);
          root.querySelectorAll('[data-like="' + id + '"]').forEach(function (b) {
            b.querySelector("b").textContent = info.count;
            b.classList.toggle("on", info.mine);
          });
          root.querySelectorAll('.cm-cmts[href*="' + id + '"] b').forEach(function (b) {});
        } catch (e) {}
      }));
      await Promise.all(ids.map(async function (id) {
        try {
          var cs = await C.listComments(id);
          root.querySelectorAll('.cm-cmts[href="story.html?id=' + id + '#comments"] b').forEach(function (b) {
            b.textContent = cs.length;
            /* a quiet story gets a reply prompt, right under the foot */
            if (!cs.length && b.closest) {
              var cardEl = b.closest(".cm-card");
              if (cardEl && !cardEl.querySelector(".cm-nudge")) {
                var foot = cardEl.querySelector(".cm-card__foot");
                if (foot) {
                  var na = document.createElement("a");
                  na.className = "cm-nudge";
                  na.href = "story.html?id=" + id + "#comments";
                  na.innerHTML = C.icon("chat") + " No replies yet, be the first: " + C.esc(nudgeFor(id));
                  foot.parentNode.insertBefore(na, foot.nextSibling);
                }
              }
            }
          });
        } catch (e) {}
      }));
      root.querySelectorAll("[data-follow]").forEach(async function (b) {
        try {
          var f = await C.followInfo(b.getAttribute("data-follow"));
          b.classList.toggle("on", f.mine);
          b.textContent = f.mine ? "✓ Following" : "+ Follow";
        } catch (e) {}
      });
    }

    /* ---------- People: EVERY reader, always, and kept live ----------
       v248 capped this at listProfiles(60), so anyone who had posted,
       liked, followed or messaged but never triggered ensureProfile()
       simply did not exist here. v250 unions profiles + posts + likes +
       comments + follows + message participants (C.allPeople), so nobody
       can go missing, and repaints only when the data actually changed. */
    var peopleTimer = 0, peopleSig = "", peopleStamp = 0, peopleCache = [];

    function personCard(p, me, fol, req) {
      var isMe = me && p.id === me.id;
      var priv = p.is_public === false;
      var asked = !!(req && req[ p.id ]);
      var following = !!fol[p.id];
      var ava = C.avaUrl(p.name, p.avatar_url, p.id);
      var stats = [];
      if (p.posts)     stats.push(C.icon("pencil") + " " + p.posts + (p.posts === 1 ? " post" : " posts"));
      if (p.likesGot)  stats.push(C.icon("heart") + " " + p.likesGot);
      if (p.followers) stats.push(C.icon("user") + " " + p.followers + (p.followers === 1 ? " follower" : " followers"));
      if (p.progress)  stats.push(C.icon("book") + " " + p.progress + "/2637 read");
      /* v250 · LAST SEEN, real, private by choice. A reader who switched
         "show my last seen" off publishes nothing, so this line simply
         disappears for them and nobody can infer anything. */
      var active = "";
      try {
        var seenAt = C.lastSeenOf ? C.lastSeenOf(p) : 0;
        if (seenAt) {
          var txt = C.lastSeenText(seenAt);
          var online = /online now/.test(txt);
          active = '<span class="cm-seen' + (online ? " cm-seen--on" : "") + '">' +
                     (online ? '<i class="cm-seen__dot"></i>' : "") + C.esc(txt) + "</span>";
        } else if (p.lastActive) {
          active = '<span class="cm-time cm-time--live">' + C.ago(new Date(p.lastActive).toISOString()) + "</span>";
        }
      } catch (e) {}
      return '<div class="cm-person' + (p._synth ? " cm-person--ghost" : "") + '" data-person="' + p.id + '">' +
        '<div class="cm-person__top">' +
        /* the letter is always there; the photo sits on top and hides itself
           if it 404s, so no avatar ever renders as an empty circle */
        '<div class="cm-ava cm-ava--lg"><span>' + C.esc(String(p.name || "R").charAt(0).toUpperCase()) + "</span>" +
          (ava ? '<img src="' + C.esc(ava) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : "") + "</div>" +
        '<div class="cm-person__meta">' +
          '<a class="cm-name" href="profile.html?id=' + p.id + '">' + C.esc(p.name || "A reader") +
            (C.isOfficial(p.id) ? '<span class="cm-vtick">\u2714</span>' : "") +
            (isMe ? ' <span class="cm-time">\u00b7 you</span>' : "") +
            (p.is_public === false ? ' <span class="cm-lock" title="Private account">\ud83d\udd12</span>' : "") + "</a>" +
          (stats.length ? '<span class="cm-time">' + stats.join(" \u00b7 ") + "</span>" : "") +
          (p.bio ? '<span class="cm-bio">' + C.esc(p.bio) + "</span>" : "") +

        "</div></div>" +
        '<div class="cm-person__acts">' +
          (isMe ? "" :
            (priv
              ? (following
                  ? '<button class="cm-follow on" data-pfol="' + p.id + '">Following \u2713</button>'
                  : (asked
                      ? '<button class="cm-follow is-req" data-pcancel="' + p.id + '" title="Tap to cancel your request">Requested \u23f3</button>'
                      : '<button class="cm-follow" data-preq="' + p.id + '" title="Private account, they must accept">\ud83d\udd12 Request</button>'))
              : '<button class="cm-follow' + (following ? " on" : "") + '" data-pfol="' + p.id + '">' + (following ? "Following \u2713" : "+ Follow") + "</button>") +
           '<a class="cm-dmbtn" href="dm.html?u=' + p.id + '" title="Message" aria-label="Message ' + C.esc(p.name || "reader") + '">' + C.icon("chat") + "</a>") +
        "</div>" +
      "</div>";
    }

    /* the identity, whichever source is ready first */
    function whoAmI() {
      try { if (window.TSB_AUTH && TSB_AUTH.me) { var a = TSB_AUTH.me(); if (a && a.id) return a; } } catch (e) {}
      try { if (C.me) { var c = C.me(); if (c && c.id) return c; } } catch (e) {}
      return null;
    }

    function peopleHeader(n, waits) {
      var head = '<div class="cm-sect cm-sect--people">' +
        '<span class="cm-live" title="Updates while you watch"><i></i> live</span>' +
        "All " + n + (n === 1 ? " reader" : " readers") + ", last seen, progress, one tap to follow" +
      "</div>";
      if (!waits || !waits.length) return head;
      var rows = waits.map(function (p) {
        return '<div class="cm-req__row" data-reqrow="' + p.id + '">' +
            '<div class="cm-ava cm-ava--sm"><span>' + C.esc(String(p.name || "R").charAt(0).toUpperCase()) + "</span></div>" +
            '<div class="cm-req__meta"><a class="cm-name" href="profile.html?id=' + p.id + '">' + C.esc(p.name || "A reader") + "</a>" +
              '<span class="cm-time">wants to follow you \u00b7 private account</span></div>' +
            '<div class="cm-req__btns">' +
              '<button class="cm-reqbtn cm-reqbtn--ok" data-reqok="' + p.id + '">Accept</button>' +
              '<button class="cm-reqbtn cm-reqbtn--no" data-reqno="' + p.id + '">Decline</button>' +
            "</div></div>";
      }).join("");
      return head +
        '<div class="cm-req"><div class="cm-req__t">\ud83d\udd10 Follow requests <span class="cm-req__n">' + waits.length + "</span>" +
        '<span class="cm-time" style="margin-left:auto">they cannot see your stories until you accept</span></div>' + rows + "</div>";
    }

    async function renderPeople(quiet) {
      if (!quiet) { feed.innerHTML = skeletons(); peopleSig = ""; }
      var people = [];
      try { people = await C.allPeople(); } catch (e) {}
      peopleCache = people;

      if (!people.length) {
        clearInterval(peopleTimer); peopleTimer = 0;
        feed.innerHTML = '<div class="cm-empty">No readers yet, be the first face here.<br><button class="cm-write" id="ew">\u270d\ufe0f Write your first story</button></div>';
        var ew2 = document.getElementById("ew"); if (ew2) ew2.addEventListener("click", function () { location.href = "write.html"; });
        return;
      }

      /* signature: repaint only when something really moved, so the live
         refresh never flickers or steals your scroll position */
      var sig = people.map(function (p) {
        return [p.id, p.name, p.posts, p.likesGot, p.followers, p.comments, p.progress,
                p.is_public === false ? 1 : 0, p.lastActive || 0,
                (C.lastSeenOf ? (C.lastSeenOf(p) || 0) : 0)              /* v250: last seen */
                , (C.iRequested && C.iRequested(p) ? 1 : 0)              /* v250: my pending request */
               ].join(",");
      }).join("|");
      /* identity is part of the picture: the requests inbox can only be
         drawn once we know who we are */
      var ident = whoAmI();
      sig = (ident && ident.id ? ident.id : "anon") + "#" + sig;
      if (quiet && sig === peopleSig) { peopleStamp = Date.now(); return; }
      var firstPaint = !peopleSig;
      peopleSig = sig; peopleStamp = Date.now();

      var fol = {};
      if (C.signedIn()) { try { (await C.followingIds()).forEach(function (id) { fol[id] = 1; }); } catch (e) {} }
      /* v250 fix · window.TSB_AUTH only appears AFTER auth.js finishes its
         async boot, so a bare TSB_AUTH reference at first paint is undefined
         and any identity work silently vanished. C.me() reads the session
         straight from storage, so it is there immediately, and we re-render
         when auth finally announces itself (see the tsb:auth listener). */
      var me = null;
      if (C.signedIn()) me = whoAmI();

      /* v250 · private accounts. Nobody is hidden any more, but a private
         reader only gains a follower once THEY say yes. Settling here means
         an accept made on the other phone becomes a real follow on this one. */
      var waits = [];
      if (me && me.id) {
        try {
          var settled = await C.settleRequests(people);
          if (settled && settled.accepted && settled.accepted.length) {
            settled.accepted.forEach(function (id) { fol[id] = 1; });
            C.say("\ud83c\udf89 Follow request accepted, you're connected.");
          }
          if (settled && settled.declined && settled.declined.length) {
            C.say("A follow request was declined.");
          }
        } catch (e) {}
        try { waits = C.pendingTo(people, me.id); } catch (e) { waits = []; }
      }
      var reqMap = {};
      if (me && me.id) people.forEach(function (p) { if (C.iRequested(p)) reqMap[p.id] = 1; });

      feed.innerHTML = peopleHeader(people.length, waits) +
        '<div class="cm-people">' + people.map(function (p) { return personCard(p, me, fol, reqMap); }).join("") + "</div>";

      /* keep it alive: 25 s poll while this tab is on screen */
      clearInterval(peopleTimer);
      peopleTimer = setInterval(function () {
        if (document.hidden) return;
        if (tab !== "people") { clearInterval(peopleTimer); peopleTimer = 0; return; }
        renderPeople(true);
      }, 25000);
      if (!firstPaint && !quiet) feed.scrollTop = 0;
    }

    /* auth.js announces itself when it is ready; if we painted before that,
       repaint so the requests inbox appears without a reload */
    try {
      window.addEventListener("tsb:auth", function () {
        if (tab === "people") renderPeople(true);
      });
    } catch (e) {}

    /* ---------- Bursts: infinite swipe-through of EVERY story (videos, quotes, covers, text) ---------- */
    var BURST_BATCH = 12;
    var burstSeen = {}, burstOffset = 0, burstDone = false, burstBusy = false, burstTimer = null;

    function reelHTML(p) {
      var rhue = parseInt(String(p.id).replace(/-/g, "").slice(0, 4), 16) % 360;
      var isVid = p.cover_url && C.isVideoUrl(p.cover_url);
      var bgStyle = isVid
        ? ' style="background:linear-gradient(150deg,hsl(' + rhue + ',70%,22%),hsl(' + ((rhue + 48) % 360) + ',65%,12%))"'
        : (p.cover_url ? ' style="background-image:url(\'' + p.cover_url + '\')"' : ' style="background:linear-gradient(150deg,hsl(' + rhue + ',70%,32%),hsl(' + ((rhue + 48) % 360) + ',65%,18%))"');
      return '<article class="cm-reel' + (p.cover_url && !isVid ? " has-cover" : "") + '"' + (p.no_download === false ? ' data-free="1"' : "") + bgStyle + '>' +
        (isVid ? '<video class="cm-reel__vid" src="' + C.esc(p.cover_url) + '" preload="metadata" playsinline></video>' : "") +
        '<div class="cm-reel__grad"></div>' +
        '<div class="cm-reel__body">' +
          (p.kind === "quote" ? '<span class="cm-reel__q">❝</span>' : "") +
          '<a class="cm-reel__who" href="story.html?id=' + p.id + '">' +
            '<div class="cm-ava">' + (C.avaUrl(p.author_name, p.author_avatar, p.author_id) ? '<img src="' + C.esc(C.avaUrl(p.author_name, p.author_avatar, p.author_id)) + '" alt="">' : "<span>" + C.esc((p.author_name || "R").charAt(0).toUpperCase()) + "</span>") + "</div>" +
            "<b>" + C.esc(p.author_name) + (C.isOfficial(p.author_id) ? '<span class="cm-vtick">✔</span>' : "") + "</b>" +
          "</a>" +
          '<h3 class="cm-reel__t">' + C.esc(p.title) + "</h3>" +
          (p.subtitle ? '<p class="cm-reel__s">' + C.esc(p.subtitle) + "</p>" : "") +
          '<div class="cm-reel__acts">' +
            '<button class="cm-like" data-rlike="' + p.id + '">♥ <b>…</b></button>' +
            (p.audio_url ? '<button class="cm-listen" data-audio="' + C.esc(p.audio_url) + '" data-title="' + C.esc(p.title) + '">🎧 Listen</button>' : "") +
            '<a class="cm-cmts" href="story.html?id=' + p.id + '">' + C.icon('chat') + " Open</a>" +
          "</div>" +
        "</div>" +
      "</article>";
    }

    /* v252, the library, in the burst rail too. Swiping through "nothing to
       see" is what made a young community feel dead; these ship with the app
       and are endless. Framed identically, so the rail never looks broken. */
    function reelHTMLib(s) {
      var words = String(s.text || "").split(/\s+/).length;
      var cover = s.cover || "";
      var bg = cover
        ? ' style="background-image:url(\'' + C.esc(cover) + '\')"'
        : ' style="background:linear-gradient(150deg,#1c1a17,#3a352b)"';
      var book = bookName(s.bookId);
      var head = s.hook || s.title;
      var under = s.hook ? s.title : (book ? "Inspired by " + book : "");
      return '<article class="cm-reel cm-reel--lib' + (cover ? " has-cover" : "") + '"' + bg + '>' +
        '<div class="cm-reel__grad"></div>' +
        '<div class="cm-reel__body">' +
          '<span class="cm-reel__q">\ud83d\udcd6</span>' +
          '<div class="cm-reel__who cm-reel__who--lib"><div class="cm-ava cm-ava--lib"><img src="assets/loader-logo.png" alt="" onerror="this.parentNode.textContent=\'\ud83d\udcd5\'"></div><b>TheSmallBook<span class="cm-vtick">\u2714</span></b></div>' +
          '<h3 class="cm-reel__t">' + C.esc(head) + '</h3>' +
          (under ? '<p class="cm-reel__s">' + C.esc(under) + '</p>' : "") +
          '<div class="cm-reel__acts">' +
            '<span class="cm-reel__metaline">' + Math.max(1, Math.round(words / 200)) + " min read</span>" +
            '<a class="cm-cmts" href="story.html?id=' + encodeURIComponent(s.id) + '">' + C.icon('chat') + " Read it →</a>" +
          "</div>" +
        "</div></article>";
    }
    var burstLibDone = false;
    async function burstLoadLibrary() {
      if (burstLibDone) return;
      burstLibDone = true;
      var rows = libraryStories();
      if (!rows.length) return;
      var el = burstEnd();
      if (!el) return;
      var posted = {};
      try { (await officialTitles()).forEach(function (t) { posted[t] = 1; }); } catch (e) {}
      rows = libraryStories(posted);
      var show = rows.filter(function (x) { return x.cover; }).concat(rows.filter(function (x) { return !x.cover; }));
      show.forEach(function (x) { el.insertAdjacentHTML("beforebegin", reelHTMLib(x)); });
    }

    function burstEnd() { return document.getElementById("burstEnd"); }
    function paintBurstEnd() {
      var el = burstEnd();
      if (!el) return;
      el.innerHTML = burstBusy ? "Loading more bursts…"
        : (burstDone ? "You're all caught up ✨<br><small>Reader bursts come from the community, the library ones above never run out.</small>" : "");
    }

    async function burstLoadMore() {
      if (burstBusy || burstDone) return;
      burstBusy = true; paintBurstEnd();
      var posts = [];
      try { posts = await C.listPosts({ limit: BURST_BATCH, offset: burstOffset }); } catch (e) {}
      var fresh = posts.filter(function (p) { return !burstSeen[p.id]; });
      fresh.forEach(function (p) { burstSeen[p.id] = 1; });
      var el = burstEnd();
      if (fresh.length && el) {
        fresh.forEach(function (p) { el.insertAdjacentHTML("beforebegin", reelHTML(p)); });
        try { C.protectMedia(document.getElementById("reelsTrack")); } catch (e) {}
        fresh.forEach(async function (p) {
          try {
            var info = await C.likeInfo(p.id);
            document.querySelectorAll('[data-rlike="' + p.id + '"]').forEach(function (b) {
              b.classList.toggle("on", !!info.mine);
              b.querySelector("b").textContent = info.count;
            });
          } catch (e) {}
        });
      }
      burstOffset += posts.length;
      if (posts.length < BURST_BATCH) { burstDone = true; burstLoadLibrary(); }
      burstBusy = false; paintBurstEnd();
      var empty = document.querySelector("#reelsTrack .cm-empty");
      if (empty && Object.keys(burstSeen).length) empty.remove();
    }

    function burstOnScroll() {
      var tr = document.getElementById("reelsTrack");
      if (tr.scrollTop + tr.clientHeight >= tr.scrollHeight - window.innerHeight * 1.5) burstLoadMore();
    }

    async function burstCheckNew() {
      var ov = document.getElementById("reels");
      if (ov.hidden || burstBusy) return;
      var latest = [];
      try { latest = await C.listPosts({ limit: 5 }); } catch (e) { return; }
      var fresh = latest.filter(function (p) { return !burstSeen[p.id]; });
      if (fresh.length && !document.getElementById("burstPill")) {
        var d = document.createElement("button");
        d.id = "burstPill"; d.className = "cm-burstpill";
        d.textContent = "⬆ " + fresh.length + " new burst" + (fresh.length > 1 ? "s" : "") + ", tap to refresh";
        d.addEventListener("click", function () { d.remove(); openBursts(); });
        ov.appendChild(d);
      }
    }

    function openBursts() {
      var ov = document.getElementById("reels"), track = document.getElementById("reelsTrack");
      burstSeen = {}; burstOffset = 0; burstDone = false; burstBusy = false; burstLibDone = false;
      track.innerHTML = '<div class="cm-empty">Loading bursts…</div><div class="cm-burstend" id="burstEnd"></div>';
      track.scrollTop = 0;
      ov.hidden = false;
      if (!track.getAttribute("data-init")) {
        track.setAttribute("data-init", "1");
        track.addEventListener("scroll", burstOnScroll, { passive: true });
      }
      burstLoadMore();
      clearInterval(burstTimer);
      burstTimer = setInterval(burstCheckNew, 20000);
    }

    function closeBursts() {
      document.getElementById("reels").hidden = true;
      clearInterval(burstTimer);
      document.querySelectorAll("#reelsTrack video").forEach(function (v) { try { v.pause(); } catch (e) {} });
      try { C.pauseAllMedia(); } catch (e) {}
      var pill = document.getElementById("burstPill");
      if (pill) pill.remove();
    }

    document.getElementById("reelsBtn").addEventListener("click", openBursts);
    document.getElementById("reelsX").addEventListener("click", closeBursts);
    document.getElementById("quoteBtn").addEventListener("click", function () { location.href = "write.html?mode=quote"; });

    async function load() {
      if (tab === "people") return renderPeople();
      clearInterval(peopleTimer); peopleTimer = 0;      /* not on People: stop polling */
      feed.innerHTML = skeletons();
      try {
        if (!C.enabled) {
          feed.innerHTML = '<div class="cm-empty">☁️ Community cloud is being switched on, check back in a bit.</div>';
          return;
        }
        var posts = [];
        if (tab === "mine") {
          if (!meId) { feed.innerHTML = signInCard(); return; }
          posts = await C.listPosts({ author: meId });
        } else if (tab === "following") {
          if (!meId) { feed.innerHTML = signInCard(); return; }
          var ids = await C.followingIds();
          posts = ids.length ? await C.listPosts({ ids: ids }) : [];
          if (!posts.length) { feed.innerHTML = '<div class="cm-empty">' + C.icon('user') + " Follow writers from the For-you feed and their stories land here.</div>"; return; }
        } else {
          posts = await C.listPosts({});
          try { (await C.followingIds()).forEach(function (id) { followSet[id] = 1; }); } catch (e) {}
          posts = posts.slice().sort(function (a, b) { return score(b) - score(a); });
        }
        var libPosted = {};
        try { if (tab === "all") (await officialTitles()).forEach(function (t) { libPosted[t] = 1; }); } catch (e) {}
        if (!posts.length) {
          if (tab === "all") {
            /* no reader posts yet? the shelf is still a shelf, show the library */
            var alone = {};
            try { (await officialTitles()).forEach(function (t) { alone[t] = 1; }); } catch (e) {}
            feed.innerHTML = libraryShelf(14, alone);
            return;
          }
          feed.innerHTML = '<div class="cm-empty">✍️ No stories yet, yours could be the first.<br><button class="cm-write" id="emptyWrite">Write the first story</button></div>';
          var ew = document.getElementById("emptyWrite");
          if (ew) ew.addEventListener("click", function () { location.href = "write.html"; });
          return;
        }
        feed.innerHTML = (tab === "all" ? weeklyCard() + railHtml(posts) + '<div class="cm-sect">✨ For you, tuned to your shelves</div>' : "") +
          posts.map(function (p) { return card(p); }).join("") +
          (tab === "all" ? libraryShelf(10, libPosted) : "");
        try { C.protectMedia(feed); } catch (e) {}
        hydrate(feed);
      } catch (e) {
        feed.innerHTML = '<div class="cm-empty">⚠️ Couldn’t reach the community cloud. Pull to refresh.</div>';
      }
    }

    function signInCard() {
      return '<div class="cm-empty">👋 Sign in with Google to write, like and follow.<br>' +
        '<a class="cm-write" href="login.html">Sign in, it’s free →</a></div>';
    }

    /* ---------- tabs ---------- */
    document.getElementById("cmTabs").addEventListener("click", function (e) {
      var b = e.target.closest("[data-tab]");
      if (!b) return;
      tab = b.getAttribute("data-tab");
      document.querySelectorAll("#cmTabs [data-tab]").forEach(function (x) { x.classList.toggle("on", x === b); });
      load();
    });

    /* ---------- double-tap a cover = like (heart burst) ---------- */
    feed.addEventListener("dblclick", async function (e) {
      var cov = e.target.closest(".cm-card__cover");
      if (!cov) return;
      e.preventDefault();
      if (!C.signedIn()) { location.href = "login.html"; return; }
      var cardEl = cov.closest("[data-post]");
      var id = cardEl && cardEl.getAttribute("data-post");
      if (!id) return;
      try {
        await C.setLike(id, true);
        var info = await C.likeInfo(id);
        cardEl.querySelectorAll('[data-like="' + id + '"]').forEach(function (b) {
          b.classList.add("on");
          b.querySelector("b").textContent = info.count;
        });
        var h = document.createElement("span");
        h.className = "cm-heart";
        h.textContent = "♥";
        cov.appendChild(h);
        setTimeout(function () { h.remove(); }, 900);
      } catch (err) {}
    });

    /* ---------- double-tap a cover = like (heart burst) ---------- */
    feed.addEventListener("dblclick", async function (e) {
      var cov = e.target.closest(".cm-card__cover");
      if (!cov) return;
      e.preventDefault();
      if (!C.signedIn()) { location.href = "login.html"; return; }
      var cardEl = cov.closest("[data-post]");
      var id = cardEl && cardEl.getAttribute("data-post");
      if (!id) return;
      try {
        await C.setLike(id, true);
        var info = await C.likeInfo(id);
        cardEl.querySelectorAll('[data-like="' + id + '"]').forEach(function (b) {
          b.classList.add("on");
          b.querySelector("b").textContent = info.count;
        });
        var h = document.createElement("span");
        h.className = "cm-heart";
        h.textContent = "♥";
        cov.appendChild(h);
        setTimeout(function () { h.remove(); }, 900);
      } catch (err) {}
    });

    /* ---------- feed actions ---------- */
    feed.addEventListener("click", async function (e) {
      var t;
      if ((t = e.target.closest("[data-like]"))) {
        e.preventDefault();
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !t.classList.contains("on");
        t.classList.toggle("on", on);
        try {
          await C.setLike(t.getAttribute("data-like"), on);
          var info = await C.likeInfo(t.getAttribute("data-like"));
          t.classList.toggle("on", info.mine);
          t.querySelector("b").textContent = info.count;
        } catch (err) {
          t.classList.toggle("on", !on);
          C.say("Like failed, " + (err && err.message ? err.message : err));
        }
        return;
      }
      if ((t = e.target.closest("[data-pfol]"))) {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        t.disabled = true;
        try {
          var on2 = !t.classList.contains("on");
          await C.setFollow(t.getAttribute("data-pfol"), on2);
          t.classList.toggle("on", on2);
          t.textContent = on2 ? "Following ✓" : "+ Follow";
        } catch (err) { C.say("Follow failed, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      /* ---- v250 · private accounts ---- */
      if ((t = e.target.closest("[data-preq]"))) {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        t.disabled = true;
        try {
          var pidReq = t.getAttribute("data-preq");
          await C.requestFollow(pidReq);
          t.classList.add("is-req");
          t.removeAttribute("data-preq");
          t.setAttribute("data-pcancel", pidReq);
          t.textContent = "Requested ⏳";
          C.say("🔒 Request sent, they'll see it the moment they open the app.");
          renderPeople(true);
        } catch (err) { C.say("Couldn't send that request, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      if ((t = e.target.closest("[data-pcancel]"))) {
        t.disabled = true;
        try {
          await C.cancelFollowRequest(t.getAttribute("data-pcancel"));
          C.say("Request withdrawn.");
          renderPeople(true);
        } catch (err) { C.say("Couldn't withdraw it, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      if ((t = e.target.closest("[data-reqok]"))) {
        t.disabled = true;
        try {
          var rp = peopleCache.filter(function (x) { return x.id === t.getAttribute("data-reqok"); })[0];
          await C.acceptFollowRequest(rp || { id: t.getAttribute("data-reqok"), name: "" });
          C.say("✅ Accepted, they now follow you.");
          renderPeople(true);
        } catch (err) { C.say("Couldn't accept, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      if ((t = e.target.closest("[data-reqno]"))) {
        t.disabled = true;
        try {
          var rp2 = peopleCache.filter(function (x) { return x.id === t.getAttribute("data-reqno"); })[0];
          await C.declineFollowRequest(rp2 || { id: t.getAttribute("data-reqno"), name: "" });
          var row = t.closest("[data-reqrow]"); if (row) row.remove();
          C.say("Declined, they won't be notified loudly, and nothing is shared.");
        } catch (err) { C.say("Couldn't decline, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      if ((t = e.target.closest("[data-rlike]"))) {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        t.disabled = true;
        try {
          var rid = t.getAttribute("data-rlike");
          var onR = !t.classList.contains("on");
          t.classList.toggle("on", onR);
          await C.setLike(rid, onR);
          var infoR = await C.likeInfo(rid);
          t.classList.toggle("on", !!infoR.mine);
          t.querySelector("b").textContent = infoR.count;
        } catch (err) { t.classList.toggle("on", !onR); C.say("Like failed, " + (err && err.message ? err.message : err)); }
        t.disabled = false;
        return;
      }
      if ((t = e.target.closest("[data-follow]"))) {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on2 = !t.classList.contains("on");
        t.classList.toggle("on", on2);
        t.textContent = on2 ? "✓ Following" : "+ Follow";
        try {
          await C.setFollow(t.getAttribute("data-follow"), on2);
          var f = await C.followInfo(t.getAttribute("data-follow"));
          t.classList.toggle("on", f.mine);
          t.textContent = f.mine ? "✓ Following" : "+ Follow";
        } catch (err) {
          t.classList.toggle("on", !on2);
          t.textContent = !on2 ? "✓ Following" : "+ Follow";
          C.say("Follow failed, " + (err && err.message ? err.message : err));
        }
        return;
      }
      if ((t = e.target.closest("[data-audio]"))) {
        C.playAudio(t.getAttribute("data-audio"), t.getAttribute("data-title"));
        return;
      }
      if ((t = e.target.closest("[data-del]"))) {
        if (!confirm("Delete this story for everyone?")) return;
        try { await C.deletePost(t.getAttribute("data-del")); load(); }
        catch (err) { C.say(err && err.message && err.message.indexOf("policy") >= 0 ? ("Delete failed, " + err.message) : "Couldn't delete, are you signed in as the author?"); }
        return;
      }
    });

    /* ---------- double-tap a cover = like (heart burst) ---------- */
    feed.addEventListener("dblclick", async function (e) {
      var cov = e.target.closest(".cm-card__cover");
      if (!cov) return;
      e.preventDefault();
      if (!C.signedIn()) { location.href = "login.html"; return; }
      var cardEl = cov.closest("[data-post]");
      var id = cardEl && cardEl.getAttribute("data-post");
      if (!id) return;
      try {
        await C.setLike(id, true);
        var info = await C.likeInfo(id);
        cardEl.querySelectorAll('[data-like="' + id + '"]').forEach(function (b) {
          b.classList.add("on");
          b.querySelector("b").textContent = info.count;
        });
        var h = document.createElement("span");
        h.className = "cm-heart";
        h.textContent = "♥";
        cov.appendChild(h);
        setTimeout(function () { h.remove(); }, 900);
      } catch (err) {}
    });


    document.getElementById("writeBtn").addEventListener("click", function () { location.href = "write.html"; });
    // v244: no separate Inspire button on Stories, Inspire Desk lives INSIDE the quote & story card in Write (perfectly embedded, as decided)

    document.getElementById("reelsTrack").addEventListener("click", function (e) {
      var t = e.target.closest("[data-audio]");
      if (t) C.playAudio(t.getAttribute("data-audio"), t.getAttribute("data-title"));
    });
    /* ---------- v205: Find readers (public accounts you can follow) ---------- */
    var finderAll = [];
    function finderRender(q) {
      q = (q || "").toLowerCase().trim();
      var list = document.getElementById("finderList");
      var meNow = "";
      try { meNow = (C.me() || {}).id || ""; } catch (e) {}
      var rows = finderAll.filter(function (p) {
        return !q || String(p.name || "").toLowerCase().indexOf(q) >= 0 || String(p.id).indexOf(q) >= 0;
      });
      var cntEl = document.getElementById("finderCount");
      if (cntEl) cntEl.textContent = rows.length + " public reader" + (rows.length === 1 ? "" : "s") + (q ? " (of " + finderAll.length + ")" : "");
      list.innerHTML = rows.length ? rows.map(function (p) {
        var av = C.avaUrl(p.name, p.avatar_url, p.id);
        return '<div class="cm-person" data-fpid="' + p.id + '">' +
          '<div class="cm-person__top">' +
            '<a class="cm-ava cm-ava--lg" href="profile.html?id=' + p.id + '">' + (av ? '<img src="' + C.esc(av) + '" alt="">' : "<span>" + C.esc((p.name || "R").charAt(0).toUpperCase()) + "</span>") + "</a>" +
            '<div class="cm-person__meta">' +
              '<a class="cm-name" href="profile.html?id=' + p.id + '">' + C.esc(p.name || "Reader") + (C.isOfficial(p.id) ? '<span class="cm-vtick">✔</span>' : "") + "</a>" +
              '<span class="cm-time cm-socid">@' + String(p.id).slice(0, 8) + (p._posts ? " · " + C.icon('pencil') + " " + p._posts + " post" + (p._posts === 1 ? "" : "s") : "") + (p.progress ? " · " + C.icon('book') + " " + p.progress + " lessons" : "") + "</span>" +
            "</div>" +
          "</div>" +
          '<div class="cm-person__acts">' +
            (p.id === meNow ? '<span class="cm-time">· you</span>' :
              '<button class="cm-follow" data-ffol="' + p.id + '">' + C.icon('bell') + " Subscribe</button>" +
              '<a class="cm-dmbtn" href="dm.html?u=' + p.id + '" title="Message">' + C.icon('chat') + "</a>") +
          "</div>" +
        "</div>";
      }).join("") : '<p class="cm-empty cm-empty--sm">No public readers match that yet.</p>';
      if (C.signedIn()) {
        C.followingIds().then(function (ids) {
          ids.forEach(function (i) {
            var b = list.querySelector('[data-ffol="' + i + '"]');
            if (b) { b.classList.add("on"); b.textContent = "Subscribed ✓"; }
          });
        }).catch(function () {});
      }
    }
    document.getElementById("finderBtn").addEventListener("click", async function () {
      var ov = document.getElementById("finder");
      ov.hidden = false;
      var list = document.getElementById("finderList");
      list.innerHTML = '<p class="cm-empty cm-empty--sm">Loading readers…</p>';
      try { finderAll = (await C.listProfiles(120)) || []; } catch (e) { finderAll = []; }
      try { var pcA = await C.postCounts(400); finderAll.forEach(function (p) { p._posts = pcA[p.id] || 0; }); } catch (e) {}
      finderRender(document.getElementById("finderQ").value);
    });
    document.getElementById("finderX").addEventListener("click", function () { document.getElementById("finder").hidden = true; });
    document.getElementById("finderQ").addEventListener("input", function () { finderRender(this.value); });
    document.getElementById("finderList").addEventListener("click", async function (e) {
      var t = e.target.closest("[data-ffol]");
      if (!t) return;
      if (!C.signedIn()) { location.href = "login.html"; return; }
      t.disabled = true;
      var on = !t.classList.contains("on");
      try {
        await C.setFollow(t.getAttribute("data-ffol"), on);
        t.classList.toggle("on", on);
        t.innerHTML = on ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe";
      } catch (err) { C.say("Subscribe failed, " + (err && err.message ? err.message : err)); }
      t.disabled = false;
    });

    /* coming back to the tab from another app/screen -> refresh People now */
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && tab === "people" && Date.now() - peopleStamp > 12000) renderPeople(true);
    });

    C.whenReady(function () { if (C.signedIn()) { C.ensureProfile(); C.syncProgress(); C.syncInterests(); } });
    load();
  })();
  </script>
