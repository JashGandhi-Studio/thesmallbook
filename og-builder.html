<!DOCTYPE html>
<!-- OG image builder — render at 1200×630 and screenshot.
     Regenerate: bash tests/browser-bootstrap.sh && node tests/ogshot.js
     Fonts load from Google CDN; ogshot.js patches them to local files. -->
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#111111; --bg:#f2ede2; --paper:#fffdf5;
    --yellow:#ffc800; --red:#ff4d4d; --pink:#ff90e8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Space Grotesk',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle, rgba(17,17,17,.055) 1.3px, transparent 1.6px) 0 0/26px 26px,
      var(--bg);
  }
  .wrap { height:630px; display:flex; flex-direction:column; padding:44px 56px 34px; }

  .head { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand img { width:64px; height:76px; object-fit:contain; filter:drop-shadow(3px 3px 0 rgba(17,17,17,.9)); }
  .brand .wm { font-family:'Archivo Black'; font-size:44px; letter-spacing:-1px; }
  .pill {
    font-family:'Archivo Black'; font-size:19px; letter-spacing:1px;
    background:var(--yellow); border:3.5px solid var(--ink); border-radius:999px;
    box-shadow:4px 4px 0 var(--ink); padding:13px 24px; white-space:nowrap;
  }

  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:26px; text-align:center; }
  .kicker {
    font-size:21px; font-weight:700; letter-spacing:3px;
    display:flex; align-items:center; gap:14px;
  }
  .dots i { display:inline-block; width:10px; height:10px; border:2.5px solid var(--ink); border-radius:50%; margin:0 2.5px; }
  .dots i:nth-child(1){ background:var(--yellow); } .dots i:nth-child(2){ background:var(--red); } .dots i:nth-child(3){ background:var(--pink); }
  h1 { font-family:'Archivo Black'; font-size:64px; line-height:1.13; letter-spacing:-.5px; }
  .hl {
    display:inline-block; background:var(--yellow); border:4px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink); padding:2px 18px 5px; transform:rotate(-1.3deg);
  }

  .tiles { display:flex; gap:30px; justify-content:center; }
  .tile {
    width:348px; height:166px; border:4px solid var(--ink); border-radius:16px;
    box-shadow:8px 8px 0 var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .tile b { font-family:'Archivo Black'; font-size:78px; line-height:1; letter-spacing:-2px; }
  .tile span { font-size:21px; font-weight:700; letter-spacing:4px; }
  .t-y { background:var(--yellow); } .t-r { background:var(--red); } .t-p { background:var(--pink); }

  .foot { display:flex; align-items:center; justify-content:space-between; border-top:4px solid var(--ink); padding-top:22px; }
  .foot .l { display:flex; align-items:center; gap:12px; font-family:'Archivo Black'; font-size:26px; }
  .foot .l img { width:30px; height:36px; object-fit:contain; }
  .foot .r { font-size:22px; font-weight:500; color:rgba(17,17,17,.62); letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <img src="file:///home/user/thesmallbook/assets/loader-logo.png" alt="">
        <span class="wm">TheSmallBook</span>
      </div>
      <div class="pill">FREE FOREVER · NO ADS</div>
    </div>
    <div class="hero">
      <div class="kicker"><span class="dots"><i></i><i></i><i></i></span> EVERY BOOK'S LESSONS · NONE OF THE FLUFF <span class="dots"><i></i><i></i><i></i></span></div>
      <h1>READ ANY GREAT BOOK<br>IN <span class="hl">30 SECONDS</span></h1>
    </div>
    <div class="tiles">
      <div class="tile t-y"><b>400</b><span>BOOKS</span></div>
      <div class="tile t-r"><b>2,637</b><span>LESSONS</span></div>
      <div class="tile t-p"><b>308</b><span>AUTOPSIES</span></div>
    </div>
    <div style="height:28px"></div>
    <div class="foot">
      <span class="l"><img src="file:///home/user/thesmallbook/assets/loader-logo.png" alt=""> thesmallbook.in</span>
      <span class="r">big books, small reads</span>
    </div>
  </div>
</body>
</html>
