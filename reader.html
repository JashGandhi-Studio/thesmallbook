  <link rel="stylesheet" href="css/style.css?v=342">

  <style>
    /* Dedicated Quiet Reader Styles */
    .rm-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper, #fffdf5);
      color: var(--ink, #111111);
      transition: background .2s ease, color .2s ease;
      touch-action: pan-y;
    }
    .rm-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--paper, #fffdf5);
      border-bottom: var(--bw) solid var(--edge);
    }
    .rm-header a.rm-back {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      padding: 4px 10px;
      border: var(--bw) solid var(--edge);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--sh-1);
    }
    .rm-header-title {
      flex: 1;
      min-width: 0;
    }
    .rm-header-title h1 {
      font-family: var(--font-head);
      font-size: 1rem;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header-title p {
      font-size: .75rem;
      color: var(--muted, #666);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header button {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .75rem;
      padding: 7px 12px;
      border: var(--bw) solid var(--edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh-1);
      transition: transform .1s;
    }
    .rm-header button:active {
      transform: translate(1px, 1px);
      box-shadow: var(--sh-1);
    }
    .rm-trans-banner {
      display: none;
      position: sticky;
      top: 61px;
      z-index: 95;
      background: #fff3cd;
      color: #664d03;
      border-bottom: var(--bw) solid var(--edge);
      padding: 8px 16px;
      font-size: .82rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rm-trans-banner.active {
      display: flex;
    }
    .rm-trans-banner button {
      border: 1px solid currentColor;
      background: none;
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .rm-app {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 100px;
      box-sizing: border-box;
    }
    .rm-article {
      font-family: var(--rm-font, Newsreader, Georgia, serif);
      font-size: var(--rm-size, 20px);
      line-height: var(--rm-spacing, 1.8);
      color: var(--ink);
    }
    .rm-article h2 {
      font-family: var(--font-head);
      font-size: 1.8rem;
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -.5px;
    }
    .rm-article .rm-meta {
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted, #666);
      margin-bottom: 24px;
    }
    .rm-article p {
      margin: 0 0 20px;
    }
    .rm-callout {
      border-left: var(--bw) solid var(--edge);
      padding: 12px 18px;
      margin: 24px 0;
      background: var(--surface-2, #f6f1e5);
      font-family: var(--font-body);
      font-size: .95rem;
      line-height: 1.6;
    }
    .rm-callout b {
      display: block;
      font-family: var(--font-head);
      font-size: .75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    /* Scroll mode separator */
    .rm-scroll-divider {
      height: 2px;
      background: var(--ink);
      margin: 48px 0;
      opacity: .2;
    }
    .rm-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--paper, #fffdf5);
      border-top: var(--bw) solid var(--edge);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--sh-2);
    }
    .rm-nav-btn {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .82rem;
      padding: 8px 16px;
      border: var(--bw) solid var(--edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh-1);
    }
    .rm-nav-btn.rm-read-btn {
      background: var(--yellow);
      color: #111111;
    }
    .rm-pos {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .8rem;
      color: var(--muted, #666);
    }
    /* Aa Dialog */
    .rm-dialog {
      border: var(--bw) solid var(--edge);
      border-radius: 20px;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--sh-3);
      max-width: 440px;
      width: calc(100vw - 32px);
    }
    .rm-dialog::backdrop {
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(2px);
    }
    .rm-dialog h3 {
      font-family: var(--font-head);
      font-size: 1.2rem;
      margin: 0 0 16px;
    }
    .rm-setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-family: var(--font-body);
      font-size: .88rem;
      font-weight: 700;
    }
    .rm-setting-row select {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .82rem;
      padding: 6px 10px;
      border: var(--bw) solid var(--edge);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
    }
    .rm-close-dialog {
      width: 100%;
      padding: 12px;
      border: var(--bw) solid var(--edge);
      border-radius: 17px;
      background: var(--yellow);
      color: var(--ink);
      font-family: var(--font-head);
      font-size: .9rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: var(--sh-2);
    }
    /* Themes */
    body.rm-theme-sepia {
      --paper: #f4ecd8;
      --surface-2: #ece0c6;
      --ink: #2c251e;
      --muted: #736453;
    }
    body.rm-theme-night {
      --paper: #16130e;
      --surface-2: #241f17;
      --ink: #f2ead8;
      --muted: #9a917d;
    }

    /* Language Bottom Sheet Drawer */
    .rm-lang-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(14, 11, 8, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rm-lang-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .rm-lang-sheet {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--paper, #fffdf5);
      border: var(--bw) solid var(--edge);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      padding: 12px 18px 28px;
      box-sizing: border-box;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 84vh;
      overflow-y: auto;
    }
    .rm-lang-overlay.active .rm-lang-sheet {
      transform: translateY(0);
    }
    body.rm-theme-night .rm-lang-sheet {
      background: #1c1813;
      border-color: #f2ead8;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
      color: #f2ead8;
    }
    .rm-lang-handle {
      width: 42px;
      height: 4.5px;
      background: var(--line, #d4ccba);
      border-radius: 999px;
      margin: 0 auto 12px;
    }
    .rm-lang-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .rm-lang-title {
      font-family: var(--font-head, sans-serif);
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: var(--ink, #111);
      margin: 0 0 4px;
    }
    body.rm-theme-night .rm-lang-title {
      color: #f2ead8;
    }
    .rm-lang-sub {
      font-family: var(--font-body, sans-serif);
      font-size: 0.82rem;
      color: var(--muted, #666);
      margin: 0;
      line-height: 1.35;
    }
    body.rm-theme-night .rm-lang-sub {
      color: #a89a85;
    }
    .rm-lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .rm-lang-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      background: var(--surface-2, #f6f1e5);
      border: var(--bw) solid var(--edge);
      border-radius: 17px;
      box-shadow: var(--sh-2);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
      box-sizing: border-box;
      width: 100%;
    }
    .rm-lang-card:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--sh-2);
    }
    .rm-lang-card:active {
      transform: translate(1px, 1px);
      box-shadow: var(--sh-1);
    }
    .rm-lang-card.active {
      background: var(--yellow, #ffc800);
      border-color: var(--ink, #111);
    }
    body.rm-theme-night .rm-lang-card {
      background: #27211a;
      border-color: #f2ead8;
      box-shadow: var(--sh-2);
    }
    body.rm-theme-night .rm-lang-card.active {
      background: #ffc800;
      color: #111;

    .rm-lang-name {
