  <!-- v390 · EARLY LESSON TEXT REACHES THE READER
       Opening a book used to mean: parse a 1.2 MB catalogue, then ask for the chapter
       text, then paint. On a phone that is seconds of an empty page, and the 2.2 s
       guard used to reload the page instead of waiting, which is how a reader ended up
       on "This lesson did not load". Here the three things a book needs (its title and
       author from a 40 KB index, the chapter text from a 3 KB file) are fetched at the
       same time as the catalogue and painted the moment they arrive. The catalogue then
       arrives and rebuilds the same pages with contents, quotes and the action plan. -->

       cache does not hold, so offline the spine never arrived and the reader
       painted nothing. Ask for the plain address instead when the build is not
       known yet: the worker answers that from its cache. */

       big idea, the real lesson titles and the closing plan. That is everything
       the first paint needs, so it no longer has to start the book in the wrong
       place while the 1.2 MB catalogue is still downloading. */

      try { (window.BOOKS || []).some(function (x) { if (x.id === id) { full = x; return true; } return false; }); } catch (e) {}

         knows one lesson title and no big idea, which is how the first paint
         used to open at lesson one and label the rest "Lesson 2", "Lesson 3".
         Wait for the head instead of showing a book that is not this book. */

       window.TSB_READER, and both used to appear only after the catalogue had
       downloaded. The lesson file and its head are already here, so build the
       whole book from them in the same order reader.js builds it: the Big Idea,
       then every lesson with its example and its action, then the plan and the
       quotes. Same pages, same count, so nothing moves when the reader takes

      if (rt) rt.textContent = "Page " + (i + 1) + " of " + ePages.length;

       #rmPrev do not exist yet, so both returned null and no listener was ever
       attached. Swipe worked (it listens on the window) and the Next button did
       nothing, which on a slow phone is the whole first minute of the book. Bind
       them when the buttons exist, and again after a paint in case the page
       rebuilt them. */

    /* v404: on a tablet or desktop, one reader page opens as two facing

    @media (min-width: 700px) {

        max-width: 1240px;

        perspective: 1800px;
      }

      .rm-article:not(:has(> section)) p,

        0% { transform: rotateY(0deg); filter: brightness(1); }

      /* ======================================================================
       v356 · ONE THEME, EVERY SURFACE
       The reader used to theme the page but not the furniture: in sepia the
       dock went dark-on-dark and the share pill disappeared. These rules are
       the last word, keyed off html[data-rm] which js/reader.js writes.
       ====================================================================== */
    html[data-rm="paper"] {
      --paper: #fffdf5; --surface: #ffffff; --surface-2: #f3ece0;
      --ink: #16130f; --muted: #6e6658; --edge: #16130f; --line: #e6ddca;
      --rm-dock: #ffffff; --rm-dock-ink: #16130f; --rm-pill: #16130f; --rm-pill-ink: #fbf8f1; --rm-accent: #ffc800; --rm-meta: #5b5348;
    }
    html[data-rm="sepia"] {
      --paper: #f4ecd8; --surface: #fbf3e1; --surface-2: #e9dcc0;
      --ink: #2c251e; --muted: #6d5f4e; --edge: #2c251e; --line: #d9c9a8;
      --rm-dock: #fbf3e1; --rm-dock-ink: #2c251e; --rm-pill: #3b2f22; --rm-pill-ink: #f7eedb; --rm-accent: #e0a73e; --rm-meta: #5a4c3a;
    }

  <!-- v385: the lesson text is requested by js/reader.js and the page rebuilds
       when it arrives. The old document.write injection raced the page code and
       lost on slower connections, which is how a book ended up wordless. -->
  <script>/* v389 · THE WORDS ARRIVE WITH THE PAGE, NOT AFTER IT.
     What was here until 388 was actively harmful: 2.2 s after load it called
     location.reload() if the lesson file had not registered yet, and on the second
     pass it printed "This lesson did not load. Check your connection and try again."
     On a phone that is a 1.2 MB restart of the whole app, and when the second try
     was also slow the reader blamed the reader's connection for the app's race.
     Nothing here navigates any more. The lesson file is preloaded in parallel with
     data.js, the page paints what it already has, and if the text is genuinely slow
     the reader says so in one quiet line and re-asks in place. */
  (function () {
    try {
      var id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      var V = window.TSB_BUILD || "";
      var url = "data/lessons/" + encodeURIComponent(id) + ".js" + (V ? "?v=" + V : "");
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "script"; l.href = url;
      document.head.appendChild(l);          /* downloads beside data.js, not behind it */
      window.__TSB_LESSON_URL = url;
    } catch (e) {}
  })();</script>

   The reader still renders, counts and saves exactly as it always has.
   This only watches the page change and plays the leaf over the spread. */
(function () {
  try {
    if (!window.matchMedia || !window.matchMedia("(min-width: 700px)").matches) return;
    var art = document.getElementById("rmArticle");
    if (!art) return;
    var last = null, timer = 0;
    function cur() { try { return window.TSB_READER ? window.TSB_READER.cur : null; } catch (e) { return null; } }
    function mode() { try { return localStorage.getItem("tsb_rm_mode") || "pages"; } catch (e) { return "pages"; } }
    var mo = new MutationObserver(function () {
      var c = cur();
      if (c === null || c === undefined) return;
      if (last === null) { last = c; return; }
      if (c === last) return;
      var dir = c > last ? "next" : "prev";
      last = c;
      if (mode() === "scroll") return;
      art.classList.remove("rm-turn-next", "rm-turn-prev");
      void art.offsetWidth;
      art.classList.add(dir === "next" ? "rm-turn-next" : "rm-turn-prev");
      clearTimeout(timer);
      timer = setTimeout(function () { art.classList.remove("rm-turn-next", "rm-turn-prev"); }, 580);
    });
    mo.observe(art, { childList: true });
  } catch (e) {}
})();
