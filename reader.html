  <style>
    /* Dedicated Quiet Reader Styles */
    .rm-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper, #fffdf5);
      color: var(--ink, #111111);
      transition: background .2s ease, color .2s ease;
      touch-action: pan-y;
    }
    .rm-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--paper, #fffdf5);
      border-bottom: var(--bw) solid var(--edge);
    }
    .rm-header a.rm-back {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      padding: 4px 10px;
      border: var(--bw) solid var(--edge);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--sh-1);
    }
    .rm-header-title {
      flex: 1;
      min-width: 0;
    }
    .rm-header-title h1 {
      font-family: var(--font-head);
      font-size: 1rem;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header-title p {
      font-size: .75rem;
      color: var(--muted, #666);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header button {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .75rem;
      padding: 7px 12px;
      border: var(--bw) solid var(--edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh-1);
      transition: transform .1s;
    }
    .rm-header button:active {
      transform: translate(1px, 1px);
      box-shadow: var(--sh-1);
    }
    .rm-trans-banner {
      display: none;
      position: sticky;
      top: 61px;
      z-index: 95;
      background: #fff3cd;
      color: #664d03;
      border-bottom: var(--bw) solid var(--edge);
      padding: 8px 16px;
      font-size: .82rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rm-trans-banner.active {
      display: flex;
    }
    .rm-trans-banner button {
      border: 1px solid currentColor;
      background: none;
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .rm-app {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 100px;
      box-sizing: border-box;
    }
    .rm-article {
      font-family: var(--rm-font, Newsreader, Georgia, serif);
      font-size: var(--rm-size, 20px);
      line-height: var(--rm-spacing, 1.8);
      color: var(--ink);
    }
    .rm-article h2 {
      font-family: var(--font-head);
      font-size: 1.8rem;
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -.5px;
    }
    .rm-article .rm-meta {
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted, #666);
      margin-bottom: 24px;
    }
    .rm-article p {
      margin: 0 0 20px;
    }
    .rm-callout {
      border-left: var(--bw) solid var(--edge);
      padding: 12px 18px;
      margin: 24px 0;
      background: var(--surface-2, #f6f1e5);
      font-family: var(--font-body);
      font-size: .95rem;
      line-height: 1.6;
    }
    .rm-callout b {
      display: block;
      font-family: var(--font-head);
      font-size: .75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    /* Scroll mode separator */
    .rm-scroll-divider {
      height: 2px;
      background: var(--ink);
      margin: 48px 0;
      opacity: .2;
    }
    .rm-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--paper, #fffdf5);
      border-top: var(--bw) solid var(--edge);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--sh-2);
    }
    .rm-nav-btn {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .82rem;
      padding: 8px 16px;
      border: var(--bw) solid var(--edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh-1);
    }
    .rm-nav-btn.rm-read-btn {
      background: var(--yellow);
      color: #111111;
    }
    .rm-pos {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .8rem;
      color: var(--muted, #666);
    }
    /* Aa Dialog */
    .rm-dialog {
      border: var(--bw) solid var(--edge);
      border-radius: 20px;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--sh-3);
      max-width: 440px;
      width: calc(100vw - 32px);
    }
    .rm-dialog::backdrop {
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(2px);
    }
    .rm-dialog h3 {
      font-family: var(--font-head);
      font-size: 1.2rem;
      margin: 0 0 16px;
    }
    .rm-setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-family: var(--font-body);
      font-size: .88rem;
      font-weight: 700;
    }
    .rm-setting-row select {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .82rem;
      padding: 6px 10px;
      border: var(--bw) solid var(--edge);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
    }
    .rm-close-dialog {
      width: 100%;
      padding: 12px;
      border: var(--bw) solid var(--edge);
      border-radius: 17px;
      background: var(--yellow);
      color: var(--ink);
      font-family: var(--font-head);
      font-size: .9rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: var(--sh-2);
    }
    /* Themes */
    body.rm-theme-sepia {
      --paper: #f4ecd8;
      --surface-2: #ece0c6;
      --ink: #2c251e;
      --muted: #736453;
    }
    body.rm-theme-night {
      --paper: #16130e;
      --surface-2: #241f17;
      --ink: #f2ead8;
      --muted: #9a917d;
    }

    /* Language Bottom Sheet Drawer */
    .rm-lang-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(14, 11, 8, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rm-lang-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .rm-lang-sheet {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--paper, #fffdf5);
      border: var(--bw) solid var(--edge);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      padding: 12px 18px 28px;
      box-sizing: border-box;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 84vh;
      overflow-y: auto;
    }
    .rm-lang-overlay.active .rm-lang-sheet {
      transform: translateY(0);
    }
    body.rm-theme-night .rm-lang-sheet {
      background: #1c1813;
      border-color: #f2ead8;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
      color: #f2ead8;
    }
    .rm-lang-handle {
      width: 42px;
      height: 4.5px;
      background: var(--line, #d4ccba);
      border-radius: 999px;
      margin: 0 auto 12px;
    }
    .rm-lang-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .rm-lang-title {
      font-family: var(--font-head, sans-serif);
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: var(--ink, #111);
      margin: 0 0 4px;
    }
    body.rm-theme-night .rm-lang-title {
      color: #f2ead8;
    }
    .rm-lang-sub {
      font-family: var(--font-body, sans-serif);
      font-size: 0.82rem;
      color: var(--muted, #666);
      margin: 0;
      line-height: 1.35;
    }
    body.rm-theme-night .rm-lang-sub {
      color: #a89a85;
    }
    .rm-lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .rm-lang-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

       v356 · ONE THEME, EVERY SURFACE
       The reader used to theme the page but not the furniture: in sepia the
       dock went dark-on-dark and the share pill disappeared. These rules are
       the last word, keyed off html[data-rm] which js/reader.js writes.
       ====================================================================== */
    html[data-rm="paper"] {
      --paper: #fffdf5; --surface: #ffffff; --surface-2: #f3ece0;
      --ink: #16130f; --muted: #6e6658; --edge: #16130f; --line: #e6ddca;

      --paper: #16130e; --surface: #1f1b16; --surface-2: #241f17;
      --ink: #f2ead8; --muted: #a29884; --edge: #f2ead8; --line: #342d24;

    }
    /* the page itself */
    html[data-rm], html[data-rm] body { background: var(--paper) !important; color: var(--ink) !important; }
    html[data-rm] .rm-top, html[data-rm] header, html[data-rm] .rm-header { background: var(--paper) !important; color: var(--ink) !important; border-color: var(--line) !important; }
    /* v360: the reading column is the page, not a card on it */
    html[data-rm] .rm-article, html[data-rm] .rm-text, html[data-rm] article,
    html[data-rm] .lesson { background: transparent !important; color: var(--ink) !important; }
    html[data-rm] .rm-sheet, html[data-rm] .rm-lang-sheet, html[data-rm] .rm-card { background: var(--surface) !important; color: var(--ink) !important; }

    html[data-rm] .rm-meta, html[data-rm] small, html[data-rm] .rm-sub { color: var(--muted) !important }
    /* v359: the article and everything the paywall card puts inside it */
    html[data-rm] #rmArticle, html[data-rm] #rmArticle p, html[data-rm] #rmArticle h2,
    html[data-rm] #rmArticle strong, html[data-rm] #rmArticle b, html[data-rm] #rmArticle li,
    html[data-rm] #rmArticle span:not([class*=btn]), html[data-rm] #rmArticle div.rm-callout { color: var(--ink) !important }
    html[data-rm] #rmArticle .rm-callout { background: var(--surface-2) !important; border-left-color: var(--edge) !important }
    html[data-rm] #rmArticle a, html[data-rm] #rmArticle a.btn { color: var(--ink) !important }
    html[data-rm] #rmArticle a.btn--yellow { background: var(--rm-accent) !important; color: #16130f !important; border-color: var(--rm-accent) !important }
    html[data-rm] .rm-meta { color: var(--rm-meta, var(--muted)) !important; opacity: 1 !important }
    /* the floating dock, which is where the theme used to give up */
    html[data-rm] .frd-dock button,
    html[data-rm] .frd-dock .frd-prev,
    html[data-rm] .frd-dock .frd-listen,
    html[data-rm] .frd-dock .frd-next,
    html[data-rm] .frd-share {
      background: var(--rm-dock) !important; border-color: var(--line) !important; color: var(--rm-dock-ink) !important;
    }
    html[data-rm] .frd-share { background: var(--rm-pill) !important; color: var(--rm-pill-ink) !important; border-color: var(--rm-pill) !important }
    html[data-rm] .frd-share svg, html[data-rm] .frd-share span { color: inherit !important; fill: currentColor }
    html[data-rm] .frd-next__ic { background: var(--rm-accent) !important; color: #16130f !important }
    html[data-rm] .frd-next.is-fin { background: var(--rm-accent) !important; border-color: var(--rm-accent) !important; color: #16130f !important }
    html[data-rm] .frd-next.is-fin .frd-next__ic { background: #16130f !important; color: var(--rm-accent) !important }
    /* chips, pills and the tools panel */
    html[data-rm] .rm-header button, html[data-rm] .rm-top button, html[data-rm] .k-lang, html[data-rm] .k-lang button {
      background: var(--surface) !important; color: var(--ink) !important; border-color: var(--line) !important;

    html[data-rm] .rm-select, html[data-rm] .rm-slider { background: var(--paper) !important; color: var(--ink) !important; border-color: var(--line) !important }
    html[data-rm] .rm-theme-swatch { background: var(--surface) !important; border-color: var(--line) !important; color: var(--ink) !important }

    /* every piece of floating chrome, so nothing is left in the app palette */

  <script>/* v336: this book's lesson text, in order, before the page code */(function(){try{var id=new URLSearchParams(location.search).get("id");if(id&&/^[a-z0-9-]+$/.test(id)&&window.TSB_LESSONS&&!TSB_LESSONS.ready(id))document.write('<script src="data/lessons/'+id+'.js?v='+TSB_LESSONS.version+'"><\/script>')}catch(e){}})();</script>
  <script>/* v347.2 · THE READER NEVER SITS ON AN EMPTY PAGE
     The lesson text is injected above during parse. If data.js had not run yet,
     or the request was lost on a slow connection, the reader used to show its
     skeleton for ever and read as "this book has no lessons". Now it checks once
     per page: if the text is not there it asks for it properly and, only if that
     also fails, reloads once (never twice) so the reader always ends up with
     either the lesson or an honest card. */
  (function () {
    function guard() {
      setTimeout(function () {
        try {
          var id = new URLSearchParams(location.search).get("id");
          if (!id) return;
          var L = window.TSB_LESSONS;
          var K = "tsb_reader_retry_" + id;
          var tried = 0; try { tried = +(sessionStorage.getItem(K) || 0); } catch (e) {}
          if (L && L.ready && L.ready(id)) { try { sessionStorage.removeItem(K); } catch (e) {} return; }
          if (tried >= 1) {
            /* second attempt failed too: say so instead of spinning */
            var d = document.querySelector(".frd-page, .frd, #frdPage, main") || document.body;
            var n = document.createElement("div");
            n.setAttribute("style", "margin:26px auto;max-width:34rem;padding:18px 20px;border-radius:16px;border:1px solid #E3D8C2;background:#FBF8F1;font:500 14px system-ui;color:#16130F;text-align:center");
            n.innerHTML = "This lesson did not load. Check your connection and " +
              '<a href="reader.html?id=' + encodeURIComponent(id) + '" style="color:#C03A24;font-weight:700">try again</a>.';
            if (d && d.appendChild) d.appendChild(n);
            return;
          }
          try { sessionStorage.setItem(K, "1"); } catch (e) {}
          setTimeout(function () { location.reload(); }, 90);
        } catch (e) {}
      }, 2200);
    }
    if (document.readyState === "complete") guard();
    else window.addEventListener("load", guard);
  })();</script>
