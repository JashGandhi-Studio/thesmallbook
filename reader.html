<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Reader | TheSmallBook</title>
  <meta name="description" content="Distraction-free book reader for TheSmallBook.">
  <meta property="og:title" content="Reader | TheSmallBook">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=323">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <style>
    /* Dedicated Quiet Reader Styles */
    .rm-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper, #fffdf5);
      color: var(--ink, #111111);
      transition: background .2s ease, color .2s ease;
      touch-action: pan-y;
    }
    .rm-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--paper, #fffdf5);
      border-bottom: 2px solid var(--ink, #111);
    }
    .rm-header a.rm-back {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      padding: 4px 10px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .rm-header-title {
      flex: 1;
      min-width: 0;
    }
    .rm-header-title h1 {
      font-family: var(--font-head);
      font-size: 1rem;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header-title p {
      font-size: .75rem;
      color: var(--muted, #666);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header button {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .75rem;
      padding: 7px 12px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform .1s;
    }
    .rm-header button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .rm-trans-banner {
      display: none;
      position: sticky;
      top: 61px;
      z-index: 95;
      background: #fff3cd;
      color: #664d03;
      border-bottom: 2px solid var(--ink);
      padding: 8px 16px;
      font-size: .82rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rm-trans-banner.active {
      display: flex;
    }
    .rm-trans-banner button {
      border: 1px solid currentColor;
      background: none;
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .rm-app {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 100px;
      box-sizing: border-box;
    }
    .rm-article {
      font-family: var(--rm-font, 'Newsreader', Georgia, serif);
      font-size: var(--rm-size, 20px);
      line-height: var(--rm-spacing, 1.8);
      color: var(--ink);
    }
    .rm-article h2 {
      font-family: var(--font-head);
      font-size: 1.8rem;
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -.5px;
    }
    .rm-article .rm-meta {
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted, #666);
      margin-bottom: 24px;
    }
    .rm-article p {
      margin: 0 0 20px;
    }
    .rm-callout {
      border-left: 4px solid var(--ink);
      padding: 12px 18px;
      margin: 24px 0;
      background: var(--surface-2, #f6f1e5);
      font-family: var(--font-body);
      font-size: .95rem;
      line-height: 1.6;
    }
    .rm-callout b {
      display: block;
      font-family: var(--font-head);
      font-size: .75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    /* Scroll mode separator */
    .rm-scroll-divider {
      height: 2px;
      background: var(--ink);
      margin: 48px 0;
      opacity: .2;
    }
    .rm-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--paper, #fffdf5);
      border-top: 2px solid var(--ink);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 -4px 0 rgba(0,0,0,.05);
    }
    .rm-nav-btn {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .82rem;
      padding: 8px 16px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .rm-nav-btn.rm-read-btn {
      background: var(--yellow);
      color: #111111;
    }
    .rm-pos {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .8rem;
      color: var(--muted, #666);
    }
    /* Aa Dialog */
    .rm-dialog {
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      max-width: 440px;
      width: calc(100vw - 32px);
    }
    .rm-dialog::backdrop {
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(2px);
    }
    .rm-dialog h3 {
      font-family: var(--font-head);
      font-size: 1.2rem;
      margin: 0 0 16px;
    }
    .rm-setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-family: var(--font-body);
      font-size: .88rem;
      font-weight: 700;
    }
    .rm-setting-row select {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .82rem;
      padding: 6px 10px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    .rm-close-dialog {
      width: 100%;
      padding: 12px;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      background: var(--yellow);
      color: var(--ink);
      font-family: var(--font-head);
      font-size: .9rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 3px 3px 0 var(--ink);
    }
    /* Themes */
    body.rm-theme-sepia {
      --paper: #f4ecd8;
      --surface-2: #ece0c6;
      --ink: #2c251e;
      --muted: #736453;
    }
    body.rm-theme-night {
      --paper: #16130e;
      --surface-2: #241f17;
      --ink: #f2ead8;
      --muted: #9a917d;
    }
  </style>
</head>
<body class="rm-page">
  <header class="rm-header" translate="no">
    <a id="rmBack" class="rm-back" href="index.html" aria-label="Back to overview">←</a>
    <div class="rm-header-title">
      <h1 id="rmTitle">Reader</h1>
      <p id="rmAuthor">by Author</p>
    </div>
    <button id="rmLanguage" type="button" aria-label="Language">🌐 Translate</button>
    <button id="rmTools" type="button" aria-haspopup="dialog">Aa · Contents</button>
  </header>

  <div id="rmTransError" class="rm-trans-banner" role="alert">
    <span>⚠️ Translation service unavailable offline. Showing English text.</span>
    <button type="button" id="rmTransDismiss">Dismiss</button>
  </div>

  <main class="rm-app" id="rmApp">
    <article class="rm-article" id="rmArticle"></article>
  </main>

  <footer class="rm-footer" translate="no">
    <button id="rmPrev" class="rm-nav-btn" aria-label="Previous page">← Prev</button>
    <span id="rmPos" class="rm-pos" role="status" aria-live="polite">Page 1 of 1</span>
    <button id="rmRead" class="rm-nav-btn rm-read-btn">✓ Mark Read</button>
    <button id="rmNext" class="rm-nav-btn" aria-label="Next page">Next →</button>
  </footer>

  <!-- Aa · Contents Dialog -->
  <dialog id="rmDialog" class="rm-dialog" aria-labelledby="rmDialogTitle">
    <h3 id="rmDialogTitle">Reading Controls</h3>
    <div class="rm-setting-row">
      <span>Jump to Section:</span>
      <select id="rmContentsSelect"></select>
    </div>
    <div class="rm-setting-row">
      <span>Reading Mode:</span>
      <select id="rmModeSelect">
        <option value="pages" selected>Page-by-page</option>
        <option value="scroll">Continuous scroll</option>
      </select>
    </div>
    <div class="rm-setting-row">
      <span>Text Size:</span>
      <select id="rmSizeSelect">
        <option value="17px">Small (17px)</option>
        <option value="20px" selected>Medium (20px)</option>
        <option value="24px">Large (24px)</option>
        <option value="28px">Extra Large (28px)</option>
      </select>
    </div>
    <div class="rm-setting-row">
      <span>Typography:</span>
      <select id="rmFontSelect">
        <option value="'Newsreader', Georgia, serif" selected>Book Serif</option>
        <option value="'Space Grotesk', sans-serif">Clean Sans</option>
      </select>
    </div>
    <div class="rm-setting-row">
      <span>Line Spacing:</span>
      <select id="rmSpacingSelect">
        <option value="1.55">Compact (1.55)</option>
        <option value="1.8" selected>Comfortable (1.8)</option>
        <option value="2.1">Spacious (2.1)</option>
      </select>
    </div>
    <div class="rm-setting-row">
      <span>Color Theme:</span>
      <select id="rmThemeSelect">
        <option value="auto">Auto (Match System)</option>
        <option value="paper">Paper (Warm Light)</option>
        <option value="sepia">Sepia (Eye Comfort)</option>
        <option value="night">Night (Deep Dark)</option>
      </select>
    </div>
    <button id="rmCloseDialog" class="rm-close-dialog" type="button">Done</button>
  </dialog>

  <script src="js/bootguard.js?v=323"></script>
  <script src="js/prefs.js?v=323"></script>
  <script src="js/config.js?v=323"></script>
  <script src="js/data.js?v=323"></script>
  <script src="js/lang.js?v=323"></script>
  <script src="js/reader.js?v=328"></script>
</body>
</html>
