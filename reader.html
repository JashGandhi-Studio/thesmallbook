  <!-- v390 · EARLY LESSON TEXT REACHES THE READER
       Opening a book used to mean: parse a 1.2 MB catalogue, then ask for the chapter
       text, then paint. On a phone that is seconds of an empty page, and the 2.2 s
       guard used to reload the page instead of waiting, which is how a reader ended up
       on "This lesson did not load". Here the three things a book needs (its title and
       author from a 40 KB index, the chapter text from a 3 KB file) are fetched at the
       same time as the catalogue and painted the moment they arrive. The catalogue then
       arrives and rebuilds the same pages with contents, quotes and the action plan. -->

    function esc2(x) { return String(x == null ? "" : x); }
    function paint() {
      if (painted) return;
      var one = window.__TSB_ONE, S = window.BOOKS_SPINE;
      var art = document.getElementById("rmArticle");
      if (!one || !S || !art || !one.body || !one.body.length) return;
      var b = null;
      for (var i = 0; i < S.length; i++) { if (S[i].i === id) { b = S[i]; break; } }

  <style>
    /* Dedicated Quiet Reader Styles */
    .rm-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper, #fffdf5);
      color: var(--ink, #111111);
      transition: background .2s ease, color .2s ease;
      touch-action: pan-y;
    }
    .rm-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--paper, #fffdf5);
      border-bottom: var(--bw) solid var(--edge);
    }
    .rm-header a.rm-back {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      padding: 4px 10px;
      border: var(--bw) solid var(--edge);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--sh-1);
    }
    .rm-header-title {
      flex: 1;
      min-width: 0;
    }
    .rm-header-title h1 {
      font-family: var(--font-head);
      font-size: 1rem;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header-title p {
      font-size: .75rem;
      color: var(--muted, #666);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-header button {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: .75rem;
      padding: 7px 12px;
      border: var(--bw) solid var(--edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--sh-1);
      transition: transform .1s;
    }
    .rm-header button:active {
      transform: translate(1px, 1px);
      box-shadow: var(--sh-1);
    }

      display: none;

    }

      padding: 2px 8px;
      border-radius: 6px;

      background: var(--paper);
      color: var(--ink);

      width: 100%;
      padding: 12px;

    body.rm-theme-sepia {

      --surface-2: #ece0c6;
      --ink: #2c251e;
      --muted: #736453;
    }
    body.rm-theme-night {
      --paper: #16130e;

      --ink: #f2ead8;

    .rm-lang-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(14, 11, 8, 0.65);

      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);

      opacity: 1;
      pointer-events: auto;

      position: relative;
      width: 100%;

      /* ======================================================================
       v356 · ONE THEME, EVERY SURFACE
       The reader used to theme the page but not the furniture: in sepia the
       dock went dark-on-dark and the share pill disappeared. These rules are
       the last word, keyed off html[data-rm] which js/reader.js writes.
       ====================================================================== */

      --paper: #fffdf5; --surface: #ffffff; --surface-2: #f3ece0;
      --ink: #16130f; --muted: #6e6658; --edge: #16130f; --line: #e6ddca;

      --paper: #16130e; --surface: #1f1b16; --surface-2: #241f17;

    html[data-rm], html[data-rm] body { background: var(--paper) !important; color: var(--ink) !important; }
    html[data-rm] .rm-top, html[data-rm] header, html[data-rm] .rm-header { background: var(--paper) !important; color: var(--ink) !important; border-color: var(--line) !important; }
    /* v360: the reading column is the page, not a card on it */
    html[data-rm] .rm-article, html[data-rm] .rm-text, html[data-rm] article,
    html[data-rm] .lesson { background: transparent !important; color: var(--ink) !important; }
    html[data-rm] .rm-sheet, html[data-rm] .rm-lang-sheet, html[data-rm] .rm-card { background: var(--surface) !important; color: var(--ink) !important; }

    html[data-rm] #rmArticle, html[data-rm] #rmArticle p, html[data-rm] #rmArticle h2,
    html[data-rm] #rmArticle strong, html[data-rm] #rmArticle b, html[data-rm] #rmArticle li,

    html[data-rm] #rmArticle a, html[data-rm] #rmArticle a.btn { color: var(--ink) !important }
    html[data-rm] #rmArticle a.btn--yellow { background: var(--rm-accent) !important; color: #16130f !important; border-color: var(--rm-accent) !important }
    html[data-rm] .rm-meta { color: var(--rm-meta, var(--muted)) !important; opacity: 1 !important }
    /* the floating dock, which is where the theme used to give up */
    html[data-rm] .frd-dock button,
    html[data-rm] .frd-dock .frd-prev,
    html[data-rm] .frd-dock .frd-listen,
    html[data-rm] .frd-dock .frd-next,

    }
    html[data-rm] .frd-share { background: var(--rm-pill) !important; color: var(--rm-pill-ink) !important; border-color: var(--rm-pill) !important }
    /* v364: the pill and the dock are hard set in every theme, never inherited */
    html[data-rm] .frd-share, html[data-rm] .frd-share * { color: var(--rm-pill-ink) !important; fill: currentColor !important }
    html[data-rm] .frd-share { box-shadow: 0 12px 26px -14px rgba(22,19,15,.5) }

      background: var(--surface) !important; color: var(--ink) !important; border-color: var(--line) !important;

    html[data-rm] .rm-theme-swatch { background: var(--surface) !important; border-color: var(--line) !important; color: var(--ink) !important }

  <!-- v385: the lesson text is requested by js/reader.js and the page rebuilds
       when it arrives. The old document.write injection raced the page code and
       lost on slower connections, which is how a book ended up wordless. -->
  <script>/* v389 · THE WORDS ARRIVE WITH THE PAGE, NOT AFTER IT.
     What was here until 388 was actively harmful: 2.2 s after load it called
     location.reload() if the lesson file had not registered yet, and on the second
     pass it printed "This lesson did not load. Check your connection and try again."
     On a phone that is a 1.2 MB restart of the whole app, and when the second try
     was also slow the reader blamed the reader's connection for the app's race.
     Nothing here navigates any more. The lesson file is preloaded in parallel with
     data.js, the page paints what it already has, and if the text is genuinely slow
     the reader says so in one quiet line and re-asks in place. */
  (function () {
    try {
      var id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      var V = (window.TSB_BUILD || "388");
      var url = "data/lessons/" + encodeURIComponent(id) + ".js?v=" + V;
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "script"; l.href = url;
      document.head.appendChild(l);          /* downloads beside data.js, not behind it */
      window.__TSB_LESSON_URL = url;
    } catch (e) {}
  })();</script>
