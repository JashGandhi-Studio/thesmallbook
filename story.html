<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Story — TheSmallBook Community</title>
  <meta name="description" content="A reader story from TheSmallBook community — read, listen, like and comment.">
  <meta property="og:site_name" content="TheSmallBook">
  <meta property="og:type" content="article">
  <meta property="og:title" content="A reader story — TheSmallBook">
  <meta property="og:description" content="A reader story from TheSmallBook community — read, listen, like and comment.">
  <meta property="og:image" content="https://thesmallbook.in/assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=221">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="cmpage">
  <main class="cm-post" id="post">
    <article class="cm-card cm-card--skel"><div class="cm-sk cm-sk--cover"></div>
      <div class="cm-card__body"><div class="cm-sk cm-sk--line w60"></div><div class="cm-sk cm-sk--line w90"></div><div class="cm-sk cm-sk--line w40"></div></div>
    </article>
  </main>

  <script src="js/prefs.js?v=221"></script>
  <script src="js/lang.js?v=221"></script>
  <script src="js/config.js?v=221"></script>
  <script src="js/auth.js?v=221"></script>
  <script src="js/sounds.js?v=221"></script>
  <script src="js/community.js?v=221"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var root = document.getElementById("post");
    var id = (location.search.match(/[?&]id=([^&]+)/) || [])[1] || "";
    var shortCode = (location.search.match(/[?&]s=([a-zA-Z0-9]+)/) || [])[1] || "";
    var meId = (C.me() || {}).id || "";

    async function boot() {
      if ((!id && !shortCode) || !C.enabled) { root.innerHTML = '<div class="cm-empty">⚠️ Story not reachable.</div>'; return; }
      var p;
      try { p = id ? await C.getPost(id) : await C.getPostByShort(shortCode); } catch (e) {}
      if (p) id = p.id;
      if (!p) {
        root.innerHTML = '<div class="cm-empty" style="padding:48px 20px;text-align:center;">🕳️ This story is gone.<br><br>' +
          '<small>It was deleted by its author — likes, comments and notifications for it are cleared too.</small><br><br>' +
          '<a class="cm-write" href="stories.html">← Back to the stories feed</a></div>';
        setTimeout(function () { try { location.href = "stories.html"; } catch (e) {} }, 4000);
        return;
      }
      document.title = p.title + " — TheSmallBook Stories";
      var prof = null;
      try { prof = await C.getProfile(p.author_id); } catch (e) {}
      prof = prof || { name: p.author_name, avatar_url: C.avaUrl(p.author_name, p.author_avatar, p.author_id), bio: "" };
      if (prof && !prof.avatar_url) prof.avatar_url = C.avaUrl(p.author_name, p.author_avatar, p.author_id);
      try {
        if (window.TSB && TSB.interest) {
          (p.tags || []).forEach(function (t) { TSB.interest.ping(t); });
        }
      } catch (e) {}
      var like = { count: 0, mine: false }, fol = { count: 0, mine: false }, cmts = [];
      try { like = await C.likeInfo(id); } catch (e) {}
      try { fol = await C.followInfo(p.author_id); } catch (e) {}
      try { cmts = await C.listComments(id); } catch (e) {}

      root.innerHTML =
        '<article class="cm-postcard"' + (p.no_download === false ? ' data-free="1"' : "") + ">" +
          (p.cover_url ? (C.isVideoUrl(p.cover_url)
            ? '<video class="cm-postcard__cover" src="' + C.esc(p.cover_url) + '" playsinline preload="metadata"></video>'
            : '<img class="cm-postcard__cover" src="' + C.esc(p.cover_url) + '" alt="">') : "") +
          '<div class="cm-postcard__head">' +
            '<a class="cm-ava cm-ava--lg" href="profile.html?id=' + p.author_id + '">' +
              (prof.avatar_url ? '<img src="' + C.esc(prof.avatar_url) + '" alt="">' : '<span>' + C.esc((p.author_name || "R").charAt(0).toUpperCase()) + "</span>") + "</a>" +
            '<div class="cm-postcard__who"><a class="cm-name" href="profile.html?id=' + p.author_id + '">' + C.esc(p.author_name) + (C.isOfficial(p.author_id) ? '<span class="cm-vtick" title="Official channel">✔</span>' : "") + "</a>" +
              '<span class="cm-time">' + C.ago(p.created_at) + " · " + C.readMins(p.body) + " min read</span></div>" +
            (p.author_id !== meId ? '<button class="cm-follow' + (fol.mine ? " on" : "") + '" data-follow="' + p.author_id + '">' + (fol.mine ? "✓ Following" : "+ Follow") + "</button>" : "") +
          "</div>" +
          "<h1>" + C.esc(p.title) + "</h1>" +
          (p.subtitle ? '<p class="cm-postcard__sub">' + C.esc(p.subtitle) + "</p>" : "") +
          (p.audio_url ? '<button class="cm-listenbig" data-audio="' + C.esc(p.audio_url) + '" data-title="' + C.esc(p.title) + '">' + C.icon('phone') + " Listen to the voice version</button>" : "") +
          '<div class="cm-rich">' + C.sanitize(p.body) + "</div>" +
          (p.tags && p.tags.length ? '<div class="cm-card__tags">' + p.tags.map(function (t) { return "<span># " + C.esc(t) + "</span>"; }).join("") + "</div>" : "") +
          '<div class="cm-bigacts">' +
            '<button class="cm-bigact cm-blike' + (like.mine ? " on" : "") + '" data-like="' + p.id + '"><span class="cm-bigact__ico">♥</span><b>' + like.count + " like" + (like.count === 1 ? "" : "s") + "</b></button>" +
            '<a class="cm-bigact" href="#comments"><span class="cm-bigact__ico">' + C.icon('chat') + '</span><b>' + cmts.length + " comment" + (cmts.length === 1 ? "" : "s") + "</b></a>" +
            '<button class="cm-bigact" id="shareBtn"><span class="cm-bigact__ico">🔗</span><b>Share</b></button>' +
            (p.author_id === meId ? '<button class="cm-bigact cm-del" data-del="' + p.id + '"><span class="cm-bigact__ico">' + C.icon('trash') + '</span><b>Delete</b></button>' : "") +
          "</div>" +
        "</article>" +
        '<section class="cm-comments" id="comments">' +
          "<h2>" + C.icon('chat') + " " + cmts.length + " comment" + (cmts.length === 1 ? "" : "s") + "</h2>" +
          '<div id="cmtList">' + (cmts.length ? cmts.map(cm).join("") : '<p class="cm-empty cm-empty--sm">Be the first to say something kind.</p>') + "</div>" +
          (meId
            ? '<div class="cm-cmtrow"><input id="cmtInput" class="setinput" maxlength="280" placeholder="Add a comment…"><button class="cm-pub cm-pub--sm" id="cmtSend">Send</button></div>'
            : '<a class="cm-write" href="login.html">Sign in to comment →</a>') +
        "</section>";
      try { C.protectMedia(root); } catch (e) {}

      function cm(c) {
        var pid2 = c.author_id || "";
        var initial = C.esc((c.author_name || "R").charAt(0).toUpperCase());
        return '<div class="cm-cmt cm-cmt--v2">' +
          '<a class="cm-ava" href="profile.html?id=' + pid2 + '"><span>' + initial + "</span></a>" +
          "<div>" +
            '<b><a class="cm-cmtname" href="profile.html?id=' + pid2 + '">' + C.esc(c.author_name) + "</a></b>" +
            '<span class="cm-time">' + C.ago(c.created_at) + "</span>" +
            "<p>" + C.esc(c.body) + "</p>" +
          "</div>" +
        "</div>";
      }

      var likeBtn = root.querySelector("[data-like]");
      function paintLike(info) {
        likeBtn.classList.toggle("on", info.mine);
        likeBtn.querySelector("b").textContent = info.count + " like" + (info.count === 1 ? "" : "s");
      }
      function popLike() {
        likeBtn.classList.remove("pop");
        void likeBtn.offsetWidth;
        likeBtn.classList.add("pop");
      }
      likeBtn.addEventListener("click", async function () {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !likeBtn.classList.contains("on");
        likeBtn.classList.toggle("on", on);
        if (on) popLike();
        try {
          await C.setLike(id, on);
          paintLike(await C.likeInfo(id));
        } catch (e) {
          likeBtn.classList.toggle("on", !on);
          alert("Like failed — " + (e && e.message ? e.message : e));
        }
      });
      /* Instagram-style double-tap ♥ anywhere on the story */
      root.addEventListener("dblclick", async function (e) {
        if (e.target.closest("a, button, input, .cm-comments")) return;
        var h = document.createElement("div");
        h.className = "cm-bigheart"; h.textContent = "♥";
        root.appendChild(h);
        setTimeout(function () { h.remove(); }, 950);
        if (likeBtn.classList.contains("on")) return;
        likeBtn.classList.add("on"); popLike();
        try {
          await C.setLike(id, true);
          paintLike(await C.likeInfo(id));
        } catch (err) {}
      });
      var fb = root.querySelector("[data-follow]");
      if (fb) fb.addEventListener("click", async function () {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !this.classList.contains("on");
        try {
          await C.setFollow(p.author_id, on);
          var f = await C.followInfo(p.author_id);
          this.classList.toggle("on", f.mine);
          this.textContent = f.mine ? "✓ Following" : "+ Follow";
        } catch (e) { this.classList.toggle("on", !on); alert("Follow failed — " + (e && e.message ? e.message : e)); }
      });
      var lb = root.querySelector("[data-audio]");
      if (lb) lb.addEventListener("click", function () { C.playAudio(lb.getAttribute("data-audio"), lb.getAttribute("data-title")); });
      var db = root.querySelector("[data-del]");
      if (db) db.addEventListener("click", async function () {
        if (!confirm("Delete this story for everyone?")) return;
        try { await C.deletePost(id); location.href = "stories.html"; }
        catch (e) { alert(e && e.message ? ("Delete failed — " + e.message) : "Delete failed — are you the author?"); }
      });
      document.getElementById("shareBtn").addEventListener("click", function () {
        var url = location.origin + location.pathname + "?s=" + String(p.id).replace(/-/g, "").slice(-8);
        var self = this;
        if (navigator.share) navigator.share({ title: p.title + " — TheSmallBook", url: url }).catch(function () {});
        else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).catch(function () {});
          self.textContent = "✓ Link copied";
          setTimeout(function () { self.textContent = "🔗 Share"; }, 1600);
        }
      });
      var send = document.getElementById("cmtSend");
      if (send) send.addEventListener("click", async function () {
        var inp = document.getElementById("cmtInput");
        var v = inp.value.trim();
        if (!v) return;
        try {
          var c = await C.addComment(id, v);
          inp.value = "";
          try {
            var list = document.getElementById("cmtList");
            var empty = list.querySelector(".cm-empty");
            if (empty) empty.remove();
            if (c) {
              list.insertAdjacentHTML("beforeend", cm(c));
            } else {
              // row not returned — refetch so the comment still shows; it is NOT a failure
              var cs2 = await C.listComments(id);
              list.innerHTML = cs2.map(cm).join("");
            }
          } catch (renderErr) {}
        } catch (e) { alert("Comment failed — " + (e && e.message ? e.message : "sign in again.")); }
      });
    }
    boot();
  })();
  </script>
  <script src="js/bar.js?v=221" defer></script>
  <script src="js/gate.js?v=221" defer></script>
</body>
</html>
