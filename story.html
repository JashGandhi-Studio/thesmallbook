<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Story — TheSmallBook Community</title>
  <meta name="description" content="A reader story from TheSmallBook community — read, listen, like and comment.">
  <meta property="og:site_name" content="TheSmallBook">
  <meta property="og:type" content="article">
  <meta property="og:title" content="A reader story — TheSmallBook">
  <meta property="og:description" content="A reader story from TheSmallBook community — read, listen, like and comment.">
  <meta property="og:image" content="https://thesmallbook.in/assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=266">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="cmpage">
  <h1 class="sr-only">Story — TheSmallBook</h1>
  <main class="cm-post" id="post">
    <article class="cm-card cm-card--skel"><div class="cm-sk cm-sk--cover"></div>
      <div class="cm-card__body"><div class="cm-sk cm-sk--line w60"></div><div class="cm-sk cm-sk--line w90"></div><div class="cm-sk cm-sk--line w40"></div></div>
    </article>
  </main>

  <script src="js/prefs.js?v=266"></script>
  <script src="js/lang.js?v=266"></script>
  <script src="js/config.js?v=266"></script>
  <script src="js/auth.js?v=266"></script>
  <script src="js/sounds.js?v=266"></script>
  <script src="js/founder.js?v=266"></script>
  <script src="js/community.js?v=266"></script>
  <script src="js/stories-seed.js?v=266"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var root = document.getElementById("post");
    var id = (location.search.match(/[?&]id=([^&]+)/) || [])[1] || "";
    var shortCode = (location.search.match(/[?&]s=([a-zA-Z0-9]+)/) || [])[1] || "";
    var meId = (C.me() || {}).id || "";

    /* a seed story, dressed as a post so every renderer below just works */
    function shelfPost(s) {
      var book = "";
      try { var b = (window.BOOKS || []).filter(function (x) { return x.id === s.bookId; })[0]; if (b) book = b.title; } catch (e) {}
      return {
        id: s.id,
        title: s.title,
        author_id: (window.TSB_COMMUNITY && TSB_COMMUNITY.OFFICIAL_ID) || "tsb-library",
        author_name: s.author || "TheSmallBook",
        author_avatar: "",
        body: s.text || "",
        subtitle: book ? "From the library · inspired by " + book : "From the library",
        cover_url: s.cover || "",
        audio_url: "",
        kind: "story",
        no_download: true,
        created_at: s.date ? new Date(s.date + "T09:00:00Z").toISOString() : new Date().toISOString(),
        tags: book ? [book] : [],
        _lib: true
      };
    }
    var LIB = { id: (window.TSB_COMMUNITY && TSB_COMMUNITY.OFFICIAL_ID) || "tsb-library",
                name: "TheSmallBook", avatar_url: "assets/loader-logo.png", bio: "The library's own channel — one true story from a book on your shelf, most weeks." };

    async function boot() {
      if ((!id && !shortCode) || !C.enabled) { root.innerHTML = '<div class="cm-empty">⚠️ Story not reachable.</div>'; return; }
      var p;
      try { p = id ? await C.getPost(id) : await C.getPostByShort(shortCode); } catch (e) {}
      /* v252: library stories ship with the app, so they are not rows in the
         database — a link like story.html?id=seed-16 has to find them in the
         shelf itself, or the link the Stories page just offered you dead-ends. */
      if (!p) {
        try {
          var shelf = (window.COMMUNITY_STORIES || []).concat(window.SEED_STORIES || []);
          for (var si = 0; si < shelf.length; si++) {
            if (shelf[si].id === id) { p = shelfPost(shelf[si]); break; }
          }
        } catch (e) {}
      }
      if (p) id = p.id;
      /* v250: opening the story IS reading the notification. "Someone liked /
         commented on your story" is written into the shared read ledger here,
         so it can never come back as new in the bell or the history list. */
      if (id) { try { C.notifMarkPost(id); } catch (e) {} }
      if (!p) {
        root.innerHTML = '<div class="cm-empty" style="padding:48px 20px;text-align:center;">🕳️ This story is gone.<br><br>' +
          '<small>It was deleted by its author — likes, comments and notifications for it are cleared too.</small><br><br>' +
          '<a class="cm-write" href="stories.html">← Back to the stories feed</a></div>';
        setTimeout(function () { try { location.href = "stories.html"; } catch (e) {} }, 4000);
        return;
      }
      document.title = p.title + " — TheSmallBook Stories";
      var prof = null;
      if (!p._lib) { try { prof = await C.getProfile(p.author_id); } catch (e) {} }
      prof = prof || (p._lib ? LIB : { name: p.author_name, avatar_url: C.avaUrl(p.author_name, p.author_avatar, p.author_id), bio: "" });
      if (prof && !prof.avatar_url) prof.avatar_url = C.avaUrl(p.author_name, p.author_avatar, p.author_id);
      try {
        if (window.TSB && TSB.interest) {
          (p.tags || []).forEach(function (t) { TSB.interest.ping(t); });
        }
      } catch (e) {}
      var like = { count: 0, mine: false }, fol = { count: 0, mine: false }, cmts = [];
      try { like = await C.likeInfo(id); } catch (e) {}
      try { fol = await C.followInfo(p.author_id); } catch (e) {}
      try { cmts = await C.listComments(id); } catch (e) {}

      root.innerHTML =
        '<article class="cm-postcard"' + (p.no_download === false ? ' data-free="1"' : "") + ">" +
          (p.cover_url ? (C.isVideoUrl(p.cover_url)
            ? '<video class="cm-postcard__cover" src="' + C.esc(p.cover_url) + '" playsinline preload="metadata"></video>'
            : '<img class="cm-postcard__cover" src="' + C.esc(p.cover_url) + '" alt="">') : "") +
          '<div class="cm-postcard__head">' +
            '<a class="cm-ava cm-ava--lg' + (p._lib ? " cm-ava--lib" : "") + '" href="profile.html?id=' + (p._lib ? (window.TSB_COMMUNITY && TSB_COMMUNITY.OFFICIAL_ID || "tsb-library") : p.author_id) + '">' +
              (prof.avatar_url ? '<img src="' + C.esc(prof.avatar_url) + '" alt="">' : '<span>' + C.esc((p.author_name || "R").charAt(0).toUpperCase()) + "</span>") + "</a>" +
            '<div class="cm-postcard__who">' + (p._lib
              ? '<a class="cm-name cm-name--lib" href="profile.html?id=' + (window.TSB_COMMUNITY && TSB_COMMUNITY.OFFICIAL_ID || "tsb-library") + '">' + C.esc(p.author_name) + ' <span class="cm-vtick" title="Official channel of TheSmallBook">✔</span></a>'
              : '<a class="cm-name" href="profile.html?id=' + p.author_id + '">' + C.esc(p.author_name) + (C.isOfficial(p.author_id) ? '<span class="cm-vtick" title="Official channel">✔</span>' : "") + "</a>") +
              '<span class="cm-time">' + C.ago(p.created_at) + " · " + C.readMins(p.body) + " min read</span></div>" +
            (p._lib ? '<span class="cm-libchip">📚 BY THEsmALLBOOK</span>' : (p.author_id !== meId ? '<button class="cm-follow' + (fol.mine ? " on" : "") + '" data-follow="' + p.author_id + '">' + (fol.mine ? "✓ Following" : "+ Follow") + "</button>" : "")) +
          "</div>" +
          "<h1>" + C.esc(p.title) + "</h1>" +
          (p.subtitle ? '<p class="cm-postcard__sub">' + C.esc(p.subtitle) + "</p>" : "") +
          (p.audio_url ? '<button class="cm-listenbig" data-audio="' + C.esc(p.audio_url) + '" data-title="' + C.esc(p.title) + '">' + C.icon('phone') + " Listen to the voice version</button>" : "") +
          '<div class="cm-rich">' + C.sanitize(p.body) + "</div>" +
          (p.tags && p.tags.length ? '<div class="cm-card__tags">' + p.tags.map(function (t) { return "<span># " + C.esc(t) + "</span>"; }).join("") + "</div>" : "") +
          /* v250 · read receipts — the writer finally sees who read it */
          '<div class="rr" id="readBy" hidden></div>' +
          '<div class="cm-bigacts">' +
            (p._lib ? "" : '<button class="cm-bigact cm-blike' + (like.mine ? " on" : "") + '" data-like="' + p.id + '"><span class="cm-bigact__ico">♥</span><b>' + like.count + " like" + (like.count === 1 ? "" : "s") + "</b></button>") +
            (p._lib ? "" : '<a class="cm-bigact" href="#comments"><span class="cm-bigact__ico">' + C.icon('chat') + '</span><b>' + cmts.length + " comment" + (cmts.length === 1 ? "" : "s") + "</b></a>") +
            '<button class="cm-bigact" id="shareBtn"><span class="cm-bigact__ico">🔗</span><b>Share</b></button>' +
            (p.author_id === meId ? '<button class="cm-bigact cm-del" data-del="' + p.id + '"><span class="cm-bigact__ico">' + C.icon('trash') + '</span><b>Delete</b></button>' : "") +
          "</div>" +
        "</article>" +
        (p._lib
          ? '<section class="cm-comments" id="comments"><h2>' + C.icon('chat') + ' From the library</h2>' +
            '<p class="cm-empty cm-empty--sm">This one was posted by TheSmallBook\u2019s library channel — nothing to like or reply to here, but the book behind it is on your shelf.</p></section>'
          : '<section class="cm-comments" id="comments">' +
          "<h2>" + C.icon('chat') + " " + cmts.length + " comment" + (cmts.length === 1 ? "" : "s") + "</h2>" +
          '<div id="cmtList">' + (cmts.length ? cmts.map(cm).join("") : '<p class="cm-empty cm-empty--sm">Be the first to say something kind.</p>') + "</div>" +
          (meId
            ? '<div class="cm-cmtrow"><input id="cmtInput" class="setinput" maxlength="280" placeholder="Add a comment…"><button class="cm-pub cm-pub--sm" id="cmtSend">Send</button></div>'
            : '<a class="cm-write" href="login.html">Sign in to comment →</a>') +
        "</section>");
      try { C.protectMedia(root); } catch (e) {}

      /* ---- v250 · READ RECEIPTS ----------------------------------------
         Opening a story is the reading. It is logged once, on this device,
         straight into my own profile — and only if I left the receipt switch
         on in You. The writer sees a quiet pile of initials, never a list of
         strangers who get notified. */
      (function readStrip() {
        if (!C.signedIn() || !meId) return;
        try { C.markHeard(id); } catch (e) {}
        var box = root.querySelector("#readBy");
        if (!box) return;
        (async function () {
          try {
            var isMine = p.author_id === meId;
            var people = [];
            try { people = await C.allPeople(); } catch (e) {}
            var readers = (C.readersOf ? C.readersOf(people, id) : []) || [];
            var mine = false;
            try { mine = (C.heardPosts() || []).indexOf(id) >= 0; } catch (e) {}
            if (isMine) {
              box.hidden = false;
              if (!readers.length) {
                box.innerHTML = '<span class="rr__t">\ud83d\udc40 READ BY</span>' +
                  '<span class="rr--mine">nobody yet — it was just published. Share it once and watch this fill up.</span>';
                return;
              }
              var pile = readers.slice(0, 8).map(function (r) {
                return '<span title="' + C.esc(r.name || "A reader") + '">' +
                  C.esc(String(r.name || "R").charAt(0).toUpperCase()) + "</span>";
              }).join("");
              var names = readers.slice(0, 4).map(function (r) { return C.esc((r.name || "A reader").split(" ")[0]); }).join(", ");
              box.innerHTML = '<span class="rr__t">\ud83d\udc40 READ BY</span>' +
                '<span class="rr__pile">' + pile + "<b>" + readers.length + (readers.length === 1 ? " reader" : " readers") + "</b></span>" +
                '<span class="rr--mine">' + names + (readers.length > 4 ? " and " + (readers.length - 4) + " more" : "") + "</span>";
            } else {
              box.hidden = false;
              box.innerHTML = '<span class="rr__t">' + (mine ? "\u2713 YOU READ THIS" : "\ud83d\udc40 READ THIS") + "</span>" +
                (readers.length ? '<span class="rr__pile"><b>' + readers.length + (readers.length === 1 ? " reader" : " readers") + "</b></span>" : "");
            }
          } catch (e) { box.hidden = true; }
        })();
      })();

      function cm(c) {
        var pid2 = c.author_id || "";
        var initial = C.esc((c.author_name || "R").charAt(0).toUpperCase());
        return '<div class="cm-cmt cm-cmt--v2">' +
          '<a class="cm-ava" href="profile.html?id=' + pid2 + '"><span>' + initial + "</span></a>" +
          "<div>" +
            '<b><a class="cm-cmtname" href="profile.html?id=' + pid2 + '">' + C.esc(c.author_name) + "</a></b>" +
            '<span class="cm-time">' + C.ago(c.created_at) + "</span>" +
            "<p>" + C.esc(c.body) + "</p>" +
          "</div>" +
        "</div>";
      }

      var likeBtn = root.querySelector("[data-like]");
      function paintLike(info) {
        if (!likeBtn) return;
        likeBtn.classList.toggle("on", info.mine);
        likeBtn.querySelector("b").textContent = info.count + " like" + (info.count === 1 ? "" : "s");
      }
      function popLike() {
        if (!likeBtn) return;
        likeBtn.classList.remove("pop");
        void likeBtn.offsetWidth;
        likeBtn.classList.add("pop");
      }
      /* a library story has no like button, no comment box and no delete —
         guard each wiring so the page never assumes otherwise */
      if (likeBtn) likeBtn.addEventListener("click", async function () {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !likeBtn.classList.contains("on");
        likeBtn.classList.toggle("on", on);
        if (on) popLike();
        try {
          await C.setLike(id, on);
          paintLike(await C.likeInfo(id));
        } catch (e) {
          likeBtn.classList.toggle("on", !on);
          C.say("Like failed — " + (e && e.message ? e.message : e));
        }
      });
      /* Instagram-style double-tap ♥ anywhere on the story */
      root.addEventListener("dblclick", async function (e) {
        if (p._lib) return;
        if (e.target.closest("a, button, input, .cm-comments")) return;
        var h = document.createElement("div");
        h.className = "cm-bigheart"; h.textContent = "♥";
        root.appendChild(h);
        setTimeout(function () { h.remove(); }, 950);
        if (likeBtn.classList.contains("on")) return;
        likeBtn.classList.add("on"); popLike();
        try {
          await C.setLike(id, true);
          paintLike(await C.likeInfo(id));
        } catch (err) {}
      });
      var fb = root.querySelector("[data-follow]");
      if (fb) fb.addEventListener("click", async function () {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !this.classList.contains("on");
        try {
          await C.setFollow(p.author_id, on);
          var f = await C.followInfo(p.author_id);
          this.classList.toggle("on", f.mine);
          this.textContent = f.mine ? "✓ Following" : "+ Follow";
        } catch (e) { this.classList.toggle("on", !on); C.say("Follow failed — " + (e && e.message ? e.message : e)); }
      });
      var lb = root.querySelector("[data-audio]");
      if (lb) lb.addEventListener("click", function () { C.playAudio(lb.getAttribute("data-audio"), lb.getAttribute("data-title")); });
      var db = root.querySelector("[data-del]");
      if (db) db.addEventListener("click", async function () {
        if (!confirm("Delete this story for everyone?")) return;
        try { await C.deletePost(id); location.href = "stories.html"; }
        catch (e) { C.say(e && e.message ? ("Delete failed — " + e.message) : "Delete failed — are you the author?"); }
      });
      var shareB = document.getElementById("shareBtn");
      if (shareB) shareB.addEventListener("click", function () {
        var url = location.origin + location.pathname + "?s=" + String(p.id).replace(/-/g, "").slice(-8);
        var self = this;
        if (navigator.share) navigator.share({ title: p.title + " — TheSmallBook", url: url }).catch(function () {});
        else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).catch(function () {});
          self.textContent = "✓ Link copied";
          setTimeout(function () { self.textContent = "🔗 Share"; }, 1600);
        }
      });
      var send = document.getElementById("cmtSend");
      if (send) send.addEventListener("click", async function () {
        var inp = document.getElementById("cmtInput");
        var v = inp.value.trim();
        if (!v) return;
        try {
          var c = await C.addComment(id, v);
          inp.value = "";
          try {
            var list = document.getElementById("cmtList");
            var empty = list.querySelector(".cm-empty");
            if (empty) empty.remove();
            if (c) {
              list.insertAdjacentHTML("beforeend", cm(c));
            } else {
              // row not returned — refetch so the comment still shows; it is NOT a failure
              var cs2 = await C.listComments(id);
              list.innerHTML = cs2.map(cm).join("");
            }
          } catch (renderErr) {}
        } catch (e) { C.say("Comment failed — " + (e && e.message ? e.message : "sign in again.")); }
      });
    }
    boot();
  })();
  </script>
  <script src="js/bar.js?v=266" defer></script>
  <script src="js/gate.js?v=266" defer></script>
</body>
</html>
