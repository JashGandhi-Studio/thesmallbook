<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — TheSmallBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    // apply saved theme before paint (no flash)
    try { if (localStorage.getItem("tsb_theme") === '"dark"') document.documentElement.classList.add("dark"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>


  <!-- NAV -->
  <nav class="nav">
    <a class="logo" href="index.html">
      <span class="logo__mark">📕</span>
      <span>The<span class="logo__small">Small</span>Book</span>
    </a>
    <div class="nav__links">
      <a class="btn btn--yellow" href="stories.html#shelf">← COMMUNITY SHELF</a>
      <a class="btn" href="index.html#library">📚 LIBRARY</a>
      <a class="tsb-navuser" href="login.html" data-nav-auth title="Save your progress across devices">🔐 LOGIN</a>
      <button class="btn btn--icon" data-lang-btn title="Change language" aria-label="Language">🌐</button>
      <button class="btn btn--ink btn--icon" data-theme-toggle title="Dark mode" aria-label="Dark mode">🌙</button>
    </div>
  </nav>

  <section class="reader">
    <div class="reader__box" id="readerBox">
      <div class="reader__meta" id="meta"></div>
      <div id="content"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="head">📕 TheSmallBook</div>
    <p>Community stories are original works owned by their authors.</p>
    <div class="supportbar" data-supportbar style="margin-bottom:14px;"></div>
    <div id="tsb-auth-slot"></div>
    <div class="credits">✦ MADE BY JASH GANDHI ✦</div>
    <p class="tiny">BUILT WITH ❤️ · OPEN SOURCE ON GITHUB</p>
  </footer>

  <script src="js/prefs.js"></script>
  <script src="js/support.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stories-seed.js"></script>
  <script src="js/stories-community.js"></script>
  <script src="js/story.js"></script>
  <script src="js/failures.js"></script>
  <script src="js/ask-data.js"></script>
  <script src="js/tts-engine.js"></script>
  <script src="js/ask.js"></script>

</html>
