<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <link rel="manifest" href="manifest.json">
  <title>Listen, TheSmallBook</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Audiobooks, shows and podcasts inside TheSmallBook. Press play and keep living.">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      document.documentElement.classList.add("film", "fv-listen");
      var rawTh = localStorage.getItem("tsb_theme");
      var hr = new Date().getHours();
      var isNight = (hr < 6 || hr >= 18);
      var isExplicitDark = rawTh === '"dark"' || rawTh === 'dark';
      var isExplicitLight = rawTh === '"light"' || rawTh === 'light';
      if (isExplicitDark || (!isExplicitLight && isNight)) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>

      Listen

    <h1>Press play, <i>keep living.</i></h1>
