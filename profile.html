<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Profile — TheSmallBook Community</title>
  <meta name="description" content="A TheSmallBook community profile — posts, followers and activity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=227">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="cmpage">
  <main class="cm-profile" id="prof">
    <div class="cm-card cm-card--skel"><div class="cm-sk cm-sk--cover"></div>
      <div class="cm-card__body"><div class="cm-sk cm-sk--line w60"></div><div class="cm-sk cm-sk--line w40"></div></div>
    </div>
  </main>

  <script src="js/prefs.js?v=227"></script>
  <script src="js/lang.js?v=227"></script>
  <script src="js/config.js?v=227"></script>
  <script src="js/auth.js?v=227"></script>
  <script src="js/sounds.js?v=227"></script>
  <script src="js/founder.js?v=227"></script>
  <script src="js/community.js?v=227"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var root = document.getElementById("prof");
    var q = (location.search.match(/[?&]id=([^&]+)/) || [])[1] || "";
    var me = C.me();
    var meId = (me || {}).id || "";
    var pid = (!q || q === "me") ? meId : q;

    async function boot() {
      if (!C.enabled) { root.innerHTML = '<div class="cm-empty">☁️ Community cloud is warming up.</div>'; return; }
      if (!pid) { root.innerHTML = '<div class="cm-empty">👋 Sign in to see your activity.<br><a class="cm-write" href="login.html">Sign in — it’s free →</a></div>'; return; }
      var prof = null, posts = [], fol = { count: 0, mine: false };
      try { prof = await C.getProfile(pid); } catch (e) {}
      try { posts = await C.listPosts({ author: pid }); } catch (e) {}
      try { fol = await C.followInfo(pid); } catch (e) {}
      var followingCount = 0;
      try { followingCount = ((await C.api("follows?follower_id=eq." + pid + "&select=author_id", {})) || []).length; } catch (e) {}
      var mine = pid === meId;
      var md = (me && me.user_metadata) || {};
      var gName = "";
      try { gName = (window.TSB_AUTH && TSB_AUTH.displayName) ? (TSB_AUTH.displayName() || "") : ""; } catch (e) {}
      gName = gName || md.full_name || md.name || "";
      var gPic = md.avatar_url || md.picture || "";
      if (!prof) prof = { id: pid, name: mine ? (gName || "Reader") : ((posts[0] || {}).author_name || "Reader"), avatar_url: mine ? gPic : ((posts[0] || {}).author_avatar || ""), bio: "" };
      if (mine && !prof.avatar_url && gPic) prof.avatar_url = gPic;
      if (mine && (!prof.name || prof.name === "Reader") && gName) prof.name = gName;
      var likesGot = 0;
      if (mine) {
        try { likesGot = (await C.likesOnMyPosts()).length; } catch (e) {}
      }
      document.title = prof.name + " — TheSmallBook";
      var progShown = prof.progress || 0;
      var lkArr = (Array.isArray(prof.links) ? prof.links : []).filter(Boolean).slice(0, 3);
      if (mine) { try { progShown = Math.max(progShown, window.TSB && TSB.progress ? TSB.progress.totalRead() : 0); } catch (e) {} }

      var hue = parseInt(String(pid).replace(/-/g, "").slice(0, 4), 16) % 360;
      var avaHtml = '<div class="cm-avawrap">' +
        '<div class="cm-ava cm-ava--xl cm-ava--ring">' + (C.avaUrl(prof.name, prof.avatar_url, pid) ? '<img src="' + C.esc(C.avaUrl(prof.name, prof.avatar_url, pid)) + '" alt="">' : "<span>" + C.esc((prof.name || "R").charAt(0).toUpperCase()) + "</span>") + "</div>" +
        (mine ? '<button class="cm-avaplus" id="avaPlus" title="Change profile picture" aria-label="Change profile picture">+</button>' : "") +
      "</div>";
      root.innerHTML =
        '<header class="cm-profhead cm-profhead--v2">' +
          '<div class="cm-banner" style="background:linear-gradient(135deg,hsl(' + hue + ',78%,62%),hsl(' + ((hue + 42) % 360) + ',70%,40%))"></div>' +
          '<div class="cm-profcard">' +
            '<div class="cm-profcard__top">' +
              avaHtml +
              '<div class="cm-profmain">' +
                "<h1>" + C.esc(prof.name) + (C.isOfficial(pid) ? '<span class="cm-vtick">✔</span><span style="margin-left:6px;background:#111;color:#ffc800;border:2px solid #111;border-radius:999px;padding:2px 8px;font-family:Archivo Black,sans-serif;font-size:.60rem;letter-spacing:.5px;vertical-align:middle">FOUNDING</span>' : "") + (mine && window.TSB_GOLD && TSB_GOLD.isGold() && !C.isOfficial(pid) ? '<span style="margin-left:6px;background:linear-gradient(135deg,#ffd94d,#ffc800);border:2px solid #111;border-radius:999px;padding:2px 8px;font-family:Archivo Black,sans-serif;font-size:.60rem;letter-spacing:.5px;vertical-align:middle;color:#111">GOLD</span>' : "") + (mine ? " <i>(you)</i>" : "") + "</h1>" +
                '<span class="cm-idchip">@' + pid.slice(0, 8) + "</span>" +
                (mine ? '<div style="margin-top:6px;font:500 11px Space Grotesk,sans-serif;color:var(--muted);word-break:break-all;background:rgba(0,0,0,.04);padding:6px 8px;border-radius:10px;border:1px dashed rgba(0,0,0,.12)"><span style="opacity:.7">Full ID</span> <b id="founderIdBox" style="color:var(--ink)">' + pid + '</b>' + (C.isOfficial(pid) ? ' <span class="cm-vtick">✔</span> <span style="color:#0a7">verified — tick visible everywhere</span>' : ' <span style="opacity:.7">— send this full ID to dev to enable ✔ for everyone</span>') + ' <button onclick="try{navigator.clipboard.writeText(\'' + pid + '\')}catch(e){} ; this.textContent=\'✓ Copied\'; setTimeout(()=>this.textContent=\'Copy\',1500)\" style="margin-left:6px;font:700 10px Space Grotesk,sans-serif;padding:3px 7px;border-radius:999px;border:2px solid #1c1a17;background:#ffc800;cursor:pointer">Copy</button></div>' : "") +
              "</div>" +
            "</div>" +
            (prof.bio ? '<p class="cm-bio">' + C.esc(prof.bio) + "</p>" : "") +
            (lkArr.length ? '<div class="cm-linksrow">' + lkArr.map(function (l) { return '<a class="cm-linkchip" href="' + C.esc(/^https?:\/\//i.test(l) ? l : "https://" + l) + '" target="_blank" rel="noopener">' + C.icon('link') + " " + C.esc(String(l).replace(/^https?:\/\//i, "").slice(0, 42)) + "</a>"; }).join("") + "</div>" : "") +
            '<div class="cm-statrow">' +
              '<span class="cm-statrow__n"><b>' + posts.length + "</b><span>posts</span></span>" +
              '<a class="cm-statrow__n" href="profile.html?id=' + pid + '&view=followers" data-lsoc="followers"><b>' + fol.count + "</b><span>followers</span></a>" +
              '<a class="cm-statrow__n" href="profile.html?id=' + pid + '&view=following" data-lsoc="following"><b>' + followingCount + "</b><span>following</span></a>" +
              (mine ? '<span class="cm-statrow__n"><b>' + likesGot + "</b><span>likes</span></span>" : "") +
            "</div>" +
            (progShown ? '<div class="cm-progpill">' + C.icon('book') + ' ' + progShown + " / " + ((window.BOOKS || []).reduce(function (a, b) { return a + (b.lessons ? b.lessons.length : 0); }, 0) || 2637).toLocaleString("en-IN") + " lessons read</div>" : "") +
            (mine
              ? '<div class="cm-profacts"><span class="cm-time">' + C.icon('share') + ' This is your public card — share it below</span></div>'
              : "") +
          "</div>" +
          (mine ? '<div class="cm-sharecard">' +
            '<div class="cm-sharecard__brand">' + C.icon('book') + ' THESMALLBOOK · COMMUNITY</div>' +
            '<div class="cm-sharecard__who">' +
              '<div class="cm-ava cm-ava--lg">' + (C.avaUrl(prof.name, prof.avatar_url, pid) ? '<img src="' + C.esc(C.avaUrl(prof.name, prof.avatar_url, pid)) + '" alt="">' : "<span>" + C.esc((prof.name || "R").charAt(0).toUpperCase()) + "</span>") + "</div>" +
              '<div><b>' + C.esc(prof.name) + (C.isOfficial(pid) ? '<span class="cm-vtick">✔</span>' : "") + "</b>" +
              '<span class="cm-time">ID ' + pid.slice(0, 8) + "</span></div>" +
            "</div>" +
            (prof.bio ? '<p class="cm-bio">' + C.esc(prof.bio) + "</p>" : "") +
            '<span class="cm-sharecard__cta">' + (mine ? C.icon('share') + " This is you — share this card" : C.icon('bell') + " Subscribe — follow on TheSmallBook") + "</span>" +
          "</div>" : "") +
          '<div class="cm-sharerow cm-sharerow--main">' +
            (mine
              ? '<button class="cm-follow" id="editProfileBtn">' + C.icon('pencil') + " Edit profile</button>" +
                '<button class="cm-dmbtn cm-dmbtn--big" id="shareProfile">' + C.icon('share') + " Share profile</button>"
              : '<button class="cm-follow' + (fol.mine ? " on" : "") + '" data-pfol="' + pid + '">' + (fol.mine ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe") + "</button>" +
                '<a class="cm-dmbtn cm-dmbtn--big" href="dm.html?u=' + pid + '">' + C.icon('chat') + " Message</a>") +
          "</div>" +
          '<div class="cm-sharerow cm-sharerow--sub">' +
            (!mine ? '<button class="setbtn" id="shareProfile">' + C.icon('share') + " Share profile</button>" : "") +
            '<button class="setbtn" id="shareId">' + C.icon('user') + " Copy profile</button>" +
          "</div>" +
          (mine
            ? '<a class="cm-write" href="dm.html">' + C.icon('chat') + " My messages</a>"
            : "") +
          (mine
            ? '<div class="cm-profedit" id="profEdit">' +
                '<label class="cm-lbl cm-lbl--file" for="pAva">Profile photo' +
                '<span class="upbtn">📷&nbsp; Choose photo</span><span class="upname" id="pAvaName">No file chosen</span>' +
                '<input id="pAva" type="file" accept="image/*" hidden></label>' +
                '<label class="cm-lbl">Display name<input id="pName" class="setinput" maxlength="24" value="' + C.esc(prof.name) + '"></label>' +
                '<label class="cm-lbl">Bio<input id="pBio" class="setinput" maxlength="120" value="' + C.esc(prof.bio || "") + '" placeholder="One line about you"></label>' +
                '<label class="cm-lbl">Links (comma-separated)<input id="pLinks" class="setinput" maxlength="200" value="' + C.esc((Array.isArray(prof.links) ? prof.links : []).join(", ")) + '" placeholder="https://yoursite.com, https://instagram.com/you"></label>' +
                '<button class="cm-pub cm-pub--sm" id="pSave">Save profile</button>' +
              "</div>"
            : "") +
        "</header>" +
        '<h2 class="cm-sect">' + (mine ? "📔 Your stories" : "✍️ Stories") + "</h2>" +
        '<div class="cm-feed cm-feed--tight" id="pfeed">' +
          (posts.length ? posts.map(card).join("") : '<div class="cm-empty cm-empty--sm">No stories yet.</div>') +
        "</div>";

      function card(p) {
        return '<article class="cm-card cm-card--row" data-post="' + p.id + '">' +
          '<a class="cm-card__cover cm-card__cover--sm" href="story.html?id=' + p.id + '">' +
            (p.cover_url ? '<img src="' + C.esc(p.cover_url) + '" alt="" loading="lazy">' : '<span class="cm-quote">❝</span>') +
          "</a>" +
          '<div class="cm-card__body">' +
            '<a class="cm-card__title" href="story.html?id=' + p.id + '">' + C.esc(p.title) + "</a>" +
            '<span class="cm-time">' + C.ago(p.created_at) + " · " + C.readMins(p.body) + " min" + (p.audio_url ? " · 🎧" : "") + "</span>" +
            '<div class="cm-card__foot"><button class="cm-like" data-like="' + p.id + '">♥ <b>…</b></button>' +
            (mine ? '<button class="cm-del" data-del="' + p.id + '" title="Delete">' + C.icon('trash') + "</button>" : "") + "</div>" +
          "</div></article>";
      }

      /* hydrate likes */
      var pf = document.getElementById("pfeed");
      pf.querySelectorAll("[data-like]").forEach(async function (b) {
        try {
          var info = await C.likeInfo(b.getAttribute("data-like"));
          b.querySelector("b").textContent = info.count;
          b.classList.toggle("on", info.mine);
        } catch (e) {}
      });
      pf.addEventListener("click", async function (e) {
        var t;
        if ((t = e.target.closest("[data-like]"))) {
          if (!C.signedIn()) { location.href = "login.html"; return; }
          var on = !t.classList.contains("on");
          try {
            await C.setLike(t.getAttribute("data-like"), on);
            var info = await C.likeInfo(t.getAttribute("data-like"));
            t.classList.toggle("on", info.mine);
            t.querySelector("b").textContent = info.count;
          } catch (err) {}
          return;
        }
        if ((t = e.target.closest("[data-del]"))) {
          if (!confirm("Delete this story for everyone?")) return;
          try { await C.deletePost(t.getAttribute("data-del")); boot(); } catch (err) {}
          return;
        }
      });
      root.addEventListener("click", async function (e) {
        var t = e.target.closest("[data-pfol]");
        if (!t) return;
        if (!C.signedIn()) { location.href = "login.html"; return; }
        t.disabled = true;
        var on = !t.classList.contains("on");
        try {
          await C.setFollow(t.getAttribute("data-pfol"), on);
          t.classList.toggle("on", on);
          t.innerHTML = on ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe";
        } catch (err) { alert("Subscribe failed — " + (err && err.message ? err.message : err)); }
        t.disabled = false;
      });
      var sheetEl = null;
      function closeSocial() {
        if (sheetEl) { sheetEl.remove(); sheetEl = null; document.body.classList.remove("cm-soc-open"); }
      }
      function openSocial(kind) {
        closeSocial();
        sheetEl = document.createElement("div");
        sheetEl.className = "cm-socsheet";
        sheetEl.innerHTML =
          '<div class="cm-socsheet__card">' +
            '<header class="cm-socsheet__head">' +
              '<button class="cm-socsheet__back" id="socBack" aria-label="Back to profile">\u2190</button>' +
              '<div class="cm-socsheet__tabs">' +
                '<button class="on" data-stab="followers">Followers</button>' +
                '<button data-stab="following">Following</button>' +
              '</div>' +
              '<span class="cm-socsheet__count" id="socCount"></span>' +
            '</header>' +
            '<div class="cm-socsheet__list" id="socList"><p class="cm-empty cm-empty--sm">Loading…</p></div>' +
          '</div>';
        document.body.appendChild(sheetEl);
        document.body.classList.add("cm-soc-open");
        sheetEl.addEventListener("click", function (e) { if (e.target === sheetEl) closeSocial(); });
        sheetEl.querySelector("#socBack").addEventListener("click", closeSocial);
        sheetEl.querySelectorAll("[data-stab]").forEach(function (b) {
          b.addEventListener("click", function () {
            sheetEl.querySelectorAll("[data-stab]").forEach(function (x) { x.classList.toggle("on", x === b); });
            loadSocial(b.getAttribute("data-stab"));
          });
        });
        loadSocial(kind);
      }
      function loadSocial(kind) {
        var listEl = sheetEl.querySelector("#socList");
        listEl.innerHTML = '<p class="cm-empty cm-empty--sm">Loading…</p>';
        (async function () {
          var ids = [];
          try {
            if (kind === "followers") ids = ((await C.followerRows(pid)) || []).map(function (r) { return r.follower_id; });
            else ids = (((await C.api("follows?follower_id=eq." + pid + "&select=author_id", {})) || []).map(function (r) { return r.author_id; }));
          } catch (e) {}
          var myFol = {};
          if (C.signedIn()) { try { (await C.followingIds()).forEach(function (x) { myFol[x] = 1; }); } catch (e) {} }
          var cnt = sheetEl.querySelector("#socCount");
          if (cnt) cnt.textContent = ids.length;
          listEl.innerHTML = ids.length ? '<div class="cm-people">' + ids.map(function (fid) {
            var isMeRow = fid === meId;
            return '<div class="cm-person" data-pid="' + fid + '">' +
              '<div class="cm-person__top">' +
                '<a class="cm-ava cm-ava--lg" href="profile.html?id=' + fid + '"><span>' + C.esc(String(fid).charAt(0).toUpperCase()) + "</span></a>" +
                '<div class="cm-person__meta">' +
                  '<a class="cm-name" href="profile.html?id=' + fid + '">Loading…</a>' +
                  '<span class="cm-time cm-socid">@' + fid.slice(0, 8) + "</span>" +
                "</div>" +
              "</div>" +
              '<div class="cm-person__acts">' +
                (isMeRow ? '<span class="cm-time">· you</span>' :
                  '<button class="cm-follow' + (myFol[fid] ? " on" : "") + '" data-socfol="' + fid + '">' + (myFol[fid] ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe") + "</button>" +
                  '<a class="cm-dmbtn" href="dm.html?u=' + fid + '" title="Message">' + C.icon('chat') + "</a>") +
              "</div>" +
            "</div>";
          }).join("") + "</div>" : '<p class="cm-empty cm-empty--sm">Nobody here yet.</p>';
          listEl.addEventListener("click", async function (e) {
            var t = e.target.closest("[data-socfol]");
            if (!t) return;
            if (!C.signedIn()) { location.href = "login.html"; return; }
            t.disabled = true;
            var on2 = !t.classList.contains("on");
            try {
              await C.setFollow(t.getAttribute("data-socfol"), on2);
              t.classList.toggle("on", on2);
              t.innerHTML = on2 ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe";
            } catch (err) { alert("Subscribe failed — " + (err && err.message ? err.message : err)); }
            t.disabled = false;
          });
          ids.forEach(async function (fid) {
            try {
              var pr = await C.getProfile(fid);
              if (!pr) return;
              var el = listEl.querySelector('[data-pid="' + fid + '"]');
              if (!el) return;
              var av = C.avaUrl(pr.name, pr.avatar_url, fid);
              var avEl = el.querySelector(".cm-ava");
              avEl.innerHTML = av ? '<img src="' + C.esc(av) + '" alt="">' : "<span>" + C.esc((pr.name || "R").charAt(0).toUpperCase()) + "</span>";
              var nm2 = el.querySelector(".cm-name");
              nm2.textContent = pr.name || "Reader";
              if (C.isOfficial(fid)) nm2.insertAdjacentHTML("afterend", '<span class="cm-vtick">✔</span>');
            } catch (e) {}
          });
        })();
      }
      var view = (location.search.match(/[?&]view=(followers|following)/) || [])[1] || "";
      if (view) setTimeout(function () { openSocial(view); }, 60);
      document.addEventListener("click", function (e) {
        var st = e.target.closest("[data-lsoc]");
        if (!st) return;
        e.preventDefault();
        if (!C.signedIn()) { location.href = "login.html"; return; }
        openSocial(st.getAttribute("data-lsoc"));
      });
      var eb = document.getElementById("editProfileBtn");
      if (eb) eb.addEventListener("click", function () {
        var ed = document.getElementById("profEdit");
        if (ed) { ed.scrollIntoView({ behavior: "smooth", block: "center" }); var n2 = document.getElementById("pName"); if (n2) n2.focus(); }
      });
      var fb = root.querySelector("[data-follow]");
      if (fb) fb.addEventListener("click", async function () {
        if (!C.signedIn()) { location.href = "login.html"; return; }
        var on = !this.classList.contains("on");
        try {
          await C.setFollow(pid, on);
          var f = await C.followInfo(pid);
          this.classList.toggle("on", f.mine);
          this.innerHTML = f.mine ? C.icon('check') + " Subscribed" : C.icon('bell') + " Subscribe";
          var fc = root.querySelector(".cm-stats b");
        } catch (e) { alert((on ? "Subscribe" : "Unsubscribe") + " failed — " + (e && e.message ? e.message : e)); }
      });
      function copyTxt(t) {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).catch(function () {}); return; }
        try {
          var ta = document.createElement("textarea");
          ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        } catch (e) {}
      }
      document.getElementById("shareId").addEventListener("click", function () {
        var txt = pid;
        copyTxt(txt);
        this.textContent = "✓ Copied " + pid.slice(0, 8);
        var self = this; setTimeout(function () { self.innerHTML = C.icon('user') + " Copy profile"; }, 1600);
      });
      async function makeShareCard() {
        var W = 1080, H = 640;
        var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var x = cv.getContext("2d");
        x.fillStyle = "#fffdf4"; x.fillRect(0, 0, W, H);
        x.fillStyle = "#ffc800"; x.fillRect(0, 0, W, 120);
        x.fillStyle = "#1c1a17";
        x.font = "800 44px 'Space Grotesk', sans-serif";
        x.fillText("\u{1F4D5} THESMALLBOOK", 44, 78);
        x.font = "600 26px 'Space Grotesk', sans-serif";
        x.fillText("COMMUNITY", W - 220, 76);
        var ax = 170, ay = 330, r = 100;
        var avaSrc = C.avaUrl(prof.name, prof.avatar_url, pid);
        var drew = false;
        if (avaSrc) {
          try {
            var img = new Image(); img.crossOrigin = "anonymous";
            await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; img.src = avaSrc; });
            x.save(); x.beginPath(); x.arc(ax, ay, r, 0, 7); x.clip();
            x.drawImage(img, ax - r, ay - r, 2 * r, 2 * r); x.restore();
            drew = true;
          } catch (e) {}
        }
        if (!drew) {
          x.fillStyle = "#ffc800"; x.beginPath(); x.arc(ax, ay, r, 0, 7); x.fill();
          x.fillStyle = "#1c1a17"; x.font = "800 100px sans-serif"; x.textAlign = "center";
          x.fillText((prof.name || "R").charAt(0).toUpperCase(), ax, ay + 36); x.textAlign = "left";
        }
        x.lineWidth = 8; x.strokeStyle = "#1c1a17"; x.beginPath(); x.arc(ax, ay, r + 4, 0, 7); x.stroke();
        x.fillStyle = "#1c1a17";
        x.font = "800 62px 'Space Grotesk', sans-serif";
        x.fillText(String(prof.name).slice(0, 22) + (C.isOfficial(pid) ? "  \u2714" : ""), 320, 300);
        x.fillStyle = "#55504a"; x.font = "500 32px 'Space Grotesk', sans-serif";
        x.fillText(String(prof.bio || "Reader on TheSmallBook").slice(0, 48), 320, 356);
        x.fillStyle = "#1c1a17"; x.font = "700 28px 'Space Grotesk', sans-serif";
        x.fillText("ID " + pid.slice(0, 8) + (prof.progress ? "   \u00B7   \u{1F4DA} " + prof.progress + "/2637 lessons" : ""), 320, 412);
        x.fillStyle = "#1c1a17"; x.fillRect(44, H - 150, W - 88, 104);
        x.fillStyle = "#ffc800"; x.font = "800 44px 'Space Grotesk', sans-serif";
        x.fillText("\u{1F514} Subscribe on TheSmallBook", 84, H - 84);
        x.lineWidth = 10; x.strokeStyle = "#1c1a17"; x.strokeRect(5, 5, W - 10, H - 10);
        return cv;
      }
      document.getElementById("shareProfile").addEventListener("click", async function () {
        var self = this;
        var url = location.origin + "/profile.html?id=" + pid;
        self.textContent = "\u2026 making your card";
        try {
          var cv = await makeShareCard();
          var blob = await new Promise(function (r) { cv.toBlob(r, "image/png"); });
          var file = new File([blob], "thesmallbook-" + String(prof.name).replace(/\W+/g, "-") + ".png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: prof.name + " \u2014 TheSmallBook", text: "Read " + prof.name + "'s stories on TheSmallBook \u{1F4D5}", url: url });
            self.textContent = "\u2713 Shared";
          } else if (navigator.share) {
            await navigator.share({ title: prof.name + " \u2014 TheSmallBook", text: "Read " + prof.name + "'s stories on TheSmallBook \u{1F4D5}", url: url }).catch(function () {});
            self.textContent = "\u2713 Shared";
          } else {
            var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
            copyTxt(url);
            self.textContent = "\u2713 Card saved + link copied";
          }
        } catch (e) {
          copyTxt(url);
          self.textContent = "\u2713 Link copied";
        }
        setTimeout(function () { self.innerHTML = C.icon('share') + " Share profile"; }, 2200);
      });
      C.syncProgress(mine);
      if (mine) C.ensureProfile();
      var plusBtn = document.getElementById("avaPlus");
      if (plusBtn) plusBtn.addEventListener("click", function () { var fi = document.getElementById("pAva"); if (fi) fi.click(); });
      var ava = document.getElementById("pAva");
      if (ava) ava.addEventListener("change", async function () {
        var f = this.files && this.files[0];
        if (!f) return;
        try {
          var nmEl = document.getElementById("pAvaName");
          if (nmEl) nmEl.textContent = "✓ " + f.name.slice(0, 22) + (f.name.length > 22 ? "…" : "");
          var url = await C.upload(f, "tsb-avatars");
          await C.api("profiles?id=eq." + meId, { method: "PATCH", body: { avatar_url: url } });
          try { await C.syncAvatarPosts(url, null); } catch (e) {}   /* new photo now on every story */
          boot();
        } catch (e) { alert("Avatar upload failed — " + (e && e.message ? e.message : e)); }
      });
      var save = document.getElementById("pSave");
      if (save) save.addEventListener("click", async function () {
        try {
          var nm = document.getElementById("pName").value.trim() || "Reader";
          var lnkEl = document.getElementById("pLinks");
          var lks2 = lnkEl ? lnkEl.value.split(",").map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 3) : [];
          await C.api("profiles?id=eq." + meId, { method: "PATCH", body: { name: nm, bio: document.getElementById("pBio").value.trim(), links: lks2 } });
          try { await C.syncAvatarPosts(null, nm); } catch (e) {}   /* name on every story too */
          if (window.TSB_AUTH && TSB_AUTH.setDisplayName) TSB_AUTH.setDisplayName(nm);
          boot();
        } catch (e) { alert("Save failed — " + (e && e.message ? e.message : e)); }
      });
    }
    boot();
  })();
  </script>
