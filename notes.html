<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:title" content="Your Notebook · TheSmallBook">
  <title>YOUR NOTEBOOK · TheSmallBook</title>
  <meta name="description" content="Your private reading notebook: real paper, real pages, photos, voice notes and drawings. It saves itself as you write.">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Special+Elite&family=Indie+Flower&family=Patrick+Hand&family=Shadows+Into+Light&family=Homemade+Apple&family=Dancing+Script&family=Permanent+Marker&family=Rock+Salt&family=Amatic+SC&family=Gloria+Hallelujah&family=Kaushan+Script&family=Playfair+Display&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=291">
  <style>
    .nt-wrap { max-width: 780px; margin: 0 auto; padding: 18px 16px calc(90px + env(safe-area-inset-bottom)); }
    .nt-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .nt-back { display: inline-flex; align-items: center; gap: 7px; background: var(--paper); border: 3px solid var(--ink); border-radius: 11px; box-shadow: 3px 3px 0 var(--ink); padding: 9px 13px; font: 800 11px var(--font-head); letter-spacing: 1px; text-decoration: none; color: var(--ink); }
    button.nt-back { cursor: pointer; }
    .nt-h { font: 800 13px var(--font-head); letter-spacing: 2.5px; }
    .nt-new { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: #fff; border: 3px solid var(--ink); border-radius: 11px; box-shadow: 3px 3px 0 rgba(17,17,17,.35); padding: 10px 14px; font: 800 11px var(--font-head); letter-spacing: 1.2px; cursor: pointer; }
    .nt-new:active { transform: translate(1.5px,1.5px); box-shadow: 1px 1px 0 rgba(17,17,17,.35); }
    .nt-guest { background: var(--surface-2); border: 2.5px dashed var(--ink); border-radius: 12px; padding: 10px 13px; font: 500 12.5px/1.6 var(--font-body); margin-bottom: 14px; }

    /* ================= the cover ================= */
    .nt-cover {
      position: relative; overflow: hidden;
      background: linear-gradient(165deg, #23231f 0%, #1b1b18 60%, #161614 100%);
      border: 3px solid var(--ink); border-radius: 18px;
      box-shadow: 8px 8px 0 var(--ink), inset 0 1px 0 rgba(255,255,255,.05);
      padding: 34px 26px 26px 56px; color: #e9dcb8;
    }
    .nt-cover::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 34px;
      background: linear-gradient(90deg, #101010, #191917 70%, rgba(255,255,255,.05));
      border-right: 1.5px solid rgba(255,255,255,.12);
    }
    .nt-cover::after { content: ""; position: absolute; top: 0; bottom: 0; left: 34px; width: 0; border-left: 5px dotted rgba(255,255,255,.16); }
    .nt-cover__word { text-align: center; }
    .nt-cover__word b { display: block; font: 800 14px var(--font-head); letter-spacing: 5px; color: #cfcabe; text-shadow: 0 1px 0 #000; }
    .nt-cover__word i { display: block; font: 500 11px var(--font-body); letter-spacing: 2.5px; color: #8a8a80; margin-top: 6px; font-style: normal; }
    .nt-cover__rule { width: 54px; height: 1.5px; background: #6f6f66; margin: 15px auto 0; }
    .nt-toc { margin-top: 24px; }
    .nt-toc__h { text-align: center; font: 800 10px var(--font-head); letter-spacing: 3.5px; color: #8a8a80; margin-bottom: 8px; }
    .nt-entry { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.045); border: 2.5px solid rgba(255,255,255,.14); border-radius: 13px; padding: 12px 13px; margin: 9px 0; cursor: pointer; transition: background .15s ease, transform .15s ease, border-color .15s ease; }
    .nt-entry:hover, .nt-entry:active { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.3); transform: translateY(-1px); }
    .nt-entry__fold { flex: none; font-size: 21px; filter: saturate(.9); }
    .nt-entry__mid { flex: 1; min-width: 0; display: block; }
    .nt-entry__t { display: block; font-family: 'Caveat', Georgia, serif; font-size: 22px; font-weight: 600; color: #f4f1e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nt-entry__s { display: block; font: 500 11.5px/1.45 var(--font-body); font-style: normal; color: #a39a88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 3px 0 4px; }
    .nt-entry__m { display: block; font: 600 9.5px var(--font-body); color: #777061; letter-spacing: .6px; text-transform: uppercase; }
    .nt-entry__x { flex: none; align-self: flex-start; background: none; border: 0; color: #77776e; font-size: 14px; cursor: pointer; padding: 2px 6px; }
    .nt-entry__x:hover { color: #ff8a80; }
    .nt-empty { text-align: center; font: 500 13.5px/1.8 var(--font-body); color: #9a8f76; padding: 30px 12px 18px; }
    .nt-empty b { display: block; font-family: 'Caveat', Georgia, serif; font-size: 26px; font-weight: 600; color: #d6d2c6; margin-bottom: 6px; }

    /* ================= the desk ================= */
    .nt-titlein { width: 100%; background: transparent; border: 0; border-bottom: 2.5px solid rgba(17,17,17,.85); font: 700 20px/1.3 var(--font-body); padding: 4px 2px 6px; color: var(--ink); box-sizing: border-box; }
    .nt-titlein:focus { outline: none; }
    .nt-titlein::placeholder { color: #c9c2b0; }
    .nt-bar { display: flex; gap: 2px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; background: transparent; border: 0; border-bottom: 2.5px solid var(--ink); padding: 4px 2px 7px; margin: 10px 0 14px; }
    .nt-bar::-webkit-scrollbar { display: none; }
    .nt-bar > * { flex: none; scroll-snap-align: center; }
    .nt-fontsel { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 9px; padding: 5px 4px; font: 700 11px var(--font-body); color: var(--ink); max-width: 132px; min-height: 32px; }
    .nt-body img { touch-action: pan-y; }
    .nt-body img.nt-lift { outline: 3px dashed #1d6fd1; outline-offset: 4px; opacity: .88; box-shadow: 0 10px 24px rgba(17,17,17,.35); }
    .nt-bar button { background: transparent; border: 0; border-radius: 7px; min-width: 34px; min-height: 32px; padding: 4px 9px; font: 700 13px var(--font-body); color: var(--ink); cursor: pointer; opacity: .78; }
    .nt-bar button:hover { opacity: 1; background: var(--surface-2); }
    .nt-bar button:active { transform: translateY(1px); }
    .nt-bar .nt-sep { flex: none; width: 1.5px; height: 20px; background: rgba(17,17,17,.25); margin: 0 7px; }
    .nt-desk { perspective: 1600px; }
    .nt-paperwrap { position: relative; filter: drop-shadow(6px 7px 0 rgba(17,17,17,.9)); }
    .nt-paperwrap::before, .nt-paperwrap::after { content: ""; position: absolute; inset: 0; background: #f6f0e0; border: 2.5px solid var(--ink); border-radius: 14px; z-index: 0; }
    .nt-paperwrap::before { transform: rotate(1deg) translate(3px,3px); }
    .nt-paperwrap::after { transform: rotate(-.9deg) translate(-3px,4px); }
    .nt-paper {
      position: relative; z-index: 1; transform-origin: left center;
      background:
        linear-gradient(90deg, transparent 0 44px, rgba(214,69,69,.45) 44px 45.5px, transparent 45.5px),
        repeating-linear-gradient(180deg, transparent 0 33px, #cfdae6 33px 34.5px),
        #fffdf6;
      background-position: 14px 0, 0 33px, 0 0;
      border: 3px solid var(--ink); border-radius: 14px;
      padding: 18px 20px 24px 64px; min-height: 440px;
      transition: box-shadow .2s ease;
    }
    .nt-rings { position: absolute; top: -12px; left: 24px; right: 24px; height: 20px; display: flex; justify-content: space-between; z-index: 2; }
    .nt-rings i { width: 22px; height: 20px; border-radius: 10px/12px; background: linear-gradient(180deg, #f0ede4, #b9b4a4); border: 3px solid var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
    .nt-body { font: 500 15.5px/34px 'Special Elite', Georgia, serif; color: #26221a; min-height: 440px; outline: none; caret-color: #d64545; }
    .nt-body:empty::before { content: attr(data-ph); color: #b9b2a2; font-family: var(--font-body); font-size: 14px; pointer-events: none; }
    .nt-body img { max-width: 100%; border: 2.5px solid var(--ink); border-radius: 10px; margin: 4px 0; cursor: pointer; }
    .nt-body blockquote { border-left: 5px solid #3a3a36; margin: 4px 0; padding-left: 12px; }
    .nt-body ul, .nt-body ol { padding-left: 22px; }
    .nt-body h2 { font: 700 22px/34px var(--font-body); }

    /* the page turn: the arriving sheet swings in off the rings */
    .nt-paper.nt-in-l { animation: ntInL .42s cubic-bezier(.2,.7,.3,1); }
    .nt-paper.nt-in-r { animation: ntInR .42s cubic-bezier(.2,.7,.3,1); }
    @keyframes ntInL {
      0% { transform: perspective(1600px) rotateY(13deg) translateX(-40px); opacity: .25; box-shadow: -22px 0 34px rgba(17,17,17,.3); }
      60% { opacity: 1; }
      100% { transform: none; box-shadow: none; }
    }
    @keyframes ntInR {
      0% { transform: perspective(1600px) rotateY(-13deg) translateX(40px); opacity: .25; box-shadow: 22px 0 34px rgba(17,17,17,.3); }
      60% { opacity: 1; }
      100% { transform: none; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { .nt-paper.nt-in-l, .nt-paper.nt-in-r { animation: none; } }

    /* the voice chip, dressed like the page */
    .nt-chip { display: flex; align-items: center; gap: 9px; border: 2.5px solid var(--ink); border-radius: 12px; background: #f6f0e0; padding: 7px 11px; margin: 6px 0; max-width: 320px; }
    .nt-chip button { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2.5px solid var(--ink); background: var(--ink); color: #fff; font-size: 11px; cursor: pointer; line-height: 1; }
    .nt-chip .nt-chip__t { font: 700 11.5px var(--font-body); color: #26221a; }
    .nt-chip .nt-chip__d { font: 500 10px var(--font-body); color: #8a8a80; }
    .nt-chip .nt-bars { display: flex; gap: 2.5px; align-items: flex-end; height: 16px; margin-left: auto; }
    .nt-chip .nt-bars i { width: 3px; background: #26221a; border-radius: 2px; opacity: .55; height: 5px; }
    .nt-chip.playing .nt-bars i { animation: ntBar .8s ease-in-out infinite; }
    .nt-chip.playing .nt-bars i:nth-child(2) { animation-delay: .12s; }
    .nt-chip.playing .nt-bars i:nth-child(3) { animation-delay: .24s; }
    .nt-chip.playing .nt-bars i:nth-child(4) { animation-delay: .36s; }
    @keyframes ntBar { 0%,100% { height: 5px; } 50% { height: 15px; } }
    @media (prefers-reduced-motion: reduce) { .nt-chip.playing .nt-bars i { animation: none; height: 11px; } }

    /* the resize bar */
    .nt-rs { position: fixed; z-index: 99997; display: none; gap: 4px; background: var(--ink); border: 2.5px solid var(--ink); border-radius: 11px; padding: 4px; box-shadow: 3px 3px 0 rgba(17,17,17,.4); }
    .nt-rs button { border: 0; background: transparent; color: #fff; font: 800 10px var(--font-head); letter-spacing: .5px; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
    .nt-rs button:hover { background: rgba(255,255,255,.14); }
    .nt-rs button.on { background: var(--ink); color: var(--paper); }

    .nt-pager { display: flex; align-items: center; gap: 10px; margin: 16px 2px 0; }
    .nt-pbtn { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); padding: 10px 13px; font: 800 10.5px var(--font-head); letter-spacing: 1px; cursor: pointer; }
    .nt-pbtn:active { transform: translate(1.5px,1.5px); box-shadow: 1px 1px 0 var(--ink); }
    .nt-pbtn[disabled] { opacity: .45; }
    .nt-pn { font: 800 10px var(--font-head); letter-spacing: 1.5px; color: var(--muted); margin: 0 auto; }
    .nt-addpage { background: var(--ink); color: #fff; }
    .nt-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; position: relative; }
    .nt-fbtn { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; font: 800 10px var(--font-head); letter-spacing: 1px; cursor: pointer; }
    .nt-fbtn:active { transform: translate(1.5px,1.5px); box-shadow: 1px 1px 0 var(--ink); }
    .nt-fbtn--brand { background: var(--ink); color: #fff; }
    .nt-fbtn--del { color: #c22b2b; }
    .nt-saved { font: 500 11px var(--font-body); color: var(--muted); margin-left: auto; }
    .nt-export { position: absolute; bottom: calc(100% + 6px); left: 0; display: none; flex-direction: column; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 5px 5px 0 var(--ink); overflow: hidden; z-index: 30; min-width: 180px; }
    .nt-export.on { display: flex; }
    .nt-export button { border: 0; border-bottom: 2px solid var(--surface-2); background: var(--paper); text-align: left; padding: 12px 14px; font: 700 12.5px var(--font-body); cursor: pointer; }
    .nt-export button:last-child { border-bottom: 0; }
    .nt-export button:hover { background: var(--surface-2); }
    .nt-export button i { display: block; font: 500 10px var(--font-body); font-style: normal; color: var(--muted); margin-top: 2px; }

    .nt-draw__row { display: flex; gap: 6px; align-items: center; }
    .nt-sw { width: 30px; height: 30px; border: 2.5px solid var(--ink); border-radius: 9px; cursor: pointer; }
    html.dark .nt-paperwrap::before, html.dark .nt-paperwrap::after { background: #efe9da; }
  </style>
</head>
<body>
  <main class="nt-wrap">
    <div class="nt-top">
      <button class="nt-back" id="ntMenu" type="button" hidden>☰ MENU</button><a class="nt-back" href="login.html#view-account">← YOU</a>
      <span class="nt-h">📓 MY NOTEBOOK</span>
      <button class="nt-new" id="ntNew">+ NEW NOTE</button>
    </div>
    <div id="ntBanner"></div>
    <div id="ntMain"></div>
  </main>

  <script src="js/bootguard.js?v=291"></script>
  <script src="js/prefs.js?v=291"></script>
  <script src="js/lang.js?v=291"></script>
  <script src="js/config.js?v=291"></script>
  <script src="js/auth.js?v=291"></script>
  <script src="js/sounds.js?v=291"></script>
  <script src="js/founder.js?v=291"></script>
  <script src="js/community.js?v=291"></script>
  <script src="js/gold.js?v=291"></script>
  <script src="js/dictate.js?v=291"></script>
  <script src="js/bar.js?v=291" defer></script>
  <script>
  (function () {
    "use strict";
    var KEYU = "tsb_notes_v1_";
    var MEDK = "tsb_note_media_";
    var PROMPTS = [
      "What did today's pages argue with me about?",
      "One line I underlined twice, and why.",
      "The habit this book says I should kill first.",
      "If I wrote one page to my younger self, from this chapter…",
      "A story from this book worth retelling.",
      "What am I avoiding that this book just named?",
      "One number from this book worth remembering.",
      "Where did this author sound completely wrong to me?",
      "The one sentence I keep thinking about.",
      "What would I do tomorrow if I believed this page?",
      "Who do I know who already lives this chapter?",
      "The smallest step this book pushes me to take this week."
    ];
    function uid() { try { return (window.TSB_AUTH && TSB_AUTH.user && TSB_AUTH.user() && TSB_AUTH.user().id) || "guest"; } catch (e) { return "guest"; } }
    function key() { return KEYU + uid(); }
    function mkey() { return MEDK + uid(); }
    function raw(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } }
    function rawObj(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } }
    function saveObj(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} }
    function save(arr) { try { localStorage.setItem(key(), JSON.stringify(arr)); } catch (e) {} }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
    function $(id) { return document.getElementById(id); }
    function me() {
      try { var u0 = (window.TSB_AUTH && TSB_AUTH.user && TSB_AUTH.user()) || null; if (u0) return u0; } catch (e) {}
      try { var s = JSON.parse(localStorage.getItem("tsb_auth_session")); return (s && s.user) || null; } catch (e) { return null; }
    }
    function ago(t) { var d = Date.now() - t; if (d < 6e4) return "just now"; if (d < 36e5) return Math.floor(d / 6e4) + " min ago"; if (d < 864e5) return Math.floor(d / 36e5) + " h ago"; return new Date(t).toLocaleDateString(); }

    /* ---------- the guest banner answers only after auth has spoken ---------- */
    function paintBanner() {
      var b = $("ntBanner");
      if (me()) { b.innerHTML = ""; return; }
      b.innerHTML = '<div class="nt-guest">\uD83D\uDD12 These pages live on this device. <a href="login.html" style="color:inherit;font-weight:800">Sign in</a> and they follow your account on every device you use.</div>';
    }
    paintBanner();
    function afterAuth() {
      paintBanner();
      syncFromGuest();
      notes = raw(key());
      if (!curId) list();
    }
    try { if (window.TSB_COMMUNITY && TSB_COMMUNITY.whenReady) TSB_COMMUNITY.whenReady(afterAuth); } catch (e) {}
    window.addEventListener("tsb:auth", afterAuth);
    /* v286 watchdog: whatever order auth speaks in, the banner obeys the real state.
       Checks for ~9s, then hands over to the tsb:auth listener for the rest of the session. */
    (function bannerWatch() {
      var ticks = 0;
      var iv = setInterval(function () { paintBanner(); if (++ticks >= 26) clearInterval(iv); }, 350);
    })();

    /* ---------- synchronization: guest pages follow you into your account ---------- */
    function syncFromGuest() {
      var u = uid();
      if (u === "guest") return;
      var mine = raw(key()), guest = raw(KEYU + "guest");
      if (!guest.length) return;
      var ids = {}; mine.forEach(function (n) { ids[n.id] = n; });
      var added = false;
      guest.forEach(function (g) {
        if (!ids[g.id]) { mine.push(g); added = true; }
        else {
          var m = ids[g.id];
          if ((g.updated || 0) > (m.updated || 0)) { mine = mine.map(function (n) { return n.id === g.id ? g : n; }); added = true; }
        }
      });
      if (added) { mine.sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); }); save(mine); }
    }

    var notes = raw(key()), curId = null, curPage = 0, timer = null;

    function note() { for (var i = 0; i < notes.length; i++) if (notes[i].id === curId) return notes[i]; return null; }
    function persist() { save(notes); var s = $("ntSaved"); if (s) { s.textContent = "saved \u2713 just now"; setTimeout(function () { if ($("ntSaved")) $("ntSaved").textContent = "autosaves as you write"; }, 1400); } }
    function queue() { clearTimeout(timer); timer = setTimeout(persist, 600); }

    /* ---------- big media lives in a side drawer, never as raw code in the page ---------- */
    function vstore() { return rawObj(mkey()); }
    function virtualize(html) {
      var box = document.createElement("div");
      box.innerHTML = html;
      var store = vstore(), touched = false;
      box.querySelectorAll("img, audio, source").forEach(function (el) {
        var src = el.getAttribute("src") || "";
        if (src.indexOf("data:") === 0 && src.length > 24000) {
          var id = "m" + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36);
          store[id] = src; touched = true;
          el.setAttribute("data-ntv", id);
          el.removeAttribute("src");
        }
      });
      if (touched) { saveObj(mkey(), store); try { var keys = Object.keys(store); if (keys.length > 80) { delete store[keys[0]]; saveObj(mkey(), store); } } catch (e) {} }
      return box.innerHTML;
    }
    function materialize(html) {
      if (html.indexOf("data-ntv") < 0) return html;
      var box = document.createElement("div");
      box.innerHTML = html;
      var store = vstore();
      box.querySelectorAll("[data-ntv]").forEach(function (el) {
        var id = el.getAttribute("data-ntv");
        if (store[id]) { el.src = store[id]; el.removeAttribute("data-ntv"); }
      });
      return box.innerHTML;
    }

    /* ---------- the cover ---------- */
    function list() {
      if (pen.on) endPen(true);
      curId = null;
      var mb = $("ntMenu"); if (mb) mb.hidden = true;
      var m = $("ntMain");
      var h = '<div class="nt-cover">' +
        '<div class="nt-cover__word"><b>THE SMALL BOOK</b><i>NOTES \u00b7 PRIVATE \u00b7 ' + notes.length + (notes.length === 1 ? " ENTRY" : " ENTRIES") + '</i><span class="nt-cover__rule"></span></div>' +
        '<div class="nt-toc"><div class="nt-toc__h">CONTENTS</div>';
      if (!notes.length) h += '<div class="nt-empty"><b>The first page is yours.</b> One line is enough. The notebook forgives everything after it.</div>';
      notes.forEach(function (n) {
        var snip = String(materialize(n.pages[0] || "")).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 46);
        h += '<div class="nt-entry" data-n="' + n.id + '" role="button" tabindex="0"><span class="nt-entry__fold">\uD83D\uDCD3</span><span class="nt-entry__mid"><b class="nt-entry__t">' + esc(n.title || "Untitled") + '</b><i class="nt-entry__s">' + esc(snip || "An empty page, waiting for its first line.") + '</i><span class="nt-entry__m">' + (n.pages.length > 1 ? n.pages.length + " pages \u00b7 " : "1 page \u00b7 ") + ago(n.updated) + ' \u00b7 tap to open</span></span><button class="nt-entry__x" data-x="' + n.id + '" title="Delete">\u2715</button></div>';
      });
      h += "</div></div>";
      m.innerHTML = h;
      m.querySelectorAll("[data-n]").forEach(function (e) { e.addEventListener("click", function () { open(e.getAttribute("data-n")); }); });
      m.querySelectorAll("[data-x]").forEach(function (e) { e.addEventListener("click", function (ev) { ev.stopPropagation(); del(e.getAttribute("data-x")); }); });

      pen.on = false;
      var pb = $("ntPenBtn"); if (pb) { pb.style.background = ""; pb.style.color = ""; }
      var pop = $("ntPen"); if (pop) pop.remove();
      var cv = pen.cv; pen.cv = null;
      if (!cv) return;
      if (save) {
        var blank = true;
        try { var px2 = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; for (var i = 3; i < px2.length; i += 40) { if (px2[i]) { blank = false; break; } } } catch (e) {}
        if (!blank) {
          var body0 = $("ntBody");
          if (body0) {
            var br = body0.getBoundingClientRect(), cr = cv.getBoundingClientRect();
            var img = document.createElement("img");
            img.src = cv.toDataURL("image/png");
            img.style.cssText = "position:absolute;left:" + Math.max(0, Math.round(cr.left - br.left)) + "px;top:" + Math.max(0, Math.round(cr.top - br.top)) + "px;width:100%;pointer-events:none";
            body0.style.position = "relative";
            body0.appendChild(img);
          }
        }
      }
      cv.remove();
      var n = note(); if (n) { n.pages[curPage] = virtualize($("ntBody").innerHTML); n.updated = Date.now(); queue(); }
    }

     /* ---------- export: four doors, one clean document ---------- */
    function gather(n) {
      return {
        title: n.title || "Untitled note",
        pages: (n.pages || []).map(function (p) { return materialize(p || ""); })
      };
    }
    /* v287: the free mark, redesigned — a quiet signature, not a shout.
       Premium (Gold) writers export clean. */
    function wm() { try { if (window.TSB_GOLD && TSB_GOLD.isGold && TSB_GOLD.isGold()) return ""; } catch (e) {} return "\u00b7 written with thesmallbook \u00b7"; }
    function docHTML(n) {
      var g = gather(n);
      var bodyPages = g.pages.map(function (p, i) {
        return '<section class="pg"><div class="pgno">Page ' + (i + 1) + " of " + g.pages.length + '</div>' + (p || "<p><i>(an empty page, on purpose)</i></p>") + "</section>";
      }).join("");
      return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(g.title) + '</title><style>' +
        "body{font:15px/1.8 Georgia,'Times New Roman',serif;color:#26221a;background:#fff;margin:0;padding:44px 52px}" +
        ".kick{font:800 10px 'Trebuchet MS',sans-serif;letter-spacing:3px;color:#8f8570;margin:0 0 8px}" +
        "h1{font-size:30px;margin:0 0 4px;border-bottom:3px solid #26221a;padding-bottom:12px}" +
        ".meta{font:500 12px 'Trebuchet MS',sans-serif;color:#8f8570;margin:10px 0 26px}" +
        ".pg{padding:18px 0;border-bottom:1.5px dashed #cfc7b2}.pg:last-child{border-bottom:0}" +
        ".pgno{font:800 9.5px 'Trebuchet MS',sans-serif;letter-spacing:2px;color:#b0a88f;margin-bottom:10px}" +
        "img{max-width:100%;border:2px solid #26221a;border-radius:8px;margin:8px 0}" +
        ".nt-chip{display:inline-flex;align-items:center;gap:8px;border:2px solid #26221a;border-radius:10px;padding:6px 10px;font:600 12px 'Trebuchet MS',sans-serif}" +
        ".nt-chip audio{display:none}" +
        ".brand{margin-top:30px;padding-top:16px;border-top:2.5px solid #26221a;font:600 12px 'Trebuchet MS',sans-serif;color:#8f8570;text-align:center}" +
        "@page{margin:14mm}" +
        "</style></head><body>" +
        "<p class='kick'>PERSONAL NOTES \u00b7 THESMALLBOOK</p><h1>" + esc(g.title) + "</h1>" +
        "<p class='meta'>" + g.pages.length + " page" + (g.pages.length === 1 ? "" : "s") + " \u00b7 " + new Date(n.updated).toLocaleDateString() + "</p>" +
        bodyPages +
        (wm() ? "<div class='brand'>" + wm() + "</div>" : "") + "</body></html>";
    }
    function exportPDF(n) {
      var iframe = document.createElement("iframe");
      iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
      document.body.appendChild(iframe);
      iframe.srcdoc = docHTML(n);
      iframe.onload = function () { try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) {} setTimeout(function () { iframe.remove(); }, 60000); };
      $("ntSaved").textContent = "choose Save as PDF in the print sheet";
    }
    function download(blob, name) { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
    function exportWord(n) {
      var doc = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--><style>body{font:12pt Georgia;line-height:1.7}h1{font-size:20pt;border-bottom:2px solid #26221a}.pgno{font:8pt Trebuchet MS;color:#8f8570;letter-spacing:2px}img{max-width:100%}</style></head><body>" +
        "<p style='font:8pt Trebuchet MS;letter-spacing:3px;color:#8f8570'>PERSONAL NOTES \u00b7 THESMALLBOOK</p><h1>" + esc(gather(n).title) + "</h1>" +
        gather(n).pages.map(function (p, i) { return "<div class='pgno'>PAGE " + (i + 1) + "</div>" + p; }).join("<br clear=all style='page-break-before:always'>") +
        (wm() ? "<p style='font:8pt Trebuchet MS;letter-spacing:2.5px;color:#8f8570;text-align:center;margin-top:24pt'>" + wm() + "</p>" : "") + "</body></html>";
      download(new Blob(["\ufeff", doc], { type: "application/msword" }), (gather(n).title).replace(/[^\w\u0900-\u097F -]/g, "").trim().slice(0, 40) + ".doc");
      $("ntSaved").textContent = "word file downloaded \u2713";
    }
    async function exportPNG(n) {
      var g = gather(n);
      $("ntSaved").textContent = "drawing your pages\u2026";
      try {
        var W = 900, M = 56, LH = 40;
        var procs = [];
        g.pages.forEach(function (p) {
          var box = document.createElement("div"); box.innerHTML = p;
          box.querySelectorAll("audio").forEach(function (a) { var s = document.createElement("div"); s.textContent = "[ voice note ]"; a.replaceWith(s); });
          procs.push(box);
        });
        try { await document.fonts.load('21px "Special Elite"'); await document.fonts.ready; } catch (e) {}
        /* first pass: measure */
        var blocks = [];
        blocks.push({ t: "title", s: g.title });
        procs.forEach(function (box) {
          Array.prototype.slice.call(box.childNodes).forEach(function walk(node) {
            if (node.nodeType === 3) {
              var txt = String(node.textContent || "").replace(/\s+/g, " ").trim();
              if (txt) txt.split("\n").forEach(function (line) { blocks.push({ t: "text", s: line }); });
            } else if (node.nodeType === 1) {
              if (node.tagName === "IMG") blocks.push({ t: "img", s: node.getAttribute("src") || "" });
              else if (node.tagName === "AUDIO" || node.closest && node.closest(".nt-chip")) { blocks.push({ t: "text", s: "[ voice note ]" }); }
              else Array.prototype.slice.call(node.childNodes).forEach(walk);
            }
          });
        });
        var ctx0 = document.createElement("canvas").getContext("2d");
        ctx0.font = '21px "Special Elite", Georgia';
        function wrap(t) {
          var words = String(t).split(" "), lines = [], cur = "";
          words.forEach(function (wd) {
            var test = cur ? cur + " " + wd : wd;
            if (ctx0.measureText(test).width > W - M * 2) { if (cur) lines.push(cur); cur = wd; }
            else cur = test;
          });
          if (cur) lines.push(cur);
          return lines.length ? lines : [""];
        }
        var flow = [];
        blocks.forEach(function (b) {
          if (b.t === "img") {
            flow.push({ t: "img", s: b.s, h: 0 });
          } else if (b.t === "title") {
            wrap(b.s).forEach(function (l) { flow.push({ t: "title", s: l, h: 56 }); });
          } else wrap(b.s).forEach(function (l) { flow.push({ t: "text", s: l, h: LH }); });
        });
        var loaded = await Promise.all(flow.filter(function (f) { return f.t === "img" && f.s && f.s.indexOf("data:") === 0; }).map(function (f) {
          return new Promise(function (res) { var im = new Image(); im.onload = function () { res({ f: f, im: im }); }; im.onerror = function () { res(null); }; im.src = f.s; });
        }));
        loaded.filter(Boolean).forEach(function (o) {
          var sc = Math.min(1, (W - M * 2) / o.im.width);
          o.f.iw = o.im.width * sc; o.f.ih = o.im.height * sc; o.f.im_ = o.im; o.f.h = o.f.ih + 20;
        });
        flow.forEach(function (f) { if (f.t === "img" && !f.h) f.h = 30; });
        var H = M * 2 + 70 + flow.reduce(function (a, f) { return a + f.h + 8; }, 0) + 60;
        var c = document.createElement("canvas"); c.width = W; c.height = Math.min(H, 16000);
        var x = c.getContext("2d");
        x.fillStyle = "#fffdf6"; x.fillRect(0, 0, W, c.height);
        var y = M + 30;
        flow.forEach(function (f) {
          if (f.t === "title") { x.font = '800 30px "Space Grotesk", Arial'; x.fillStyle = "#26221a"; x.fillText(f.s, M, y + 34); }
          else if (f.t === "text") { x.font = '21px "Special Elite", Georgia'; x.fillStyle = "#26221a"; x.fillText(f.s, M, y + 28); }
          else if (f.t === "img" && f.im_) { x.drawImage(f.im_, M, y, f.iw, Math.min(f.ih, c.height - y - M)); y += Math.min(f.ih, c.height - y - M) - 20; }
          y += f.h + 8;
        });
        if (wm()) { try { x.letterSpacing = "3px"; } catch (e) {} x.font = '500 13px "Space Grotesk", Arial'; x.fillStyle = "#b3ab97"; x.textAlign = "center"; x.fillText(wm(), W / 2, c.height - 22); }
        c.toBlob(function (blob) { if (blob) { download(blob, (g.title).replace(/[^\w\u0900-\u097F -]/g, "").trim().slice(0, 40) + ".png"); $("ntSaved").textContent = "png downloaded \u2713"; } });
      } catch (e) { $("ntSaved").textContent = "png failed, try again"; }
    }
    /* ---------- the reader link: a living page, like an ebook ----------
       v288: EXPORT AS FILE -> READER LINK turns the note into a small
       standalone page with a real page-turn, a header, and the small book
       brand. It uploads as one file and hands you a link to share. Free
       writers get four a month; Gold writes without limits. The card
       remains where it belongs: the SHARE button. */
    function readerHTML(n) {
      var g = gather(n);
      var pages = g.pages.map(function (p) { return '<section class="pg">' + p + "</section>"; }).join("");
      return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(g.title) + ' \u00b7 thesmallbook</title>' +
        "<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#14110c;font-family:Georgia,'Times New Roman',serif;color:#26221a;min-height:100vh}.top{background:#0e0c0a;color:#8a8a80;font:800 10px 'Trebuchet MS',sans-serif;letter-spacing:3px;text-align:center;padding:15px 10px}.top b{color:#ffc800}.stage{perspective:1700px;max-width:680px;margin:26px auto;padding:0 16px}.pg{display:none;background:#fffdf6;border-radius:10px;padding:46px 42px;min-height:62vh;font:17px/1.95 Georgia;line-height:1.95;box-shadow:0 18px 50px rgba(0,0,0,.55);border-left:5px solid #d64545}.pg.on{display:block;animation:turn .55s cubic-bezier(.2,.7,.3,1)}.pg img{max-width:100%;border-radius:6px;margin:10px 0;border:2px solid #26221a}.pg audio{width:100%;margin:12px 0}@keyframes turn{from{transform:rotateY(-9deg) translateX(34px);opacity:.15}to{transform:none;opacity:1}}.hint{color:#8a8a80;text-align:center;font:600 12px 'Trebuchet MS',sans-serif;letter-spacing:2px;padding:20px 10px}.hint button{background:#ffc800;border:2.5px solid #0e0c0a;border-radius:999px;padding:12px 22px;font:800 12px 'Trebuchet MS',sans-serif;letter-spacing:1px;cursor:pointer;box-shadow:3px 3px 0 #0e0c0a}.foot{color:#6f6a5e;text-align:center;font:600 11px 'Trebuchet MS',sans-serif;letter-spacing:2px;padding:24px 10px}.foot b{color:#cfcabe}</style></head><body>" +
        '<div class="top">THE SMALL BOOK \u00b7 <b>A NOTE WORTH SLOW READING</b></div>' +
        '<div class="stage">' + pages + "</div>" +
        '<div class="hint"><button id="nx">NEXT PAGE \u203a</button><div id="pn" style="margin-top:12px"></div></div>' +
        '<div class="foot">written with \uD83D\uDCD3 <b>thesmallbook.in</b> \u00b7 notes that stay</div>' +
        "<script>(function(){var p=document.querySelectorAll('.pg'),i=0;function paint(){for(var k=0;k<p.length;k++)p[k].classList.toggle('on',k===i);document.getElementById('pn').textContent='PAGE '+(i+1)+' OF '+p.length;document.getElementById('nx').textContent=i<p.length-1?'NEXT PAGE \\u203a':'THE END \\u2713';}function go(){if(i<p.length-1){i++;paint();}}document.getElementById('nx').addEventListener('click',go);document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go();});var sx=null;document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;});document.addEventListener('touchend',function(e){if(sx===null)return;if(sx-e.changedTouches[0].clientX>50)go();sx=null;});paint();})();<\/script></body></html>";
    }
    async function exportReader(n) {
      var g = gather(n);
      var quota = { n: 0, m: new Date().getMonth() };
      try { quota = JSON.parse(localStorage.getItem("tsb_reader_n")) || quota; } catch (e) {}
      if (quota.m !== new Date().getMonth()) quota = { n: 0, m: new Date().getMonth() };
      var gold = false; try { gold = !!(window.TSB_GOLD && TSB_GOLD.isGold && TSB_GOLD.isGold()); } catch (e) {}
      if (!gold && quota.n >= 4) { $("ntSaved").textContent = "reader links: 4 free used this month \u00b7 gold writes without limits"; return; }
      $("ntSaved").textContent = "building your reader\u2026";
      var html = readerHTML(n);
      var link = "";
      var u = me();
      if (u && window.TSB_COMMUNITY && TSB_COMMUNITY.upload) {
        try {
          var slug = (g.title || "note").replace(/[^\w\u0900-\u097F -]/g, "").trim().slice(0, 40).replace(/\s+/g, "-").toLowerCase() || "note";
          var file = new File([html], slug + "-thesmallbook.html", { type: "text/html" });
          link = await TSB_COMMUNITY.upload(file, "tsb-covers");
        } catch (e) { link = ""; }
      }
      if (link) {
        if (!gold) { quota.n++; try { localStorage.setItem("tsb_reader_n", JSON.stringify(quota)); } catch (e) {} }
        var left = gold ? "" : " \u00b7 " + (4 - quota.n) + " free left this month";
        try {
          if (navigator.share) { await navigator.share({ title: g.title || "A note from my notebook", url: link }); $("ntSaved").textContent = "reader shared \u2713" + left; }
          else { await navigator.clipboard.writeText(link); $("ntSaved").textContent = "reader link copied \u2713 paste it anywhere" + left; }
        } catch (e) { $("ntSaved").textContent = "your reader link: " + link; }
      } else {
        download(new Blob([html], { type: "text/html" }), (g.title || "note").replace(/[^\w\u0900-\u097F -]/g, "").trim().slice(0, 40) + "-reader.html");
        $("ntSaved").textContent = u ? "the link could not upload, the reader file is downloaded instead" : "sign in for a live link \u00b7 the reader file is downloaded for now";
      }
    }
    async function exportCard(n, dl) {
      var g = gather(n);
      var first = String(g.pages.join(" ")).replace(/<img[^>]*>/g, " ").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 220);
      var W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
      var x = c.getContext("2d");
      /* the desk */
      x.fillStyle = "#14110c"; x.fillRect(0, 0, W, H);
      /* one cream sheet, slightly alive */
      x.save(); x.translate(60, 176); x.rotate(-0.012);
      x.fillStyle = "#fffdf6"; x.fillRect(0, 0, 960, 950);
      for (var ry = 150; ry < 950; ry += 52) { x.strokeStyle = "#ece5d1"; x.lineWidth = 2; x.beginPath(); x.moveTo(30, ry); x.lineTo(930, ry); x.stroke(); }
      x.strokeStyle = "#d64545"; x.lineWidth = 3; x.beginPath(); x.moveTo(96, 0); x.lineTo(96, 950); x.stroke();
      x.strokeStyle = "#241f14"; x.lineWidth = 5; x.strokeRect(0, 0, 960, 950);
      x.fillStyle = "#efe6cd"; x.beginPath(); x.moveTo(960, 0); x.lineTo(960, 104); x.lineTo(856, 0); x.closePath(); x.fill();
      x.strokeStyle = "#241f14"; x.lineWidth = 4; x.beginPath(); x.moveTo(960, 104); x.lineTo(856, 0); x.stroke();
      x.restore();
      x.textAlign = "center";
      try { x.letterSpacing = "7px"; } catch (e) {}
      x.fillStyle = "#8a8a80"; x.font = "800 23px 'Trebuchet MS',Arial";
      x.fillText("F R O M   M Y   N O T E B O O K", W / 2, 92);
      try { x.letterSpacing = "0px"; } catch (e) {}
      var words = (g.title || "Untitled").split(" "), line = "", lines = [];
      words.forEach(function (wd) { var t = line ? line + " " + wd : wd; if (t.length > 16) { lines.push(line); line = wd; } else line = t; });
      if (line) lines.push(line);
      x.fillStyle = "#241f14"; x.font = "600 92px Caveat, Georgia";
      (lines.slice(0, 2)).forEach(function (l, i) { x.fillText(l, W / 2, 250 + i * 104); });
      x.textAlign = "left";
      x.fillStyle = "#4a4335"; x.font = "400 34px 'Special Elite', Georgia";
      var l2 = first.match(/.{1,40}(\s|$)/g) || [" "];
      var ly = 508;
      (l2.slice(0, 9)).forEach(function (l) { x.fillText(l.trim(), 136, ly); ly += 52; });
      if (wm()) {
        x.textAlign = "right";
        try { x.letterSpacing = "2px"; } catch (e) {}
        x.fillStyle = "#a89e88"; x.font = "500 21px 'Trebuchet MS',Arial";
        x.fillText("written with thesmallbook.in", W - 74, H - 70);
        try { x.letterSpacing = "0px"; } catch (e) {}
      }
      return await new Promise(function (res) {
        c.toBlob(async function (blob) {
          if (!blob) return res(null);
          if (dl) { download(blob, (g.title || "my-note").replace(/[^\w\u0900-\u097F -]/g, "").trim().slice(0, 40) + "-card.png"); $("ntSaved").textContent = "card downloaded \u2713"; }
          res(blob);
        }, "image/png");
      });
    }
    async function shareOne() {
      var n = note(); if (!n) return;
      try {
        var blob = await exportCard(n, false);
        var file = blob && new File([blob], "my-note-card.png", { type: "image/png" });
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: n.title || "My note" });
        else if (navigator.share) await navigator.share({ title: (n.title || "My note") + " \u00b7 TheSmallBook", text: (n.title ? n.title + "\n\n" : "") + String(gather(n).pages.join(" ")).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 600) });
        else exportCard(n, true);
      } catch (e) {}
    }

    /* ---------- boot ---------- */
    $("ntMenu").addEventListener("click", function () { list(); });
    $("ntNew").addEventListener("click", function () {
      var n = { id: "n" + Date.now() + Math.floor(Math.random() * 999), title: "", pages: [""], created: Date.now(), updated: Date.now() };
      notes.unshift(n); persist(); open(n.id, 0);
    });
    (function boot() {
      var h = location.hash || "";
      var m = h.match(/#n=([\w-]+)/);
      if (m && notes.some(function (n) { return n.id === m[1]; })) open(m[1], 0);
      else list();
    })();
    function persistNow() { clearTimeout(timer); var b = $("ntBody"); var n = note(); if (b && n) n.pages[curPage] = virtualize(b.innerHTML); save(notes); }
    window.addEventListener("pagehide", persistNow);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") persistNow(); });
  })();
