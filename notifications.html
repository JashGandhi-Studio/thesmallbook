<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta property="og:title" content="Notifications, TheSmallBook">
  <meta property="og:description" content="Likes, comments, follows and messages, all in one quiet list.">
  <meta property="og:image" content="https://thesmallbook.in/assets/og-image.png?v=275">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://thesmallbook.in/notifications.html">
  <meta property="og:type" content="website">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <title>Notifications, TheSmallBook</title>
  <meta name="description" content="Your likes, comments, followers and messages, all in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc800">
  <script>
    try {
      var tsbDark = localStorage.getItem("tsb_theme") === '"dark"';
      if (tsbDark) document.documentElement.classList.add("dark");
      var tsbTC = document.querySelector('meta[name="theme-color"]');
      if (!tsbTC) { tsbTC = document.createElement("meta"); tsbTC.name = "theme-color"; document.head.appendChild(tsbTC); }
      tsbTC.content = tsbDark ? "#16130e" : "#ffc800";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=275">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="cmpage notifpage">
  <header class="cm-top">
    <a class="cm-top__back" id="ntBack" href="stories.html" aria-label="Back">←</a>
    <h1 class="cm-top__t"><svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg> Notifications &amp; updates</h1>
    <span></span>
  </header>

  <main class="cm-wrap">
    <!-- v250: a real notification centre. Unread items are flagged once;
         opening anything marks it read and it stays here as history. -->
    <div class="nt-tools" id="nTools" hidden>
      <div class="nt-filters" role="tablist" aria-label="Filter notifications">
        <button class="on" data-nfilter="all" role="tab" aria-selected="true">All <b id="nCountAll">0</b></button>
        <button data-nfilter="unread" role="tab" aria-selected="false">Unread <b id="nCountNew">0</b></button>
      </div>
      <button class="nt-markall" id="nMarkAll" type="button" aria-pressed="false">
        <svg class="tsb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        Mark all read
      </button>
    </div>
    <!-- v250 · follow requests from private accounts waiting on YOU -->
    <div id="nReqs" hidden></div>
    <div id="nList" class="nt-list">
      <div class="cm-empty cm-empty--sm">Loading your updates…</div>
    </div>
  </main>

  <script src="./js/bootguard.js?v=275"></script>
  <script src="js/vault.js?v=275"></script>
  <script src="js/prefs.js?v=275"></script>
  <script src="js/lang.js?v=275"></script>
  <script src="js/config.js?v=275"></script>
  <script src="js/auth.js?v=275"></script>
  <script src="js/sounds.js?v=275"></script>
  <script src="js/founder.js?v=275"></script>
  <script src="js/community.js?v=275"></script>
  <script>
  (function () {
    "use strict";
    var C = window.TSB_COMMUNITY;
    var list = document.getElementById("nList");
    var tools = document.getElementById("nTools");
    var ITEMS = [];
    var filter = "all";

    /* smart back: return to wherever the reader came from (You or Stories) */
    (function () {
      var back = document.getElementById("ntBack");
      if (!back) return;
      back.addEventListener("click", function (e) {
        try {
          var ref = document.referrer ? new URL(document.referrer) : null;
          if (ref && ref.host === location.host && history.length > 1) { e.preventDefault(); history.back(); }
        } catch (err) {}
      });
    })();

    var ICON = { like: C.icon('heart'), comment: C.icon('chat'), follow: C.icon('user'), dm: C.icon('mail') };

    function skeleton(n) {
      var out = "";
      for (var i = 0; i < (n || 4); i++) {
        out += '<div class="nt-row nt-row--skel"><div class="cm-sk cm-sk--ava"></div>' +
               '<div class="nt-row__meta"><div class="cm-sk cm-sk--line w60"></div>' +
               '<div class="cm-sk cm-sk--line w90"></div></div></div>';
      }
      return out;
    }

    function row(n) {
      /* v250: "unread" now comes from the ONE read ledger, so a notification
         you already opened (tapped a toast, replied in the thread, viewed the
         profile) never comes back wearing a NEW badge. It stays here as history. */
      var unread = !C.notifIsRead(n);
      var href = n.type === "dm" ? "dm.html?u=" + n.who
        : n.type === "follow" ? "profile.html?id=" + n.who
        : "story.html?id=" + n.post;
      var what = n.type === "like" ? "liked your story"
        : n.type === "comment" ? "commented on your story"
        : n.type === "follow" ? "started following you"
        : n.audio ? "sent you a voice message"
        : "sent you a message";
      var cta = n.type === "dm" ? "Reply →" : n.type === "follow" ? "View profile →" : "Open story →";
      var av = C.avaUrl(n.name, n.avatar, n.who);
      return '<div class="nt-row' + (unread ? " new" : " read") + '" data-nkey="' + C.esc(C.notifKey(n)) + '">' +
        '<a href="profile.html?id=' + n.who + '" aria-label="' + C.esc(n.name) + '"><span class="cm-ava cm-ava--lg">' + (av ? '<img src="' + C.esc(av) + '" alt="" loading="lazy">' : "<span>" + C.esc((n.name || "R").charAt(0).toUpperCase()) + "</span>") + '</span></a>' +
        '<div class="nt-row__meta">' +
          '<b><a class="nt-name" href="profile.html?id=' + n.who + '">' + C.esc(n.name) + (C.isOfficial(n.who) ? '<span class="cm-vtick">✔</span>' : "") + '</a> <span>' + what + '</span></b>' +
          (n.title ? '<em>“' + C.esc(n.title) + '”</em>' : "") +
          (n.body ? '<em class="nt-body">' + C.esc(String(n.body)).slice(0, 90) + '</em>' : "") +
          '<a class="nt-cta" href="' + href + '">' + cta + ' · <span class="cm-time">' + C.ago(n.at) + '</span></a>' +
        '</div>' +
        '<a class="nt-ico" href="' + href + '" aria-label="' + cta + '">' + (ICON[n.type] || "•") + '</a>' +
      '</div>';
    }

    function paint() {
      var unread = C.notifUnread(ITEMS);
      var shown = filter === "unread" ? unread : ITEMS;
      var cAll = document.getElementById("nCountAll");
      var cNew = document.getElementById("nCountNew");
      if (cAll) cAll.textContent = ITEMS.length;
      if (cNew) cNew.textContent = unread.length;
      var markAll = document.getElementById("nMarkAll");
      if (markAll) {
        markAll.hidden = unread.length === 0;
        markAll.setAttribute("aria-pressed", unread.length === 0 ? "true" : "false");
      }
      if (!ITEMS.length) {
        list.innerHTML = '<div class="cm-empty">Nothing yet, your likes, comments, new followers and messages will land here.<br><a class="cm-write" href="stories.html">← Back to Stories</a></div>';
        return;
      }
      if (!shown.length) {
        list.innerHTML = '<div class="cm-empty cm-empty--sm">No unread notifications, you are all caught up ✨</div>';
        return;
      }
      list.innerHTML = (filter === "all" && unread.length
        ? '<div class="cm-sect">' + unread.length + ' unread · everything stays here as history</div>'
        : '') + shown.map(row).join("");
    }

    /* opening anything from this list marks THAT notification read at once,
       so a back-button return never shows it as new again */
    list.addEventListener("click", function (e) {
      var r = e.target.closest ? e.target.closest(".nt-row") : null;
      if (!r) return;
      var k = r.getAttribute("data-nkey");
      if (k) { try { C.notifMarkRead([k]); } catch (err) {} }
      r.classList.remove("new"); r.classList.add("read");
      try { C.paintNotifUI(ITEMS); } catch (err) {}
      var cNew = document.getElementById("nCountNew");
      if (cNew) cNew.textContent = C.notifUnread(ITEMS).length;
    });

    document.querySelectorAll("[data-nfilter]").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.getAttribute("data-nfilter");
        document.querySelectorAll("[data-nfilter]").forEach(function (x) {
          var on = x === b;
          x.classList.toggle("on", on);
          x.setAttribute("aria-selected", on ? "true" : "false");
        });
        paint();
      });
    });

    document.getElementById("nMarkAll").addEventListener("click", function () {
      try { C.notifMarkRead(ITEMS.map(C.notifKey)); } catch (e) {}
      try { C.paintNotifUI(ITEMS); } catch (e) {}
      paint();
    });

    C.whenReady(async function () {
      if (!C.signedIn()) {
        list.innerHTML = '<div class="cm-empty">Sign in to see your notifications.<br><a class="cm-write" href="login.html">Sign in, it’s free →</a></div>';
        return;
      }
      list.innerHTML = skeleton(4);

      /* ---- v250 · PRIVATE-ACCOUNT FOLLOW REQUESTS ----------------------
         A request IS a notification: it appears here, with the two buttons
         that decide it, so nobody has to go hunting. Accepting writes your
         own profile row only, the other phone then completes the follow. */
      var reqBox = document.getElementById("nReqs");
      function paintReqs(waits) {
        if (!reqBox) return;
        if (!waits || !waits.length) { reqBox.hidden = true; reqBox.innerHTML = ""; return; }
        reqBox.hidden = false;
        reqBox.innerHTML = '<div class="cm-req"><div class="cm-req__t">\ud83d\udd10 Follow requests <span class="cm-req__n">' +
          waits.length + '</span><span class="cm-time" style="margin-left:auto">nobody sees your stories until you accept</span></div>' +
          waits.map(function (p) {
            return '<div class="cm-req__row" data-nreqrow="' + p.id + '">' +
                '<div class="cm-ava cm-ava--sm"><span>' + C.esc(String(p.name || "R").charAt(0).toUpperCase()) + "</span></div>" +
                '<div class="cm-req__meta"><a class="cm-name" href="profile.html?id=' + p.id + '">' + C.esc(p.name || "A reader") + "</a>" +
                  '<span class="cm-time">' + (p.posts ? p.posts + " stories \u00b7 " : "") + "private account</span></div>" +
                '<div class="cm-req__btns">' +
                  '<button class="cm-reqbtn cm-reqbtn--ok" data-nreqok="' + p.id + '">Accept</button>' +
                  '<button class="cm-reqbtn cm-reqbtn--no" data-nreqno="' + p.id + '">Decline</button>' +
                "</div></div>";
          }).join("") + "</div>";
      }
      async function refreshReqs() {
        try {
          var people = await C.allPeople();
          try { await C.settleRequests(people); } catch (e3) {}
          var me = C.me();
          paintReqs(C.pendingTo(people, me && me.id));
        } catch (e) { paintReqs([]); }
      }
      if (reqBox) {
        reqBox.addEventListener("click", async function (e) {
          var okB = e.target.closest ? e.target.closest("[data-nreqok]") : null;
          var noB = e.target.closest ? e.target.closest("[data-nreqno]") : null;
          if (!okB && !noB) return;
          var btn = okB || noB, id2 = btn.getAttribute(okB ? "data-nreqok" : "data-nreqno");
          btn.disabled = true;
          try {
            var all = [];
            try { all = await C.allPeople(); } catch (e2) {}
            var person = all.filter(function (x) { return x && x.id === id2; })[0] || { id: id2 };
            if (okB) {
              await C.acceptFollowRequest(person);
              C.say("\u2705 Accepted, they now follow you.");
            } else {
              await C.declineFollowRequest(person);
              C.say("Declined, your stories stay private.");
            }
            await refreshReqs();
          } catch (err) { C.say("Couldn't do that, " + (err && err.message ? err.message : err)); }
          btn.disabled = false;
        });
      }
      try { await refreshReqs(); } catch (e) {}

      (async function () {
        try { ITEMS = await C.notifications(); } catch (e) { ITEMS = []; }
        if (tools) tools.hidden = false;
        /* Paint FIRST with the true unread state so the reader can see what
           arrived, then fold everything into the read ledger: the badges and
           the red dot clear, and the items remain as history. */
        paint();
        try { C.paintNotifUI(ITEMS); } catch (e) {}
        try { localStorage.setItem("tsb_notif_seen", String(Date.now())); } catch (e) {}
        setTimeout(function () {
          try { C.notifMarkRead(ITEMS.map(C.notifKey)); } catch (e) {}
          try { C.paintNotifUI(ITEMS); } catch (e) {}
          var cNew = document.getElementById("nCountNew");
          if (cNew) cNew.textContent = "0";
          var markAll = document.getElementById("nMarkAll");
          if (markAll) { markAll.hidden = true; markAll.setAttribute("aria-pressed", "true"); }
        }, 1600);
      })();
    });
  })();
  </script>
  <script src="js/bar.js?v=275" defer></script>
</body>
</html>
