<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Home — TheSmallBook</title>
  <meta name="description" content="Your feed — lessons, quotes and real-world autopsies from 350 books and 300 failures.">
  <meta name="theme-color" content="#ffc800">
  <script>/* pre-paint theme: no flash, supports light|dark|auto */
try{var m=localStorage.getItem("tsb_theme");m=m?JSON.parse(m):"light";
var d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
if(d)document.documentElement.classList.add("dark");
if(m==="auto")document.documentElement.classList.add("theme-auto");
document.documentElement.setAttribute("data-theme",m);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="feedpage">

<header class="tsb-topbar">
  <a class="tsb-topbar__logo" href="index.html" aria-label="TheSmallBook">
    <img src="assets/loader-logo.png" alt="" width="36" height="36">
  </a>
  <a class="tsb-search" href="index.html#library" aria-label="Search books">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search 350 books…</span>
  </a>
  <a class="tsb-iconbtn" href="chat.html" aria-label="Ask the library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/>
    </svg>
  </a>
</header>

<main class="fd-wrap">
  <div class="fd-head">
    <div>
      <h2 id="fdGreet">Today</h2>
      <p id="fdSub">Lessons, quotes and autopsies picked for you</p>
    </div>
  </div>
  <div id="tsbFeed">
    <div class="tsb-skel" style="height:220px;border-radius:var(--r-lg);margin-bottom:16px"></div>
    <div class="tsb-skel" style="height:180px;border-radius:var(--r-lg);margin-bottom:16px"></div>
    <div class="tsb-skel" style="height:240px;border-radius:var(--r-lg)"></div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/failures.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/feed.js"></script>
<script src="js/theme.js"></script>
<script defer src="js/shell.js"></script>
<script>
(function () {
  var h = new Date().getHours();
  var g = h < 12 ? "Good morning" : (h < 17 ? "Good afternoon" : "Good evening");
  var el = document.getElementById("fdGreet");
  if (el) el.textContent = g;
})();
</script>
</body>
</html>
