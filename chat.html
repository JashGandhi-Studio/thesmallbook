<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat — Ask the Library | TheSmallBook</title>
  <meta name="description" content="Ask anything. TheSmallBook answers from 350 books, 2176 lessons and 300 real-world autopsies — with the exact lesson to read next.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffc800">
  <script>/* pre-paint theme: no flash, supports light|dark|auto */
try{var m=localStorage.getItem("tsb_theme");m=m?JSON.parse(m):"light";
var d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
if(d)document.documentElement.classList.add("dark");
if(m==="auto")document.documentElement.classList.add("theme-auto");
document.documentElement.setAttribute("data-theme",m);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="chatpage">

<header class="chat-top">
  <a class="chat-top__back" href="index.html" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="chat-top__title">
    <h1>ASK THE LIBRARY</h1>
    <span id="chatSub">350 books · 300 autopsies</span>
  </div>
  <button class="chat-top__new" id="chatLib" aria-label="Question library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h7v15H4z"/><path d="M13 5h7v15h-7z"/><path d="M4 9h7"/><path d="M13 9h7"/>
    </svg>
  </button>
  <button class="chat-top__new" id="chatNew" aria-label="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>
</header>

<main class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="Conversation">
  <!-- welcome + messages injected by js/chat.js -->
</main>

<div class="chat-suggest" id="chatSuggest" hidden></div>

<form class="chat-dock" id="chatForm" autocomplete="off">
  <div class="chat-dock__in">
    <input id="chatInput" type="text" inputmode="text"
           placeholder="Ask something to start…"
           aria-label="Ask the library a question" maxlength="300">
    <button type="submit" id="chatSend" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</form>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/failures.js"></script>
<script src="js/ask-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/ask-core.js"></script>
<script src="js/chat.js"></script>
<script src="js/theme.js"></script>
<script defer src="js/shell.js"></script>
</body>
</html>
